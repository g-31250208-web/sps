            if (!dateStr) return "N/A";
            const parts = dateStr.split('-');
            if (parts.length === 3) {

                    return `${parts[2]}-${parts[1]}-${parts[0]}`;

        // Smart Category Parser: Tafsiran Kod Kategori Pintar (L12TKB, P9, etc)
        const categoriesMatch = (athCat, evCat) => {
            if (!athCat || !evCat) return false;
            const a = athCat.trim().toUpperCase().replace(/\s+/g, '');
            const e = evCat.trim().toUpperCase().replace(/\s+/g, '');
            if (a === e) return true;
            if (e === "TERBUKA") return true; 

            const parseCat = (code) => {
                let gender = null;
                if (code.startsWith('L')) gender = 'L';
                else if (code.startsWith('P')) gender = 'P';
                
                const ageMatch = code.match(/\d+/);
                const age = ageMatch ? parseInt(ageMatch[0]) : 99; // 99 jika tiada had umur (Terbuka)
                return { gender, age };
            };

            const athInfo = parseCat(a);
            const evInfo = parseCat(e);

            if (evInfo.gender && athInfo.gender && evInfo.gender !== athInfo.gender) {
                return false;
            }

            if (athInfo.age > evInfo.age) {
                return false;
            }

            return true;
        };

                    unsubResults();
                    unsubHeats();
                    unsubMeta();
                    unsubConfig();
                };
            }, [isCloudActive]);

            const houseStandings = useMemo(() => {
                const houses = {};
                Object.keys(housesMetadata || INITIAL_HOUSES_METADATA).forEach(name => {
                    const meta = housesMetadata[name] || {};
                    const preset = COLOR_PRESETS[meta.warnaLabel] || COLOR_PRESETS.Merah;
                    houses[name] = {
                        emas: 0, perak: 0, gangsa: 0, keempat: 0, mata: 0,
                        warna: preset.warna, teks: preset.teks, glow: preset.glow, emoji: preset.emoji || "🏆", slogan: meta.slogan || ""
                    };
                });

                (results || []).forEach(res => {
                    const athlete = (athletes || []).find(a => a.id === res.athleteId);
                    if (athlete && houses[athlete.rumah]) {
                        const h = houses[athlete.rumah];
                        if (res.kedudukan === "1") { h.emas += 1; h.mata += pointsConfig.emas; }
                        else if (res.kedudukan === "2") { h.perak += 1; h.mata += pointsConfig.perak; }
                        else if (res.kedudukan === "3") { h.gangsa += 1; h.mata += pointsConfig.gangsa; }
                        else if (res.kedudukan === "4") { h.keempat += 1; h.mata += pointsConfig.keempat; }
                    }
                });

                Object.keys(houses).forEach(name => {
                    if (housesMetadata[name]) houses[name].mata += parseInt(housesMetadata[name].bonusPoints) || 0;
                });

                return Object.entries(houses).map(([nama, data]) => ({ nama, ...data })).sort((a, b) => b.mata - a.mata);
            }, [results, athletes, pointsConfig, housesMetadata]);

            const eventsWithCode = useMemo(() => {
                const uniqueDates = Array.from(new Set((events || []).map(e => e.tarikh).filter(Boolean))).sort();
                const getDayNum = (date) => {
                    if (!date) return 1;
                    const idx = uniqueDates.indexOf(date);
                    return idx !== -1 ? idx + 1 : 1;
                };

                const groups = {};
                (events || []).forEach(e => {
                    const day = getDayNum(e.tarikh);
                    if (!groups[day]) groups[day] = [];
                    groups[day].push(e);
                });

                const eventCodeMap = {};
                Object.keys(groups).forEach(day => {
                    groups[day].sort((a, b) => (a.masa || "00:00").localeCompare(b.masa || "00:00"));
                    groups[day].forEach((ev, index) => {
                        eventCodeMap[ev.id] = `${day}${String(index + 1).padStart(2, '0')}`;
                    });
                });

                return (events || []).map(ev => ({ ...ev, kodAcara: eventCodeMap[ev.id] || "101" }));
            }, [events]);

            const displayedEvents = useMemo(() => {
                if (selectedEventDate === "Semua") return eventsWithCode;
                return eventsWithCode.filter(e => e.tarikh === selectedEventDate);
            }, [eventsWithCode, selectedEventDate]);

            const handleAddCategory = async () => {
                if (!checkAdminAuthority()) return;
                const cat = newCategoryInput.trim().toUpperCase();
                if (!cat) return;
                if (categories.includes(cat)) {
                    showToastMessage("Kategori ini sudah wujud!", "error");
                    return;
                }
                const updatedCats = [...categories, cat];
                setCategories(updatedCats);
                setNewCategoryInput("");

                try {
                    if (isCloudActive && db) {
                        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('metadata').doc('config').set({ categories: updatedCats }, { merge: true });
                    }
                    showToastMessage(`Kategori baharu ${cat} ditambah!`);
                } catch (e) {
                    console.error(e);
                }
            };

            const handleSaveSignatories = (e) => {
                e.preventDefault();
                if (!checkAdminAuthority()) return;
                localStorage.setItem('sps_sig1_name', certSignatory1Name);
                localStorage.setItem('sps_sig1_title', certSignatory1Title);
                localStorage.setItem('sps_sig2_name', certSignatory2Name);
                localStorage.setItem('sps_sig2_title', certSignatory2Title);
                setShowSignatoryModal(false);
                showToastMessage("Maklumat Penandatangan Sijil Berjaya Dikemaskini!", "success");
            };

            const executeBypassPrint = (mode, targetData = null) => {
                let printContent = "";

                if (mode === 'semua_keputusan') {
                    const eventsWithResults = eventsWithCode.filter(ev => 
                        results.some(r => r.eventId === ev.id) || heats.some(h => h.eventId === ev.id)
                    );

                    let allResultsHtml = '';
                    if (eventsWithResults.length === 0) {
                        allResultsHtml = `<p style="text-align:center; padding: 40px; color: #64748b; font-style: italic;">Tiada keputusan dikunci dalam sistem lagi.</p>`;
                    } else {
                        allResultsHtml = eventsWithResults.map(ev => {
                            const evResults = results.filter(r => r.eventId === ev.id).sort((a,b) => parseInt(a.kedudukan) - parseInt(b.kedudukan));
                            const medalMap = { "1": "🥇 JOHAN", "2": "🥈 NAIB JOHAN", "3": "🥉 KETIGA", "4": "🏅 KEEMPAT" };
                            
                            const resultsRows = evResults.map(r => {
                                const ath = athletes.find(a => a.id === r.athleteId);
                                return `
                                    <tr>
                                        <td style="border: 1px solid #cbd5e1; padding: 6px; font-weight: bold;">${medalMap[r.kedudukan] || r.kedudukan}</td>
                                        <td style="border: 1px solid #cbd5e1; padding: 6px; font-weight: bold; text-transform: uppercase;">${ath ? ath.nama : 'N/A'}</td>
                                        <td style="border: 1px solid #cbd5e1; padding: 6px; text-align: center;">${ath ? ath.kelas : '-'}</td>
                                        <td style="border: 1px solid #cbd5e1; padding: 6px; text-align: center; font-weight: bold;">Rumah ${ath ? ath.rumah : '-'}</td>
                                        <td style="border: 1px solid #cbd5e1; padding: 6px; text-align: center; font-family: monospace;">${r.catatan || '-'}</td>
                                    </tr>
                                `;
                            }).join('');

                            return `
                                <div style="margin-bottom: 25px; page-break-inside: avoid; border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; background: #fff;">
                                    <div style="background: #1e3a8a; color: white; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                                        <span style="font-weight: bold; font-size: 13px;">[${ev.kodAcara}] ${ev.nama} ${getFriendlyCategory(ev.kategori)}</span>
                                        <span style="font-size: 11px; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 4px;">${ev.jenis} | ${ev.format || "Individu"}</span>
                                    </div>
                                    ${evResults.length > 0 ? `
                                        <table style="width: 100%; border-collapse: collapse; font-size: 11px;">
                                            <thead>
                                                <tr style="background: #f1f5f9; text-align: left;">
                                                    <th style="border: 1px solid #cbd5e1; padding: 6px; width: 110px;">Kedudukan</th>
                                                    <th style="border: 1px solid #cbd5e1; padding: 6px;">Nama Penuh Atlet</th>
                                                    <th style="border: 1px solid #cbd5e1; padding: 6px; text-align: center; width: 80px;">Kelas</th>
                                                    <th style="border: 1px solid #cbd5e1; padding: 6px; text-align: center; width: 100px;">Rumah</th>
                                                    <th style="border: 1px solid #cbd5e1; padding: 6px; text-align: center; width: 90px;">Catatan</th>
                                                </tr>
                                            </thead>
                                            <tbody>${resultsRows}</tbody>
                                        </table>
                                    ` : '<p style="font-size:11px; color:#64748b; font-style:italic;">Tiada pingat dikunci untuk acara ini.</p>'}
                                </div>
                            `;
                        }).join('');
                    }

                    printContent = `
                        <div style="font-family: sans-serif; padding: 20px; color: #1e293b;">
                            <div style="text-align: center; border-bottom: 3px double #0f172a; padding-bottom: 15px; margin-bottom: 25px;">
                                <img src="${logoUrl}" style="height: 70px; margin-bottom: 5px;" onerror="this.style.display='none'" />
                                <h2 style="margin: 0; text-transform: uppercase; font-size: 18px; color: #1e3a8a;">${activeSchoolName}</h2>
                                <h3 style="margin: 3px 0 0 0; color: #475569; font-size: 13px;">${activeSchoolSubtitle} TAHUN ${activeYear}</h3>
                                <h4 style="margin: 8px 0 0 0; font-size: 14px; font-weight: bold; background: #e2e8f0; display: inline-block; padding: 4px 16px; border-radius: 6px;">BUKU KEPUTUSAN KESELURAHAN ACARA KEJOHANAN</h4>
                            </div>
                            ${allResultsHtml}
                        </div>
                    `;
                } else if (mode === 'sijil' && targetData) {
                    printContent = `
                        <div style="border: 12px double #1e3a8a; padding: 40px; text-align: center; font-family: 'Playfair Display', Georgia, serif; min-height: 250mm; box-sizing: border-box; position: relative;">
                            <div style="border: 2px solid #fbbf24; position: absolute; inset: 10px; pointer-events: none;"></div>
                            <img src="${logoUrl}" style="height: 90px; margin-bottom: 20px;" />
                            <h1 style="font-size: 26px; font-weight: 800; color: #1e3a8a; margin: 0 0 5px 0;">${activeSchoolName}</h1>
                            <div style="height: 2px; width: 100px; background: #fbbf24; margin: 25px auto;"></div>
                            <h2 style="font-size: 32px; font-weight: 700; color: #b45309; margin: 10px 0;">SIJIL PENGHARGAAN</h2>
                            <p style="font-size: 14px; font-style: italic; color: #475569;">Dengan ini diperakui bahawa</p>
                            <h3 style="font-size: 24px; font-weight: 850; text-decoration: underline; color: #0f172a; margin: 20px 0;">${(targetData.nama || "").toUpperCase()}</h3>
                            <p style="font-size: 14px; color: #334155; margin-bottom: 30px;">
                                Kelas: <strong>${targetData.kelas || ""}</strong> | Rumah Sukan: <strong>Rumah ${targetData.rumah || ""}</strong>
                            </p>
                            <p style="font-size: 16px; color: #1e293b; max-width: 600px; margin: 0 auto 40px auto; line-height: 1.8;">
                                Telah mengambil bahagian dengan jayanya sebagai atlet sukan dan mempamerkan semangat kesukanan yang terpuji sepanjang Kejohanan Sukan Tahunan ${activeSchoolName} ${activeYear}.
                            </p>
                            <div style="display: flex; justify-content: space-between; max-width: 600px; margin: 40px auto 0 auto; font-family: sans-serif; font-size: 11px;">
                                <div style="width: 220px; text-align: center;">
                                    <div style="border-bottom: 1px solid #94a3b8; height: 40px;"></div>
                                    <p style="margin: 5px 0 0 0; font-weight: 700;">${certSignatory1Name}</p>
                                    <p style="margin: 0; color: #64748b;">${certSignatory1Title}</p>
                                </div>
                                <div style="width: 220px; text-align: center;">
                                    <div style="border-bottom: 1px solid #94a3b8; height: 40px;"></div>
                                    <p style="margin: 5px 0 0 0; font-weight: 700;">${certSignatory2Name}</p>
                                    <p style="margin: 0; color: #64748b;">${certSignatory2Title}</p>
                                </div>
                            </div>
                        </div>
                    `;
                }

                const fullHtml = `
                    <!DOCTYPE html>
                    <html lang="ms">
                    <head>
                        <meta charset="UTF-8">
                        <title>Cetak Dokumen Sukan</title>
                        <style>
                            body { background-color: #ffffff; padding: 15mm; font-family: sans-serif; }
                            @media print { body { margin: 0; padding: 0; background: white; } @page { size: A4 portrait; margin: 10mm; } }
                        </style>
                    </head>
                    <body>${printContent}</body>
                    </html>
                `;
                setPreviewContent(fullHtml);
                setIsPreviewModalOpen(true);
            };

            const handleSaveSchoolSetup = (e) => {
                e.preventDefault();
                if (!checkAdminAuthority()) return;
                
                if (setupFirebaseConfigRaw.trim()) {
                    try {
                        JSON.parse(setupFirebaseConfigRaw.trim());
                    } catch (err) {
                        showToastMessage("Ralat: Format Konfigurasi Firebase JSON tidak sah.", "error");
                        return;
                    }
                }

                localStorage.setItem('sps_school_name', setupSchoolName.trim() || DEFAULT_SCHOOL_NAME);
                localStorage.setItem('sps_school_subtitle', setupSchoolSubtitle.trim() || DEFAULT_SCHOOL_SUBTITLE);
                localStorage.setItem('sps_school_logo', setupSchoolLogo.trim() || DEFAULT_SCHOOL_LOGO);
                localStorage.setItem('sps_school_code', setupSchoolCode.trim() || DEFAULT_SCHOOL_CODE);
                localStorage.setItem('sps_school_district', setupSchoolDistrict.trim() || DEFAULT_SCHOOL_DISTRICT);
                localStorage.setItem('sps_school_state', setupSchoolState.trim() || DEFAULT_SCHOOL_STATE);

                if (setupFirebaseConfigRaw.trim()) {
                    localStorage.setItem('sps_custom_firebase_config', setupFirebaseConfigRaw.trim());
                } else {
                    localStorage.removeItem('sps_custom_firebase_config');
                }

                if (setupGasUrl.trim()) {
                    localStorage.setItem('sps_custom_gas_url', setupGasUrl.trim());
                } else {
                    localStorage.removeItem('sps_custom_gas_url');
                }

                showToastMessage("Tetapan Sekolah Baharu Berjaya Disimpan! Memuat semula portal...", "success");
                setTimeout(() => { window.location.reload(); }, 1500);
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 print:hidden">
                    <input type="file" ref={fileInputRef} accept=".json" className="hidden" />
                    
                    <header className="bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 text-white shadow-md relative z-50">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-4">
                                <img src={logoUrl} alt="Logo Sukan" className="w-[66px] h-[66px] object-contain" />
                                <div>
                                    <h1 className="text-xl font-extrabold tracking-tight flex flex-wrap items-center gap-2">
                                        Portal Sukan SPS-{activeSchoolName}
                                        <span className={`inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold ${isCloudActive ? "bg-emerald-500/20 text-emerald-300" : "bg-amber-500/20 text-amber-300"}`}>
                                            ● {isCloudActive ? "Awan Aktif 🟢" : "Mod Lokal 🟡"}
                                        </span>
                                    </h1>
                                    <p className="text-xs text-indigo-200 font-medium">{activeSchoolSubtitle} {activeYear} | {activeSchoolCode}</p>
                                </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-2 w-full md:w-auto justify-start md:justify-end">
                                <button onClick={() => setLang(lang === "BM" ? "EN" : "BM")} className="bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg text-xs font-semibold">🌐 BM / EN</button>
                                {userRole === "admin" && (
                                    <div className="relative inline-block" ref={adminMenuRef}>
                                        <button onClick={() => setIsAdminMenuOpen(!isAdminMenuOpen)} className="bg-yellow-500 hover:bg-yellow-600 text-slate-950 font-black px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5">🛠️ PANEL PENTADBIR</button>
                                        {isAdminMenuOpen && (
                                            <div className="absolute right-0 mt-2 w-64 bg-white rounded-2xl shadow-2xl border py-2 text-slate-800 z-[9999]">
                                                <button onClick={() => { setShowSchoolSetupModal(true); setIsAdminMenuOpen(false); }} className="w-full text-left px-4 py-2 hover:bg-indigo-50 text-xs font-extrabold text-indigo-700">🏫 Tetapan Sekolah Baharu</button>
                                                <button onClick={() => { setShowGasModal(true); setIsAdminMenuOpen(false); }} className="w-full text-left px-4 py-2 hover:bg-slate-50 text-xs font-semibold">⚡ Setup GAS API</button>
                                                <button onClick={() => { setShowPointsModal(true); setIsAdminMenuOpen(false); }} className="w-full text-left px-4 py-2 hover:bg-slate-50 text-xs font-semibold">⚙️ Tetapan Mata & Tahun</button>
                                                <button onClick={() => { setShowDiagModal(true); setIsAdminMenuOpen(false); }} className="w-full text-left px-4 py-2 hover:bg-slate-50 text-xs font-semibold">ℹ️ Info Diag</button>
                                            </div>
                                        )}
                                    </div>
                                )}
                                {currentUser && !currentUser.isAnonymous ? (
                                    <div className="flex items-center gap-2 bg-slate-800 p-1.5 pl-3 pr-2 rounded-xl text-xs">
                                        <div>
                                            <p className="font-bold text-white">{currentUser.displayName || "Guru"}</p>
                                            <p className="text-[9px] font-bold uppercase text-emerald-400">{userRole}</p>
                                        </div>
                                        <button onClick={handleLogout} className="p-1 hover:bg-red-500/20 text-red-400 rounded-lg">✕</button>
                                    </div>
                                ) : (
                                    <button onClick={() => setIsLoginModalOpen(true)} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-1.5 rounded-xl text-xs flex items-center gap-2">🔑 Log Masuk</button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* Navigation Bar */}
                    <div className="bg-white border-b sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-4 flex overflow-x-auto space-x-1 py-2">
                            {[
                                { id: "dashboard", label: t.dashboard },
                                { id: "rumah_sukan", label: t.rumah_sukan },
                                { id: "atlit", label: t.atlit },
                                { id: "acara", label: t.acara },
                                { id: "keputusan", label: t.keputusan },
                                { id: "pasca_sukan", label: t.pasca_sukan }
                            ].map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap ${activeTab === tab.id ? "bg-indigo-600 text-white" : "text-slate-600 hover:bg-slate-100"}`}>
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    {}
                    <main className="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
                        {/* TAB 1: Dashboard */}
                        {activeTab === "dashboard" && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    {houseStandings.map((h, idx) => (
                                        <div key={h.nama} className={`rounded-2xl p-5 border bg-white relative overflow-hidden shadow-sm ${h.glow}`}>
                                            <div className={`absolute top-0 left-0 w-full h-1.5 ${h.warna}`}></div>
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <span className="text-[10px] font-black uppercase text-slate-400">Kedudukan #{idx+1}</span>
                                                    <h3 className="text-lg font-black text-slate-800">Rumah {h.nama}</h3>
                                                </div>
                                                <span className={`text-2xl font-black ${h.teks}`}>{h.mata} <span className="text-xs font-bold text-slate-400">mata</span></span>
                                            </div>
                                            <div className="grid grid-cols-4 gap-2 mt-6 text-center text-xs font-bold bg-slate-50 p-3 rounded-xl">
                                                <div><span className="text-xl block mb-1">🥇</span><p className="text-slate-700 text-xs font-extrabold">{h.emas}</p></div>
                                                <div><span className="text-xl block mb-1">🥈</span><p className="text-slate-700 text-xs font-extrabold">{h.perak}</p></div>
                                                <div><span className="text-xl block mb-1">🥉</span><p className="text-slate-700 text-xs font-extrabold">{h.gangsa}</p></div>
                                                <div><span className="text-xl block mb-1">🏅</span><p className="text-slate-700 text-xs font-extrabold">{h.keempat}</p></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TAB 2: Sports Houses */}
                        {activeTab === "rumah_sukan" && (
                            <div className="space-y-6">
                                <div className="bg-white p-5 rounded-2xl border shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div>
                                        <h3 className="text-base font-extrabold text-slate-900">🏠 Pengurusan Rumah Sukan & Ahli</h3>
                                        <p className="text-xs text-slate-500">Kelola slogan, guru penasihat, serta senarai ahli murid mengikut rumah sukan.</p>
                                    </div>
                                    {userRole === "admin" && (
                                        <button onClick={() => { setHouseForm({ nama: "", slogan: "", guruPenasihat: "", bonusPoints: 0, warnaLabel: "Ungu" }); setIsEditingHouse(false); setIsHouseSidebarOpen(true); }} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow transition">
                                            + Tambah Rumah Sukan
                                        </button>
                                    )}
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {Object.keys(housesMetadata || INITIAL_HOUSES_METADATA).map(houseName => {
                                        const meta = housesMetadata[houseName] || {};
                                        const preset = COLOR_PRESETS[meta.warnaLabel] || COLOR_PRESETS.Merah;
                                        const houseAthletes = athletes.filter(a => a.rumah === houseName);
                                        const countLelaki = houseAthletes.filter(a => a.jantina === "Lelaki").length;
                                        const countPerempuan = houseAthletes.filter(a => a.jantina === "Perempuan").length;

                                        return (
                                            <div key={houseName} className="bg-white rounded-2xl border shadow-sm p-5 relative overflow-hidden flex flex-col justify-between space-y-4">
                                                <div className={`absolute top-0 left-0 w-full h-2 ${preset.warna}`}></div>
                                                <div>
                                                    <div className="flex justify-between items-start border-b pb-3 mb-3">
                                                        <div>
                                                            <h4 className="text-lg font-black text-slate-900">Rumah {houseName}</h4>
                                                            <p className="text-xs text-indigo-600 font-bold italic">"{meta.slogan || 'Saga Membara'}"</p>
                                                        </div>
                                                        <span className="text-xs font-bold bg-slate-100 text-slate-700 px-2.5 py-1 rounded-lg border">
                                                            L: {countLelaki} | P: {countPerempuan} | Jumlah: {houseAthletes.length}
                                                        </span>
                                                    </div>

                                                    <div className="space-y-2 text-xs">
                                                        <p><strong className="text-slate-500">Guru Penasihat:</strong> {meta.guruPenasihat || "Belum ditetapkan"}</p>
                                                        <p><strong className="text-slate-500">Mata Bonus Perbarisan/Hiasan:</strong> <span className="font-mono font-bold text-indigo-600">{meta.bonusPoints || 0} Mata</span></p>
                                                    </div>
                                                </div>

                                                <div className="flex flex-wrap gap-2 pt-3 border-t">
                                                    <button onClick={() => { setSelectedMembersHouse(houseName); setShowMembersModal(true); }} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs py-2 rounded-xl border transition">
                                                        👥 Papar Ahli
                                                    </button>
                                                    <button onClick={() => executeBypassPrint('sijil', houseAthletes[0])} className="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold text-xs px-3 py-2 rounded-xl border border-indigo-100 transition">
                                                        📄 Kehadiran
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* TAB 3: Athlete Management */}
                        {activeTab === "atlit" && (
                            <div className="space-y-6">
                                <div className="bg-white p-5 rounded-2xl border shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div>
                                        <h3 className="text-base font-extrabold text-slate-900">🏃‍♂️ Pengurusan Atlet & Murid</h3>
                                        <p className="text-xs text-slate-500">Daftarkan atlet baharu, tetapkan kategori serta acara kejohanan.</p>
                                    </div>
                                    {(userRole === "admin" || userRole === "guru") && (
                                        <div className="flex gap-2">
                                            <button onClick={() => { setAthleteForm({ id: "", nama: "", kelas: "", rumah: "Merah", jantina: "Lelaki", kategori: "L12" }); setIsEditingAthlete(false); setIsAddAthleteSidebarOpen(true); }} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow transition">
                                                + Daftar Atlet
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <div className="bg-white rounded-2xl border shadow-sm p-5 space-y-4">
                                    <div className="flex flex-col sm:flex-row justify-between gap-3 text-xs">
                                        <input type="text" placeholder="Cari nama atlet..." value={studentSearchQuery} onChange={(e) => setStudentSearchQuery(e.target.value)} className="p-2.5 border rounded-xl w-full sm:w-64 font-medium" />
                                        <select value={filterHouse} onChange={(e) => setFilterHouse(e.target.value)} className="p-2.5 border rounded-xl bg-white font-bold">
                                            <option value="Semua">Semua Rumah Sukan</option>
                                            {Object.keys(housesMetadata || INITIAL_HOUSES_METADATA).map(h => (
                                                <option key={h} value={h}>Rumah {h}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-xs">
                                            <thead>
                                                <tr className="border-b bg-slate-50 text-slate-600 font-bold uppercase text-[10px]">
                                                    <th className="p-3">No Bib</th>
                                                    <th className="p-3">Nama Atlet</th>
                                                    <th className="p-3">Kelas</th>
                                                    <th className="p-3">Rumah</th>
                                                    <th className="p-3">Jantina</th>
                                                    <th className="p-3">Kategori</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {athletes.filter(a => {
                                                    const matchHouse = filterHouse === "Semua" || a.rumah === filterHouse;
                                                    const matchName = !studentSearchQuery || a.nama.toLowerCase().includes(studentSearchQuery.toLowerCase());
                                                    return matchHouse && matchName;
                                                }).map(ath => (
                                                    <tr key={ath.id} className="border-b last:border-0 hover:bg-slate-50">
                                                        <td className="p-3 font-mono font-bold text-indigo-700">{ath.noAtlet || "-"}</td>
                                                        <td className="p-3 font-bold uppercase text-slate-900">{ath.nama}</td>
                                                        <td className="p-3">{ath.kelas}</td>
                                                        <td className="p-3 font-bold">{ath.rumah}</td>
                                                        <td className="p-3">{ath.jantina}</td>
                                                        <td className="p-3"><span className="bg-slate-100 text-slate-800 px-2 py-0.5 rounded font-bold">{ath.kategori}</span></td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 4: Events Management */}
                        {activeTab === "acara" && (
                            <div className="space-y-6">
                                <div className="bg-white p-5 rounded-2xl border shadow-sm flex flex-wrap justify-between items-center gap-4">
                                    <div>
                                        <h3 className="font-extrabold text-slate-900 text-base">📋 Pengurusan Acara & Kategori</h3>
                                        <p className="text-xs text-slate-500">Konfigurasi senarai acara kejohanan dan kategori had umur.</p>
                                    </div>
                                    {userRole === "admin" && (
                                        <div className="flex gap-2 items-center flex-wrap">
                                            <input type="text" placeholder="Kod Kategori (cth: L12TKB)" value={newCategoryInput} onChange={(e) => setNewCategoryInput(e.target.value)} className="p-2 border rounded-xl text-xs font-bold uppercase" />
                                            <button onClick={handleAddCategory} className="bg-emerald-600 text-white text-xs font-bold px-3.5 py-2 rounded-xl hover:bg-emerald-700 transition">+ Tambah Kategori</button>
                                        </div>
                                    )}
                                </div>

                                <div className="bg-white p-5 rounded-2xl border shadow-sm">
                                    <h4 className="text-xs font-extrabold uppercase text-slate-400 mb-3">Senarai Kategori Aktif:</h4>
                                    <div className="flex flex-wrap gap-2">
                                        {categories.map(cat => (
                                            <span key={cat} className="bg-indigo-50 border border-indigo-200 text-indigo-700 font-extrabold text-xs px-3 py-1.5 rounded-xl">
                                                {cat}
                                            </span>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 5: Event Results */}
                        {activeTab === "keputusan" && (
                            <div className="space-y-6">
                                <div className="bg-white p-5 rounded-2xl border shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div className="flex items-center gap-3 w-full md:w-auto">
                                        <h3 className="text-sm font-bold text-slate-900 uppercase whitespace-nowrap">Pilih Acara Kejohanan</h3>
                                        <button onClick={() => executeBypassPrint('semua_keputusan')} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow transition flex items-center gap-1.5">
                                            🖨️ Cetak Semua Keputusan
                                        </button>
                                    </div>
                                    <select value={resultForm.eventId || heatForm.eventId} onChange={(e) => {
                                        const val = e.target.value;
                                        setResultForm(prev => ({ ...prev, eventId: val }));
                                        setHeatForm(prev => ({ ...prev, eventId: val }));
                                    }} className="w-full md:w-80 p-2.5 border rounded-xl bg-white text-xs font-bold">
                                        <option value="">-- Pilih Acara --</option>
                                        {eventsWithCode.map(ev => (
                                            <option key={ev.id} value={ev.id}>[{ev.kodAcara}] {ev.nama} {getFriendlyCategory(ev.kategori)}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>
                        )}

                        {/* TAB 6: Post-Sports Documentation & Certificates */}
                        {activeTab === "pasca_sukan" && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-2xl border shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div>
                                        <h3 className="text-lg font-black text-slate-900">🏆 Modul Dokumentasi & Sijil</h3>
                                        <p className="text-xs text-slate-400">Jana sijil dan laporan rasmi kejohanan.</p>
                                    </div>
                                    <div className="flex gap-2">
                                        {userRole === "admin" && (
                                            <button onClick={() => setShowSignatoryModal(true)} className="bg-yellow-500 hover:bg-yellow-600 text-slate-950 font-black text-xs px-4 py-2.5 rounded-xl shadow transition">
                                                ✍️ Penandatangan
                                            </button>
                                        )}
                                        <button onClick={() => executeBypassPrint('sijil', athletes[0])} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow transition">
                                            📜 Contoh Sijil
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {}
                    {/* Modal Multi-School Setup */}
                    {showSchoolSetupModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
                            <form onSubmit={handleSaveSchoolSetup} className="bg-white rounded-3xl p-6 max-w-lg w-full text-xs font-semibold space-y-4 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="text-sm font-extrabold text-slate-900 uppercase">🏫 Tetapan Sekolah Baharu (Multi-School Config)</h3>
                                    <button type="button" onClick={() => setShowSchoolSetupModal(false)} className="text-slate-400">✕</button>
                                </div>
                                <div className="space-y-3">
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block mb-1 font-bold">Nama Sekolah</label>
                                            <input type="text" required value={setupSchoolName} onChange={(e) => setSetupSchoolName(e.target.value)} className="w-full p-2 border rounded-xl" />
                                        </div>
                                        <div>
                                            <label className="block mb-1 font-bold">Kod Sekolah</label>
                                            <input type="text" required value={setupSchoolCode} onChange={(e) => setSetupSchoolCode(e.target.value)} className="w-full p-2 border rounded-xl" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block mb-1 font-bold">Daerah</label>
                                            <input type="text" required value={setupSchoolDistrict} onChange={(e) => setSetupSchoolDistrict(e.target.value)} className="w-full p-2 border rounded-xl" />
                                        </div>
                                        <div>
                                            <label className="block mb-1 font-bold">Negeri</label>
                                            <input type="text" required value={setupSchoolState} onChange={(e) => setSetupSchoolState(e.target.value)} className="w-full p-2 border rounded-xl" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block mb-1 font-bold">Pautan URL Logo Sekolah</label>
                                        <input type="text" required value={setupSchoolLogo} onChange={(e) => setSetupSchoolLogo(e.target.value)} className="w-full p-2 border rounded-xl" />
                                    </div>
                                    <div>
                                        <label className="block mb-1 font-bold">Google Apps Script Web App URL</label>
                                        <input type="text" value={setupGasUrl} onChange={(e) => setSetupGasUrl(e.target.value)} className="w-full p-2 border rounded-xl font-mono text-[10px]" placeholder="https://script.google.com/..." />
                                    </div>
                                    <div>
                                        <label className="block mb-1 font-bold">Konfigurasi Firebase JSON Sekolah</label>
                                        <textarea rows="5" value={setupFirebaseConfigRaw} onChange={(e) => setSetupFirebaseConfigRaw(e.target.value)} className="w-full p-2 border rounded-xl font-mono text-[10px]" placeholder='{"apiKey": "...", "projectId": "..."}' />
                                    </div>
                                </div>
                                <div className="flex justify-end gap-2 pt-3 border-t">
                                    <button type="button" onClick={() => setShowSchoolSetupModal(false)} className="px-4 py-2 bg-slate-100 rounded-xl">Batal</button>
                                    <button type="submit" className="px-5 py-2 bg-indigo-600 text-white rounded-xl font-bold">Simpan & Aktifkan</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Modal Penandatangan Sijil */}
                    {showSignatoryModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
                            <form onSubmit={handleSaveSignatories} className="bg-white rounded-3xl p-6 max-w-md w-full text-xs font-semibold space-y-4">
                                <h3 className="text-sm font-extrabold text-slate-900 uppercase border-b pb-2">✍️ Tetapan Penandatangan Sijil</h3>
                                <div className="space-y-3">
                                    <div className="bg-slate-50 p-3 rounded-xl border space-y-2">
                                        <p className="font-extrabold text-indigo-700">Penandatangan 1 (Kiri)</p>
                                        <input type="text" required value={certSignatory1Name} onChange={(e) => setCertSignatory1Name(e.target.value)} placeholder="Nama Pegawai" className="w-full p-2 border rounded-lg" />
                                        <input type="text" required value={certSignatory1Title} onChange={(e) => setCertSignatory1Title(e.target.value)} placeholder="Jawatan" className="w-full p-2 border rounded-lg" />
                                    </div>
                                    <div className="bg-slate-50 p-3 rounded-xl border space-y-2">
                                        <p className="font-extrabold text-indigo-700">Penandatangan 2 (Kanan)</p>
                                        <input type="text" required value={certSignatory2Name} onChange={(e) => setCertSignatory2Name(e.target.value)} placeholder="Nama Pegawai" className="w-full p-2 border rounded-lg" />
                                        <input type="text" required value={certSignatory2Title} onChange={(e) => setCertSignatory2Title(e.target.value)} placeholder="Jawatan" className="w-full p-2 border rounded-lg" />
                                    </div>
                                </div>
                                <div className="flex justify-end gap-2 pt-2">
                                    <button type="button" onClick={() => setShowSignatoryModal(false)} className="px-4 py-2 bg-slate-100 rounded-xl">Batal</button>
                                    <button type="submit" className="px-5 py-2 bg-indigo-600 text-white rounded-xl font-bold">Simpan</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Modal Pratinjau Dokumen */}
                    {isPreviewModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/80 z-[10000] flex flex-col items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-5xl h-[90vh] flex flex-col overflow-hidden">
                                <div className="bg-slate-950 text-white px-6 py-4 flex justify-between items-center">
                                    <h3 className="text-sm font-black uppercase">📄 Pratinjau Dokumen Cetakan</h3>
                                    <button onClick={() => setIsPreviewModalOpen(false)} className="text-slate-400">✕</button>
                                </div>
                                <div className="flex-grow bg-slate-100 p-4 overflow-hidden flex justify-center">
                                    <iframe id="preview-iframe" srcDoc={previewContent} className="w-full h-full max-w-[210mm] bg-white shadow-2xl rounded-xl" />
                                </div>
                                <div className="bg-slate-50 border-t px-6 py-4 flex justify-end gap-3 text-xs font-bold">
                                    <button onClick={() => setIsPreviewModalOpen(false)} className="px-5 py-2.5 bg-slate-200 rounded-xl">Tutup</button>
                                    <button onClick={() => { const iframe = document.getElementById('preview-iframe'); if (iframe) { iframe.contentWindow.focus(); iframe.contentWindow.print(); } }} className="px-6 py-2.5 bg-indigo-600 text-white rounded-xl">Cetak Sekarang</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Notification Toast */}
                    {toast.show && (
                        <div className="fixed bottom-5 right-5 z-[10000] max-w-sm p-4 rounded-xl shadow-2xl bg-slate-900 text-white text-xs font-bold">
                            <p>{toast.message}</p>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />); 
    </script>
</body>
</html>
