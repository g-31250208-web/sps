                                                            if(isCloudActive&&db) db.collection('artifacts').doc(appId).collection('public').doc('data').collection('athletes').doc(ath.id).delete();
                                                            else setAthletes(athletes.filter(x=>x.id!==ath.id));
                                                        }} className="text-red-500">Padam</button>
                                                    </td>}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Event Sidebar */}
                    {isEventSidebarOpen && (
                        <div className="fixed inset-0 z-[9999] flex justify-end text-xs">
                            <div className="fixed inset-0 bg-slate-900/50" onClick={()=>setIsEventSidebarOpen(false)}></div>
                            <div className="relative w-full max-w-md bg-white p-6 h-full flex flex-col space-y-4 shadow-2xl">
                                <h3 className="font-black text-sm uppercase">{isEditingEvent ? "Edit Acara" : "Daftar Acara Baru"}</h3>
                                <form onSubmit={handleEventSubmit} className="space-y-4 font-semibold">
                                    <div><label className="block mb-1">Nama Acara</label><input required type="text" value={eventForm.nama} onChange={e=>setEventForm({...eventForm, nama:e.target.value.toUpperCase()})} placeholder="Cth: LARI 100M" className="w-full border p-2 rounded-xl uppercase" /></div>
                                    <div><label className="block mb-1">Kategori</label><select value={eventForm.kategori} onChange={e=>setEventForm({...eventForm, kategori:e.target.value})} className="w-full border p-2 rounded-xl">{categories.map(c=><option key={c} value={c}>{c}</option>)}</select></div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div><label className="block mb-1">Jenis</label><select value={eventForm.jenis} onChange={e=>setEventForm({...eventForm, jenis:e.target.value})} className="w-full border p-2 rounded-xl"><option value="Balapan">Balapan</option><option value="Padang">Padang</option></select></div>
                                        <div><label className="block mb-1">Format</label><select value={eventForm.format} onChange={e=>setEventForm({...eventForm, format:e.target.value})} className="w-full border p-2 rounded-xl"><option value="Individu">Individu</option><option value="Berkumpulan">Kumpulan</option></select></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div><label className="block mb-1">Tarikh</label><input type="date" value={eventForm.tarikh} onChange={e=>setEventForm({...eventForm, tarikh:e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                                        <div><label className="block mb-1">Masa</label><input type="time" value={eventForm.masa} onChange={e=>setEventForm({...eventForm, masa:e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                                    </div>
                                    <button type="submit" className="w-full bg-indigo-600 text-white py-2.5 rounded-xl shadow-md">Simpan Acara</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Athlete Reg Sidebar */}
                    {isAddAthleteSidebarOpen && (
                        <div className="fixed inset-0 z-[9999] flex justify-end text-xs">
                            <div className="fixed inset-0 bg-slate-900/50" onClick={()=>setIsAddAthleteSidebarOpen(false)}></div>
                            <div className="relative w-full max-w-md bg-white p-6 h-full flex flex-col space-y-4 shadow-2xl">
                                <h3 className="font-black text-sm uppercase">{isEditingAthlete ? "Edit Profil Atlet" : "Pendaftaran Atlet Baru"}</h3>
                                <form onSubmit={handleAthleteSubmit} className="space-y-4 font-semibold">
                                    <div><label className="block mb-1">Nama Penuh</label><input required type="text" value={athleteForm.nama} onChange={e=>setAthleteForm({...athleteForm, nama:e.target.value.toUpperCase()})} className="w-full border p-2 rounded-xl uppercase" /></div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div><label className="block mb-1">Kelas</label><input required type="text" value={athleteForm.kelas} onChange={e=>setAthleteForm({...athleteForm, kelas:e.target.value})} className="w-full border p-2 rounded-xl uppercase" /></div>
                                        <div><label className="block mb-1">Rumah</label><select value={athleteForm.rumah} onChange={e=>setAthleteForm({...athleteForm, rumah:e.target.value})} className="w-full border p-2 rounded-xl">{Object.keys(housesMetadata).map(k=><option key={k} value={k}>{k}</option>)}</select></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div><label className="block mb-1">Jantina</label><select value={athleteForm.jantina} onChange={e=>setAthleteForm({...athleteForm, jantina:e.target.value})} className="w-full border p-2 rounded-xl"><option value="Lelaki">Lelaki</option><option value="Perempuan">Perempuan</option></select></div>
                                        <div><label className="block mb-1">Kategori</label><select value={athleteForm.kategori} onChange={e=>setAthleteForm({...athleteForm, kategori:e.target.value})} className="w-full border p-2 rounded-xl">{categories.map(c=><option key={c} value={c}>{c}</option>)}</select></div>
                                    </div>
                                    <button type="submit" className="w-full bg-indigo-600 text-white py-2.5 rounded-xl shadow-md">Simpan Profil Atlet</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Event Assignment Sidebar */}
                    {isAssignEventSidebarOpen && (
                        <div className="fixed inset-0 z-[9999] flex justify-end text-xs">
                            <div className="fixed inset-0 bg-slate-900/50" onClick={()=>setIsAssignEventSidebarOpen(false)}></div>
                            <div className="relative w-full max-w-md bg-white p-6 h-full flex flex-col space-y-4 shadow-2xl overflow-y-auto font-semibold">
                                <h3 className="font-black text-sm uppercase">Tetapan Penyertaan Acara Murid</h3>
                                <div className="relative">
                                    <label className="block mb-1 text-slate-400 uppercase text-[10px]">Cari Atlet (Nama)</label>
                                    <input type="text" value={studentSearchQuery} onChange={e=>{setStudentSearchQuery(e.target.value); setShowSearchDropdown(true);}} placeholder="Cari..." className="w-full border p-2 rounded-xl uppercase" />
                                    {showSearchDropdown && studentSearchQuery && (
                                        <div className="absolute left-0 right-0 mt-1 max-h-40 overflow-y-auto bg-white border rounded-xl shadow-lg z-50">
                                            {athletes.filter(a=>a.nama.toLowerCase().includes(studentSearchQuery.toLowerCase())).map(a => (
                                                <div key={a.id} onClick={()=>{ setSelectedStudentId(a.id); setStudentSearchQuery(a.nama); setSelectedEventIds(a.acaraIds||[]); setShowSearchDropdown(false); }} className="p-2 border-b cursor-pointer hover:bg-slate-50 uppercase">{a.nama} ({a.kategori})</div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                                {selectedStudentId && (() => {
                                    const ath = athletes.find(a=>a.id === selectedStudentId);
                                    if(!ath) return null;
                                    const availableEvents = eventsWithCode.filter(ev => categoriesMatch(ath.kategori, ev.kategori));
                                    const curInd = selectedEventIds.map(id=>events.find(e=>e.id===id)).filter(e=>e&&e.format==="Individu").length;
                                    const curGrp = selectedEventIds.map(id=>events.find(e=>e.id===id)).filter(e=>e&&e.format==="Berkumpulan").length;
                                    return (
                                        <form onSubmit={e => {
                                            e.preventDefault();
                                            if (curInd > maxIndividu) { showToastMessage("Had Individu Melebihi Maksimum!","error"); return; }
                                            if (curGrp > maxKumpulan) { showToastMessage("Had Kumpulan Melebihi Maksimum!","error"); return; }
                                            const updated = {...ath, acaraIds: selectedEventIds};
                                            if(isCloudActive&&db) db.collection('artifacts').doc(appId).collection('public').doc('data').collection('athletes').doc(ath.id).set(updated);
                                            else setAthletes(athletes.map(x=>x.id===ath.id?updated:x));
                                            showToastMessage("Acara dikemaskini!"); setIsAssignEventSidebarOpen(false);
                                        }} className="space-y-4">
                                            <div className="bg-indigo-50 p-3 rounded-xl border border-indigo-100 space-y-1">
                                                <p className="font-extrabold text-indigo-900">Status Pendaftaran ({ath.nama}):</p>
                                                <p className="text-[10px]">Individu: <span className={curInd>maxIndividu?"text-red-500":"text-indigo-600"}>{curInd}/{maxIndividu}</span> | Kumpulan: <span className={curGrp>maxKumpulan?"text-red-500":"text-indigo-600"}>{curGrp}/{maxKumpulan}</span></p>
                                            </div>
                                            <div className="space-y-1 bg-slate-50 border p-2 rounded-xl max-h-[300px] overflow-y-auto">
                                                <p className="text-[10px] text-slate-400 mb-2">Acara Layak (Kategori {ath.kategori}):</p>
                                                {availableEvents.length === 0 ? <p className="italic text-slate-400">Tiada acara sesuai</p> : availableEvents.map(ev => {
                                                    const checked = selectedEventIds.includes(ev.id);
                                                    return (
                                                        <label key={ev.id} className="flex items-center gap-2 bg-white border p-2 rounded-lg cursor-pointer hover:bg-slate-100">
                                                            <input type="checkbox" checked={checked} onChange={()=>{
                                                                if(checked) setSelectedEventIds(selectedEventIds.filter(id=>id!==ev.id));
                                                                else setSelectedEventIds([...selectedEventIds, ev.id]);
                                                            }} />
                                                            <span className="flex-1">[{ev.kodAcara}] {ev.nama}</span>
                                                            <span className="bg-slate-200 px-1 rounded text-[9px]">{ev.format}</span>
                                                        </label>
                                                    )
                                                })}
                                            </div>
                                            <button type="submit" className="w-full bg-slate-800 text-white py-2.5 rounded-xl">Simpan Pendaftaran Acara</button>
                                        </form>
                                    )
                                })()}
                            </div>
                        </div>
                    )}

                    {/* Modal Signatory Setup */}
                    {showSignatoryModal && (
                        <div className="fixed inset-0 bg-slate-900/60 z-[9999] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-6 w-full max-w-sm text-xs font-semibold space-y-4">
                                <h3 className="font-black text-sm uppercase">✍️ Tetapan Penandatangan Sijil</h3>
                                <div>
                                    <label className="block mb-1">Nama Penuh Pegawai</label>
                                    <input type="text" value={certSignatory1Name} onChange={e=>setCertSignatory1Name(e.target.value)} className="w-full border p-2 rounded-xl" />
                                </div>
                                <div>
                                    <label className="block mb-1">Jawatan Pegawai</label>
                                    <input type="text" value={certSignatory1Title} onChange={e=>setCertSignatory1Title(e.target.value)} className="w-full border p-2 rounded-xl" />
                                </div>
                                <div className="flex justify-end gap-2 pt-2">
                                    <button onClick={()=>setShowSignatoryModal(false)} className="px-4 py-2 bg-slate-200 rounded-xl">Batal</button>
                                    <button onClick={()=>{
                                        localStorage.setItem('sps_sig1_name', certSignatory1Name);
                                        localStorage.setItem('sps_sig1_title', certSignatory1Title);
                                        setShowSignatoryModal(false); showToastMessage("Maklumat penandatangan sijil dikemaskini.");
                                    }} className="px-4 py-2 bg-indigo-600 text-white rounded-xl">Simpan</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Admin Config Modals (Points & Setup) */}
                    {showPointsModal && (
                        <div className="fixed inset-0 bg-slate-900/60 z-[9999] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-6 w-full max-w-md text-xs font-semibold space-y-4 max-h-[90vh] overflow-y-auto">
                                <h3 className="font-black text-sm uppercase">⚙️ Tetapan Kategori, Mata & Had Acara</h3>
                                <div className="bg-slate-50 p-3 rounded-xl border">
                                    <label className="block mb-1 font-bold text-slate-500">Tambah Kategori Acara Baru (Cth: L12TKB)</label>
                                    <div className="flex gap-2">
                                        <input type="text" value={newCategoryName} onChange={e=>setNewCategoryName(e.target.value.toUpperCase())} placeholder="Kategori Baru..." className="flex-1 border p-2 rounded-xl uppercase" />
                                        <button onClick={()=>{
                                            if(!newCategoryName.trim()) return;
                                            const newCats = [...new Set([...categories, newCategoryName.trim()])];
                                            setCategories(newCats); setNewCategoryName(""); showToastMessage("Kategori ditambah (Sila Simpan Global).");
                                        }} className="bg-emerald-600 text-white px-3 py-2 rounded-xl font-bold">Tambah</button>
                                    </div>
                                    <div className="flex flex-wrap gap-1 mt-2">
                                        {categories.map(c=><span key={c} className="bg-white border px-2 py-1 rounded text-[10px]">{c}</span>)}
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-2 border-t pt-4">
                                    <div><label className="block mb-1">Mata Emas</label><input type="number" value={pointsConfig.emas} onChange={e=>setPointsConfig({...pointsConfig,emas:parseInt(e.target.value)||0})} className="w-full border p-2 rounded-xl text-center font-mono" /></div>
                                    <div><label className="block mb-1">Mata Perak</label><input type="number" value={pointsConfig.perak} onChange={e=>setPointsConfig({...pointsConfig,perak:parseInt(e.target.value)||0})} className="w-full border p-2 rounded-xl text-center font-mono" /></div>
                                    <div><label className="block mb-1">Mata Gangsa</label><input type="number" value={pointsConfig.gangsa} onChange={e=>setPointsConfig({...pointsConfig,gangsa:parseInt(e.target.value)||0})} className="w-full border p-2 rounded-xl text-center font-mono" /></div>
                                    <div><label className="block mb-1">Mata Keempat</label><input type="number" value={pointsConfig.keempat} onChange={e=>setPointsConfig({...pointsConfig,keempat:parseInt(e.target.value)||0})} className="w-full border p-2 rounded-xl text-center font-mono" /></div>
                                </div>
                                <div className="grid grid-cols-2 gap-2 border-t pt-4">
                                    <div><label className="block mb-1">Had Individu (Murid)</label><input type="number" value={maxIndividu} onChange={e=>setMaxIndividu(parseInt(e.target.value)||0)} className="w-full border p-2 rounded-xl text-center font-mono" /></div>
                                    <div><label className="block mb-1">Had Kumpulan (Murid)</label><input type="number" value={maxKumpulan} onChange={e=>setMaxKumpulan(parseInt(e.target.value)||0)} className="w-full border p-2 rounded-xl text-center font-mono" /></div>
                                </div>
                                <div className="flex justify-end gap-2 pt-2">
                                    <button onClick={()=>setShowPointsModal(false)} className="px-4 py-2 bg-slate-200 rounded-xl">Batal</button>
                                    <button onClick={async ()=>{
                                        if(isCloudActive&&db) {
                                            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('metadata').doc('points').set(pointsConfig);
                                            await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('metadata').doc('config').set({ maxIndividu, maxKumpulan, activeYear, categories });
                                        } else {
                                            localStorage.setItem('sps_max_individu', maxIndividu); localStorage.setItem('sps_max_kumpulan', maxKumpulan);
                                        }
                                        setShowPointsModal(false); showToastMessage("Tetapan Global Disimpan!");
                                    }} className="px-4 py-2 bg-indigo-600 text-white rounded-xl">Simpan Global</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* Modal Multi-School Setup */}
                    {showSchoolSetupModal && (
                        <div className="fixed inset-0 bg-slate-900/60 z-[9999] flex items-center justify-center p-4">
                            <form onSubmit={e => {
                                e.preventDefault(); const form = e.target;
                                localStorage.setItem('sps_school_name', form.sName.value.trim() || DEFAULT_SCHOOL_NAME);
                                localStorage.setItem('sps_school_subtitle', form.sSub.value.trim() || DEFAULT_SCHOOL_SUBTITLE);
                                localStorage.setItem('sps_school_logo', form.sLogo.value.trim() || DEFAULT_SCHOOL_LOGO);
                                const fRaw = form.fConfig.value.trim();
                                if (fRaw) { try { JSON.parse(fRaw); localStorage.setItem('sps_custom_firebase_config', fRaw); } catch(err) { showToastMessage("Ralat JSON Firebase", "error"); return; } }
                                else { localStorage.removeItem('sps_custom_firebase_config'); }
                                showToastMessage("Tetapan Portal Disimpan! Memuat Semula..."); setTimeout(()=>window.location.reload(), 1500);
                            }} className="bg-white rounded-2xl p-6 w-full max-w-md text-xs font-semibold space-y-4 max-h-[90vh] overflow-y-auto">
                                <h3 className="font-black text-sm uppercase">🏫 Tetapan Sekolah Baharu</h3>
                                <p className="text-[10px] text-slate-500">Konfigurasi nama sekolah dan Firebase/Google Apps Script (Multi-School Configurable).</p>
                                <div><label className="block mb-1">Nama Singkatan Sekolah</label><input name="sName" type="text" defaultValue={activeSchoolName} className="w-full border p-2 rounded-xl uppercase" /></div>
                                <div><label className="block mb-1">Tajuk / Kod Sekolah</label><input name="sSub" type="text" defaultValue={activeSchoolSubtitle} className="w-full border p-2 rounded-xl" /></div>
                                <div><label className="block mb-1">URL Logo (Pilihan)</label><input name="sLogo" type="text" defaultValue={logoUrl} className="w-full border p-2 rounded-xl" /></div>
                                <div className="border-t pt-3">
                                    <label className="block mb-1">Konfigurasi Firebase JSON (Khusus Sekolah Ini)</label>
                                    <textarea name="fConfig" rows="5" defaultValue={cachedConfigRaw||""} placeholder={`{\n  "apiKey": "AIzaSy...",\n  "authDomain": "sps-sekolah.firebaseapp.com",\n  "projectId": "sps-sekolah",\n  ... \n}`} className="w-full border p-2 rounded-xl font-mono text-[10px]"></textarea>
                                </div>
                                <div className="flex justify-between pt-2">
                                    <button type="button" onClick={()=>{localStorage.clear(); window.location.reload();}} className="text-red-500">Kosongkan/Reset</button>
                                    <div className="flex gap-2">
                                        <button type="button" onClick={()=>setShowSchoolSetupModal(false)} className="px-4 py-2 bg-slate-200 rounded-xl">Batal</button>
                                        <button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded-xl">Simpan & Restart</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Preview Print Modal */}
                    {isPreviewModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/80 z-[10000] flex flex-col p-4">
                            <div className="bg-white rounded-xl shadow-2xl flex flex-col flex-1 max-w-5xl w-full mx-auto overflow-hidden">
                                <div className="bg-slate-900 text-white p-4 flex justify-between"><h3 className="font-bold text-xs uppercase">Pratinjau Dokumen Cetak</h3><button onClick={()=>setIsPreviewModalOpen(false)}>✕</button></div>
                                <div className="flex-1 bg-slate-200 p-4 overflow-hidden"><iframe id="preview-frame" srcDoc={previewContent} className="w-full h-full bg-white rounded shadow" /></div>
                                <div className="p-4 bg-white flex justify-end gap-3 text-xs font-bold">
                                    <button onClick={()=>setIsPreviewModalOpen(false)} className="bg-slate-200 px-4 py-2 rounded-lg">Tutup</button>
                                    <button onClick={()=>{const f=document.getElementById('preview-frame');if(f){f.contentWindow.focus();f.contentWindow.print();}}} className="bg-indigo-600 text-white px-5 py-2 rounded-lg">Cetak Dokumen Terus</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toast Notification */}
                    {toast.show && (
                        <div className="fixed bottom-5 right-5 z-[10001] bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl text-xs font-bold transition-all">
                            {toast.message}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
