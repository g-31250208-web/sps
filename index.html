        const appId = activeFirebaseConfig.projectId || "sps-skb-d8256";

        const INITIAL_ATHLETES = [
            { id: "A1", nama: "AHMAD DANISH", kelas: "6 Cemerlang", rumah: "Merah", jantina: "Lelaki", kategori: "L12", acaraIds: [] },
            { id: "A2", nama: "SITI NURHALIZA", kelas: "5 Gemilang", rumah: "Biru", jantina: "Perempuan", kategori: "P12", acaraIds: [] }
        ];
        
        const INITIAL_EVENTS = [];
        const INITIAL_RESULTS = [];
        const INITIAL_HEATS = [];
        const DEFAULT_ANNOUNCEMENTS = [
            { id: "ann_1", text: "Selamat Datang ke SiPS Online! Kejohanan akan bermula tidak lama lagi.", date: "17/06/2026", author: "Urus Setia Sukan" }

        const INITIAL_LOGS = [];

        const INITIAL_HOUSES_METADATA = {
            Merah: { slogan: "Saga Membara Selamanya Juara", guruPenasihat: "Cikgu Rosli, Ustazah Aminah", bonusPoints: 0, warnaLabel: "Merah" },
            Biru: { slogan: "Biru Gagah Juara Sepanjang Zaman", guruPenasihat: "Cikgu Sarah, Ustaz Fahmi", bonusPoints: 0, warnaLabel: "Biru" },
            Hijau: { slogan: "Hijau Perkasa Sentiasa Di Puncak", guruPenasihat: "Cikgu Lim, Cikgu Azhar", bonusPoints: 0, warnaLabel: "Hijau" },
            Kuning: { slogan: "Kuning Diraja Mewarisi Kegemilangan", guruPenasihat: "Cikgu Tan, Ustazah Nor", bonusPoints: 0, warnaLabel: "Kuning" }
        };

        const COLOR_PRESETS = {
            Merah: { bg: "bg-red-100", text: "text-red-700", warna: "bg-red-500", teks: "text-red-600", glow: "hover:shadow-[0_0_20px_rgba(239,68,68,0.4)] hover:border-red-300", emoji: "🏆" },
            Biru: { bg: "bg-blue-100", text: "text-blue-700", warna: "bg-blue-500", teks: "text-blue-600", glow: "hover:shadow-[0_0_20px_rgba(59,130,246,0.4)] hover:border-blue-300", emoji: "🏆" },
            Hijau: { bg: "bg-emerald-100", text: "text-emerald-700", warna: "bg-emerald-500", teks: "text-emerald-600", glow: "hover:shadow-[0_0_20px_rgba(16,185,129,0.4)] hover:border-emerald-300", emoji: "🏆" },
            Kuning: { bg: "bg-amber-100", text: "text-amber-700", warna: "bg-amber-400", teks: "text-amber-500", glow: "hover:shadow-[0_0_20px_rgba(251,191,36,0.4)] hover:border-amber-300", emoji: "🏆" },
            Ungu: { bg: "bg-purple-100", text: "text-purple-700", warna: "bg-purple-500", teks: "text-purple-600", glow: "hover:shadow-[0_0_20px_rgba(168,85,247,0.4)] hover:border-purple-300", emoji: "🏆" },
            Oren: { bg: "bg-orange-100", text: "text-orange-700", warna: "bg-orange-500", teks: "text-orange-600", glow: "hover:shadow-[0_0_20px_rgba(249,115,22,0.4)] hover:border-orange-300", emoji: "🏆" }
        };

        const getFriendlyCategory = (cat) => {
            if (!cat) return "";
            return String(cat).trim().toUpperCase();
        };

        const formatDateToDMY = (dateStr) => {
            if (!dateStr) return "N/A";
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                if (parts[0].length === 4) return `${parts[2]}-${parts[1]}-${parts[0]}`;
            }
            return dateStr;
        };

        // Kategori Pintar: L12TKB, P9, Terbuka
        const categoriesMatch = (athCat, evCat) => {
            if (!athCat || !evCat) return false;
            const a = athCat.trim().toUpperCase().replace(/\s+/g, '');
            const e = evCat.trim().toUpperCase().replace(/\s+/g, '');
            if (a === e) return true;
            if (e === "TERBUKA") return true; 

            let eGender = "";
            if (e.startsWith("L")) eGender = "Lelaki";
            else if (e.startsWith("P")) eGender = "Perempuan";

            let eAge = 99;
            const eMatch = e.match(/\d+/);
            if (eMatch) eAge = parseInt(eMatch[0]);

            let aGender = "";
            if (a.startsWith("L")) aGender = "Lelaki";
            else if (a.startsWith("P")) aGender = "Perempuan";

            let aAge = 99;
            const aMatch = a.match(/\d+/);
            if (aMatch) aAge = parseInt(aMatch[0]);

            if (eGender && aGender && eGender !== aGender) return false;
            if (aAge > eAge) return false; 

            return true;
        };

        const App = () => {
            const [lang, setLang] = useState("BM");
            const [userRole, setUserRole] = useState("pelawat");
            const [currentUser, setCurrentUser] = useState(null);
            const [isCloudActive, setIsCloudActive] = useState(false);
            const [activeTab, setActiveTab] = useState("dashboard");
            
            const [athletes, setAthletes] = useState(INITIAL_ATHLETES);
            const [events, setEvents] = useState(INITIAL_EVENTS);
            const [results, setResults] = useState(INITIAL_RESULTS);
            const [heats, setHeats] = useState(INITIAL_HEATS);
            const [housesMetadata, setHousesMetadata] = useState(INITIAL_HOUSES_METADATA);
            const [announcements, setAnnouncements] = useState(DEFAULT_ANNOUNCEMENTS);
            const [logs, setLogs] = useState(INITIAL_LOGS);
            const [adminList, setAdminList] = useState([]);

            const [activeYear, setActiveYear] = useState(() => localStorage.getItem('sps_active_year') || new Date().getFullYear().toString());
            const [maxIndividu, setMaxIndividu] = useState(() => parseInt(localStorage.getItem('sps_max_individu')) || 3);
            const [maxKumpulan, setMaxKumpulan] = useState(() => parseInt(localStorage.getItem('sps_max_kumpulan')) || 2);
            const [categories, setCategories] = useState(["L12", "P12", "L9", "P9", "L7", "P7", "Prasekolah", "Terbuka"]);
            const [pointsConfig, setPointsConfig] = useState({ emas: 5, perak: 3, gangsa: 2, keempat: 1 });
            const [gasUrl, setGasUrl] = useState(activeCustomGasUrl);
            const [gasModalTab, setGasModalTab] = useState("config");

            const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
            const [isAdminMenuOpen, setIsAdminMenuOpen] = useState(false);
            const [passcodeInput, setPasscodeInput] = useState("");
            
            const [isAddAthleteSidebarOpen, setIsAddAthleteSidebarOpen] = useState(false);
            const [isAssignEventSidebarOpen, setIsAssignEventSidebarOpen] = useState(false);
            const [isEventSidebarOpen, setIsEventSidebarOpen] = useState(false);
            const [isHouseSidebarOpen, setIsHouseSidebarOpen] = useState(false);
            
            const [isPreviewModalOpen, setIsPreviewModalOpen] = useState(false);
            const [showPointsModal, setShowPointsModal] = useState(false);
            const [showGasModal, setShowGasModal] = useState(false);
            const [showSchoolSetupModal, setShowSchoolSetupModal] = useState(false);
            const [showDiagModal, setShowDiagModal] = useState(false);
            const [showSignatoryModal, setShowSignatoryModal] = useState(false);

            const [athleteForm, setAthleteForm] = useState({ id: "", nama: "", kelas: "", rumah: "Merah", jantina: "Lelaki", kategori: "L12" });
            const [isEditingAthlete, setIsEditingAthlete] = useState(false);
            const [regMode, setRegMode] = useState("tunggal");
            const [tsvInput, setTsvInput] = useState("");

            const [eventForm, setEventForm] = useState({ id: "", nama: "", kategori: "L12", jenis: "Balapan", format: "Individu", tarikh: "", masa: "" });
            const [isEditingEvent, setIsEditingEvent] = useState(false);

            const [heatForm, setHeatForm] = useState({ eventId: "", athleteId: "", saringanNo: "1", catatan: "" });
            const [activeStageTab, setActiveStageTab] = useState("saringan");
            const [resultForm, setResultForm] = useState({ eventId: "", athleteId: "", kedudukan: "1", catatan: "" });

            const [houseForm, setHouseForm] = useState({ nama: "", slogan: "", guruPenasihat: "", bonusPoints: 0, warnaLabel: "Ungu" });
            const [isEditingHouse, setIsEditingHouse] = useState(false);
            const [originalHouseKey, setOriginalHouseKey] = useState("");
            const [newAdvisorText, setNewAdvisorText] = useState({});

            const [announceFormText, setAnnounceFormText] = useState("");
            const [showAnnounceForm, setShowAnnounceForm] = useState(false);

            const [filterHouse, setFilterHouse] = useState("Semua");
            const [filterEvent, setFilterEvent] = useState("Semua");
            const [filterLogQuery, setFilterLogQuery] = useState("");
            const [studentSearchQuery, setStudentSearchQuery] = useState("");
            const [noAtletInput, setNoAtletInput] = useState("");
            const [selectedEventIds, setSelectedEventIds] = useState([]);
            const [selectedStudentId, setSelectedStudentId] = useState("");
            const [showSearchDropdown, setShowSearchDropdown] = useState(false);
            const [certSearchQuery, setCertSearchQuery] = useState("");
            const [selectedEventDate, setSelectedEventDate] = useState("Semua");

            const [setupSchoolName, setSetupSchoolName] = useState(activeSchoolName);
            const [setupSchoolSubtitle, setSetupSchoolSubtitle] = useState(activeSchoolSubtitle);
            const [setupSchoolLogo, setSetupSchoolLogo] = useState(activeSchoolLogo);
            const [setupFirebaseConfigRaw, setSetupFirebaseConfigRaw] = useState(cachedConfigRaw ? JSON.stringify(activeFirebaseConfig, null, 2) : "");
            const [setupGasUrl, setSetupGasUrl] = useState(activeCustomGasUrl);
            const [newCategoryInput, setNewCategoryInput] = useState("");

            const [showMembersModal, setShowMembersModal] = useState(false);
            const [selectedMembersHouse, setSelectedMembersHouse] = useState("");
            const [membersSortType, setMembersSortType] = useState("nama"); 

            const [previewContent, setPreviewContent] = useState("");
            const [certSignatory1Name, setCertSignatory1Name] = useState(() => localStorage.getItem('sps_sig1_name') || "Cikgu Adnan Bin Haji Abdul Rahman");
            const [certSignatory1Title, setCertSignatory1Title] = useState(() => localStorage.getItem('sps_sig1_title') || "Guru Besar SK Bikang");
            const [certSignatory2Name, setCertSignatory2Name] = useState(() => localStorage.getItem('sps_sig2_name') || "Cikgu Azman Bin Mohd");
            const [certSignatory2Title, setCertSignatory2Title] = useState(() => localStorage.getItem('sps_sig2_title') || "GPK Kokurikulum SK Bikang");

            const [toast, setToast] = useState({ show: false, message: "", type: "info" });
            const [confirmModal, setConfirmModal] = useState({ show: false, title: "", message: "", onConfirm: null });

            const adminMenuRef = useRef(null);
            const fileInputRef = useRef(null);

            const t = useMemo(() => translations[lang] || translations.BM, [lang]);
            const sortedCategories = useMemo(() => [...categories].sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' })), [categories]);
            const uniqueEventDates = useMemo(() => Array.from(new Set((events || []).map(e => e.tarikh).filter(Boolean))).sort(), [events]);
            const logoUrl = activeSchoolLogo;

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (adminMenuRef.current && !adminMenuRef.current.contains(event.target)) {
                        setIsAdminMenuOpen(false);
                    }
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            useEffect(() => {
                if (!currentUser) return;
                const email = currentUser.email || "";
                if (email === "sekolah-7608@moe-dl.edu.my" || adminList.some(admin => (admin.email || "").toLowerCase() === email.toLowerCase())) {
                    setUserRole("admin");
                } else if (email.endsWith("@moe-dl.edu.my") || email.endsWith("@moe.edu.my")) {
                    setUserRole("guru");
                } else if (!currentUser.isAnonymous) {
                    setUserRole("pelawat");
                }
            }, [currentUser, adminList]);

            useEffect(() => {
                if (!isCloudAvailable || !auth) {
                    setIsCloudActive(false);
                    setUserRole("pelawat");
                    return;
                }
                const unsubscribe = auth.onAuthStateChanged((user) => {
                    if (user) {
                        setCurrentUser(user);
                        setIsCloudActive(true);
                    } else {
                        const cachedRole = localStorage.getItem('sps_local_role');
                        const cachedName = localStorage.getItem('sps_local_name');
                        if (cachedRole && cachedName) {
                            setCurrentUser({ displayName: cachedName, email: localStorage.getItem('sps_local_email') || "guru@moe-dl.edu.my", isAnonymous: false });
                            setUserRole(cachedRole);
                            setIsCloudActive(true);
                        } else {
                            setCurrentUser(null);
                            setUserRole("pelawat");
                        }
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!isCloudActive || !db) return;
                const pathData = db.collection('artifacts').doc(appId).collection('public').doc('data');

                const unsubAthletes = pathData.collection('athletes').onSnapshot(snap => {
                    const data = []; snap.forEach(doc => data.push({ id: doc.id, ...doc.data() })); setAthletes(data.length > 0 ? data : INITIAL_ATHLETES);
                });
                const unsubEvents = pathData.collection('events').onSnapshot(snap => {
                    const data = []; snap.forEach(doc => data.push({ id: doc.id, ...doc.data() })); setEvents(data.length > 0 ? data : INITIAL_EVENTS);
                });
                const unsubResults = pathData.collection('results').onSnapshot(snap => {
                    const data = []; snap.forEach(doc => data.push({ id: doc.id, ...doc.data() })); setResults(data.length > 0 ? data : INITIAL_RESULTS);
                });
                const unsubHeats = pathData.collection('heats').onSnapshot(snap => {
                    const data = []; snap.forEach(doc => data.push({ id: doc.id, ...doc.data() })); setHeats(data);
                });
                const unsubAnnouncements = pathData.collection('announcements').onSnapshot(snap => {
                    const data = []; snap.forEach(doc => data.push({ id: doc.id, ...doc.data() })); setAnnouncements(data.length > 0 ? data.sort((a,b) => b.id.localeCompare(a.id)) : DEFAULT_ANNOUNCEMENTS);
                });
                const unsubLogs = pathData.collection('logs').onSnapshot(snap => {
                    const data = []; snap.forEach(doc => data.push({ id: doc.id, ...doc.data() })); setLogs(data.sort((a,b) => b.id.localeCompare(a.id)));
                });
                const unsubMetaHouses = pathData.collection('metadata').doc('houses').onSnapshot(doc => {
                    if (doc.exists) setHousesMetadata(doc.data() || INITIAL_HOUSES_METADATA);
                });
                const unsubMetaConfig = pathData.collection('metadata').doc('config').onSnapshot(doc => {
                    if (doc.exists) {
                        const d = doc.data();
                        if (d.activeYear) setActiveYear(d.activeYear);
                        if (d.maxIndividu !== undefined) setMaxIndividu(d.maxIndividu);
                        if (d.maxKumpulan !== undefined) setMaxKumpulan(d.maxKumpulan);
                        if (d.categories !== undefined) setCategories(d.categories);
                    }
                });
                const unsubPoints = pathData.collection('metadata').doc('points').onSnapshot(doc => {
                    if (doc.exists) setPointsConfig(doc.data() || pointsConfig);
                });

                return () => { unsubAthletes(); unsubEvents(); unsubResults(); unsubHeats(); unsubAnnouncements(); unsubLogs(); unsubMetaHouses(); unsubMetaConfig(); unsubPoints(); };
            }, [isCloudActive]);

            const getClassWeight = (kelas) => {
                const k = (kelas || "").toLowerCase();
                if (k.includes("pra") || k.includes("tadika")) return 0;
                const match = k.match(/\d+/);
                return match ? parseInt(match[0]) : 99;
            };

            const sortedHouseMembers = useMemo(() => {
                if (!selectedMembersHouse) return [];
                const list = [...(athletes || []).filter(a => a.rumah === selectedMembersHouse)];
                if (membersSortType === "nama") return list.sort((a, b) => (a.nama || "").localeCompare(b.nama || ""));
                if (membersSortType === "kelas") {
                    return list.sort((a, b) => {
                        const diff = getClassWeight(a.kelas) - getClassWeight(b.kelas);
                        if (diff !== 0) return diff;
                        const c = (a.kelas || "").localeCompare(b.kelas || "");
                        return c !== 0 ? c : (a.nama || "").localeCompare(b.nama || "");
                    });
                }
                if (membersSortType === "jantina") {
                    return list.sort((a, b) => {
                        if (a.jantina === b.jantina) return (a.nama || "").localeCompare(b.nama || "");
                        return a.jantina === "Lelaki" ? -1 : 1;
                    });
                }
                return list;
            }, [athletes, selectedMembersHouse, membersSortType]);

            const houseStandings = useMemo(() => {
                const houses = {};
                Object.keys(housesMetadata || INITIAL_HOUSES_METADATA).forEach(name => {
                    const meta = housesMetadata[name] || {};
                    const preset = COLOR_PRESETS[meta.warnaLabel] || COLOR_PRESETS.Merah;
                    houses[name] = { emas: 0, perak: 0, gangsa: 0, keempat: 0, mata: 0, warna: preset.warna, teks: preset.teks, glow: preset.glow, emoji: preset.emoji || "🏆" };
                });

                (results || []).forEach(res => {
                    const athlete = (athletes || []).find(a => a.id === res.athleteId);
                    if (athlete && houses[athlete.rumah]) {
                        const h = houses[athlete.rumah];
                        if (res.kedudukan === "1") { h.emas += 1; h.mata += pointsConfig.emas; }
                        else if (res.kedudukan === "2") { h.perak += 1; h.mata += pointsConfig.perak; }
                        else if (res.kedudukan === "3") { h.gangsa += 1; h.mata += pointsConfig.gangsa; }
                        else if (res.kedudukan === "4") { h.keempat += 1; h.mata += pointsConfig.keempat; }
                    }
                });

                Object.keys(houses).forEach(name => { if (housesMetadata[name]) houses[name].mata += parseInt(housesMetadata[name].bonusPoints) || 0; });
                return Object.entries(houses).map(([nama, data]) => ({ nama, ...data })).sort((a, b) => b.mata - a.mata);
            }, [results, athletes, pointsConfig, housesMetadata]);

            const eventsWithCode = useMemo(() => {
                const uniqueDates = Array.from(new Set((events || []).map(e => e.tarikh).filter(Boolean))).sort();
                const getDayNum = (date) => {
                    if (!date) return 1;
                    const idx = uniqueDates.indexOf(date);
                    return idx !== -1 ? idx + 1 : 1;
                };

                const groups = {};
                (events || []).forEach(e => {
                    const day = getDayNum(e.tarikh);
                    if (!groups[day]) groups[day] = [];
                    groups[day].push(e);
                });

                const eventCodeMap = {};
                Object.keys(groups).forEach(day => {
                    groups[day].sort((a, b) => {
                        const timeA = a.masa || "00:00"; const timeB = b.masa || "00:00";
                        if (timeA !== timeB) return timeA.localeCompare(timeB);
                        return a.nama.localeCompare(b.nama);
                    });
                    groups[day].forEach((ev, index) => {
                        eventCodeMap[ev.id] = `${day}${String(index + 1).padStart(2, '0')}`;
                    });
                });

                return (events || []).map(ev => ({ ...ev, kodAcara: eventCodeMap[ev.id] || "101" })).sort((a, b) => {
                    const dateA = a.tarikh || "9999-12-31"; const dateB = b.tarikh || "9999-12-31";
                    if (dateA !== dateB) return dateA.localeCompare(dateB);
                    const timeA = a.masa || "23:59"; const timeB = b.masa || "23:59";
                    if (timeA !== timeB) return timeA.localeCompare(timeB);
                    return (a.nama || "").localeCompare(b.nama || "");
                });
            }, [events]);

            const displayedEvents = useMemo(() => {
                if (selectedEventDate === "Semua") return eventsWithCode;
                return eventsWithCode.filter(e => e.tarikh === selectedEventDate);

                    printContent = `<div style="font-family: sans-serif; padding: 20px; color: #1e293b;"><div style="text-align: center; border-bottom: 3px double #0f172a; padding-bottom: 15px; margin-bottom: 30px;"><img src="${logoUrl}" style="height: 70px;" onerror="this.style.display='none'" /><h2 style="margin: 5px 0 0 0; text-transform: uppercase;">LAPORAN KESELURUHAN KEPUTUSAN ACARA</h2><h3 style="margin: 3px 0 0 0; color: #475569;">${activeSchoolName} - ${activeYear}</h3></div>${reportsHtml.length > 0 ? reportsHtml : '<p style="text-align:center; color:#64748b; font-style:italic;">Tiada keputusan acara direkodkan lagi.</p>'}</div>`;
                }

                if (!printContent) { showToastMessage("Ciri cetakan belum tersedia untuk fungsi ini.", "info"); return; }
                const fullHtml = `<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><title>Cetak Dokumen Sukan</title><style>body { background-color: #ffffff; padding: 15mm; font-family: sans-serif; } @media print { body { margin: 0; padding: 0; background: white; } @page { size: A4 portrait; margin: 10mm; } }</style></head><body>${printContent}</body></html>`;
                setPreviewContent(fullHtml); setIsPreviewModalOpen(true);
            };

            const selectedEventObject = eventsWithCode.find(e => e.id === resultForm.eventId || e.id === heatForm.eventId);
            const relevantAthletesForEventForm = (athletes || []).filter(a => selectedEventObject && categoriesMatch(a.kategori, selectedEventObject.kategori) && a.acaraIds && a.acaraIds.includes(selectedEventObject.id));

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 print:hidden">
                    <header className="bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 text-white shadow-md relative z-50">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-4">
                                <img src={logoUrl} alt="Logo" className="w-[66px] h-[66px] object-contain bg-white/10 rounded-xl p-1" onerror="this.style.display='none'" />
                                <div>
                                    <h1 className="text-xl font-extrabold tracking-tight flex flex-wrap items-center gap-2">
                                        SiPS Online
                                        <span className={`inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold ${isCloudActive ? "bg-emerald-500/20 text-emerald-300" : "bg-amber-500/20 text-amber-300"}`}>
                                            ● {isCloudActive ? "Awan Aktif" : "Mod Lokal"}
                                        </span>
                                    </h1>
                                    <p className="text-xs text-indigo-200 font-medium">{activeSchoolSubtitle} {activeYear} | {activeSchoolName}</p>
                                </div>
                            </div>
                            <div className="flex flex-wrap items-center gap-2 w-full md:w-auto justify-start md:justify-end">
                                {userRole === "admin" && (
                                    <div className="relative inline-block" ref={adminMenuRef}>
                                        <button onClick={() => setIsAdminMenuOpen(!isAdminMenuOpen)} className="bg-yellow-500 hover:bg-yellow-600 text-slate-950 font-black px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5">🛠️ PANEL PENTADBIR</button>
                                        {isAdminMenuOpen && (
                                            <div className="absolute right-0 mt-2 w-64 bg-white rounded-2xl shadow-2xl border py-2 text-slate-800 z-[9999]">
                                                <button onClick={() => { setShowDiagModal(true); setIsAdminMenuOpen(false); }} className="w-full text-left px-4 py-2 hover:bg-slate-50 text-xs font-semibold">ℹ️ Info Diagnostik</button>
                                                <button onClick={() => { setShowGasModal(true); setIsAdminMenuOpen(false); }} className="w-full text-left px-4 py-2 hover:bg-slate-50 text-xs font-semibold">⚡ Tetapan Sekolah Baharu (GAS)</button>
                                                <button onClick={() => { setShowPointsModal(true); setIsAdminMenuOpen(false); }} className="w-full text-left px-4 py-2 hover:bg-slate-50 text-xs font-semibold">⚙️ Tetapan Poin & Kategori</button>
                                                <button onClick={() => { setShowSchoolSetupModal(true); setIsAdminMenuOpen(false); }} className="w-full text-left px-4 py-2 hover:bg-slate-50 text-xs font-semibold">🏫 Tetapan Nama & Logo Portal</button>
                                            </div>
                                        )}
                                    </div>
                                )}
                                {currentUser && !currentUser.isAnonymous ? (
                                    <div className="flex items-center gap-2 bg-slate-800 p-1.5 pl-3 pr-2 rounded-xl text-xs">
                                        <div><p className="font-bold text-white">{currentUser.displayName || "Guru"}</p><p className="text-[9px] font-bold uppercase text-emerald-400">{userRole}</p></div>
                                        <button onClick={handleLogout} className="p-1 hover:bg-red-500/20 text-red-400 rounded-lg">✕</button>
                                    </div>
                                ) : (
                                    <button onClick={() => setIsLoginModalOpen(true)} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-1.5 rounded-xl text-xs">🔑 Log Masuk</button>
                                )}
                            </div>
                        </div>
                    </header>

                    <div className="bg-white border-b sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-4 flex overflow-x-auto space-x-1 py-2">
                            {Object.keys(t).map(tabKey => (
                                <button key={tabKey} onClick={() => setActiveTab(tabKey)} className={`px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap ${activeTab === tabKey ? "bg-indigo-600 text-white" : "text-slate-600 hover:bg-slate-100"}`}>{t[tabKey]}</button>
                            ))}
                        </div>
                    </div>

                    <main className="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
                        {}
                        {activeTab === "dashboard" && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    {houseStandings.map((h, idx) => (
                                        <div key={h.nama} className={`rounded-2xl p-5 border bg-white relative overflow-hidden transition-all duration-300 hover:-translate-y-1 hover:shadow-lg ${h.glow}`}>
                                            <div className={`absolute top-0 left-0 w-full h-1.5 ${h.warna}`}></div>
                                            <div className="flex justify-between items-start">
                                                <div><span className="text-[10px] font-black uppercase text-slate-400">Ked. #{idx+1}</span><h3 className="text-lg font-black text-slate-800">Rumah {h.nama}</h3></div>
                                                <span className={`text-2xl font-black ${h.teks}`}>{h.mata}</span>
                                            </div>
                                            <div className="grid grid-cols-4 gap-2 mt-6 text-center text-xs font-bold bg-slate-50 p-3 rounded-xl">
                                                <div><span className="text-2xl block mb-1">🥇</span><p>{h.emas}</p></div>
                                                <div><span className="text-2xl block mb-1">🥈</span><p>{h.perak}</p></div>
                                                <div><span className="text-2xl block mb-1">🥉</span><p>{h.gangsa}</p></div>
                                                <div><span className="text-2xl block mb-1">🏅</span><p>{h.keempat}</p></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <div className="lg:col-span-2 bg-white rounded-2xl p-6 border shadow-sm">
                                        <div className="flex justify-between items-center border-b pb-3 mb-4">
                                            <h3 className="text-sm font-bold text-slate-900 uppercase">Hebahan Semasa</h3>
                                            {userRole !== "pelawat" && (
                                                <button onClick={() => setShowAnnounceForm(!showAnnounceForm)} className="text-xs bg-indigo-50 text-indigo-600 font-bold px-3 py-1.5 rounded-lg hover:bg-indigo-100">+ Tambah Hebahan</button>
                                            )}
                                        </div>
                                        {showAnnounceForm && userRole !== "pelawat" && (
                                            <form onSubmit={handleAddAnnouncement} className="mb-6 bg-slate-50 p-4 rounded-xl space-y-3">
                                                <textarea rows="3" required value={announceFormText} onChange={(e) => setAnnounceFormText(e.target.value)} placeholder="Teks hebahan..." className="w-full p-3 rounded-lg border text-xs" />
                                                <button type="submit" className="bg-indigo-600 text-white font-bold px-4 py-2 rounded-lg text-xs">Hantar</button>
                                            </form>
                                        )}
                                        <div className="space-y-4">
                                            {(announcements || []).map(ann => (
                                                <div key={ann.id} className="bg-amber-50/50 border border-amber-100 rounded-xl p-4 flex justify-between items-start gap-4 text-xs font-medium">
                                                    <div><p className="mb-1 text-slate-800">{ann.text}</p><span className="text-[10px] text-slate-400">✍️ {ann.author} • {ann.date}</span></div>
                                                    {userRole !== "pelawat" && <button className="text-red-500 font-bold">✕</button>}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="bg-white rounded-2xl p-6 border shadow-sm flex flex-col h-[400px]">
                                        <div className="border-b pb-3 mb-4"><h3 className="text-sm font-bold text-slate-900 uppercase">📈 Log Aktiviti</h3></div>
                                        <div className="space-y-3 overflow-y-auto flex-grow text-[11px]">
                                            {(logs || []).slice(0, 30).map(log => (
                                                <div key={log.id} className="p-2.5 rounded-lg bg-slate-50 border space-y-1">
                                                    <div className="flex justify-between text-[10px] text-slate-400 font-semibold"><span>{log.userName}</span><span>{log.timestamp}</span></div>
                                                    <p className="font-extrabold text-slate-700">{log.action}</p>
                                                    <p className="text-slate-500">{log.details}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === "rumah_sukan" && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center bg-white p-4 rounded-2xl border shadow-sm">
                                    <div><h3 className="font-extrabold text-slate-800 text-sm">Pengurusan Rumah Sukan</h3></div>
                                    {userRole !== "pelawat" && (
                                        <button onClick={() => { setHouseForm({ nama: "", slogan: "", guruPenasihat: "", bonusPoints: 0, warnaLabel: "Ungu" }); setIsEditingHouse(false); setIsHouseSidebarOpen(true); }} className="bg-indigo-600 text-white font-bold text-xs px-4 py-2.5 rounded-xl">+ Tambah Rumah</button>
                                    )}
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {Object.keys(housesMetadata || INITIAL_HOUSES_METADATA).map(houseName => {
                                        const meta = housesMetadata[houseName] || {};
                                        const preset = COLOR_PRESETS[meta.warnaLabel] || COLOR_PRESETS.Merah;
                                        const advisors = meta.guruPenasihat ? meta.guruPenasihat.split(',').map(s => s.trim()).filter(Boolean) : [];
                                        const totalCount = (athletes || []).filter(a => a.rumah === houseName).length;
                                        
                                        return (
                                            <div key={houseName} className="rounded-3xl p-6 bg-white border border-slate-100 hover:shadow-xl transition-all duration-300 relative overflow-hidden flex flex-col justify-between">
                                                <div className={`absolute top-0 left-0 w-full h-2 ${preset.warna}`}></div>
                                                <div>
                                                    <div className="flex justify-between items-start mb-4">
                                                        <div>
                                                            <h4 className="text-xl font-black text-slate-800">Rumah {houseName}</h4>
                                                            <p className="text-xs text-indigo-600 font-bold italic mt-1">"{meta.slogan}"</p>
                                                        </div>
                                                        {userRole !== "pelawat" && (
                                                            <button onClick={() => {
                                                                setOriginalHouseKey(houseName);
                                                                setHouseForm({ nama: houseName, slogan: meta.slogan || "", bonusPoints: meta.bonusPoints || 0, warnaLabel: meta.warnaLabel || "Ungu" });
                                                                setIsEditingHouse(true); setIsHouseSidebarOpen(true);
                                                            }} className="text-xs bg-slate-50 hover:bg-slate-100 border p-1.5 rounded-lg font-bold">✏️ Edit</button>
                                                        )}
                                                    </div>
                                                    <div className="space-y-2 mb-4">
                                                        <p className="font-bold text-slate-400 uppercase text-[10px]">Guru Penasihat</p>
                                                        <div className="flex flex-wrap gap-1.5">
                                                            {advisors.map(adv => (
                                                                <span key={adv} className="bg-slate-100 text-slate-700 px-2 py-1 rounded-lg text-xs font-bold border flex items-center gap-1">
                                                                    👤 {adv} {userRole !== "pelawat" && <button onClick={() => handleRemoveAdvisor(houseName, adv)} className="text-red-500 ml-1">✕</button>}
                                                                </span>
                                                            ))}
                                                        </div>
                                                        {userRole !== "pelawat" && (
                                                            <div className="flex gap-1.5 mt-2">
                                                                <input type="text" placeholder="Nama guru..." value={newAdvisorText[houseName] || ""} onChange={(e) => setNewAdvisorText({ ...newAdvisorText, [houseName]: e.target.value })} className="flex-1 p-1.5 border rounded-lg text-xs" />
                                                                <button onClick={() => handleAddAdvisor(houseName)} className="bg-indigo-600 text-white font-bold px-3 rounded-lg text-xs">Tambah</button>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                                <div className="border-t pt-4">
                                                    <button onClick={() => { setSelectedMembersHouse(houseName); setMembersSortType("nama"); setShowMembersModal(true); }} className="w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-700 py-2.5 px-3 rounded-xl font-bold text-xs border border-indigo-100 mb-3">
                                                        👥 Papar Ahli ({totalCount}) / Tambah Ahli
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {activeTab === "atlit" && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center bg-white p-4 rounded-2xl border shadow-sm">
                                    <h3 className="font-extrabold text-slate-800 text-sm">Pengurusan Atlet ({filteredAthletes.length} direkod)</h3>
                                    {userRole !== "pelawat" && (
                                        <div className="flex gap-2">
                                            <button onClick={() => { setAthleteForm({ id: "", nama: "", kelas: "", rumah: "Merah", jantina: "Lelaki", kategori: "L12" }); setIsEditingAthlete(false); setIsAddAthleteSidebarOpen(true); }} className="bg-indigo-600 text-white font-bold text-xs px-4 py-2 rounded-xl">➕ Daftar Atlet</button>
                                            <button onClick={() => { setSelectedStudentId(""); setStudentSearchQuery(""); setIsAssignEventSidebarOpen(true); }} className="bg-slate-800 text-white font-bold text-xs px-4 py-2 rounded-xl">⏱️ Urus Acara</button>
                                        </div>
                                    )}
                                </div>
                                <div className="bg-white rounded-2xl p-6 border shadow-sm overflow-x-auto text-xs">
                                    <table className="w-full text-left">
                                        <thead>
                                            <tr className="border-b text-slate-400 font-bold uppercase text-[10px] tracking-wider">
                                                <th className="py-2">Nama</th>
                                                <th className="py-2">Kelas</th>
                                                <th className="py-2">Kategori</th>
                                                <th className="py-2">Rumah</th>
                                                {userRole !== "pelawat" && <th className="py-2 text-center">Tindakan</th>}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {filteredAthletes.map((ath) => (
                                                <tr key={ath.id} className="border-b font-semibold">
                                                    <td className="py-2 uppercase text-slate-800">{ath.nama}</td>
                                                    <td className="py-2">{ath.kelas}</td>
                                                    <td className="py-2 text-indigo-600">{ath.kategori}</td>
                                                    <td className="py-2">{ath.rumah}</td>
                                                    {userRole !== "pelawat" && (
                                                        <td className="py-2 text-center">
                                                            <button onClick={() => { setAthleteForm(ath); setIsEditingAthlete(true); setIsAddAthleteSidebarOpen(true); }} className="text-blue-600 mr-2">✏️</button>
                                                            <button onClick={() => handleDeleteAthlete(ath.id)} className="text-red-500">✕</button>
                                                        </td>
                                                    )}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activeTab === "acara" && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center bg-white p-4 rounded-2xl border shadow-sm">
                                    <h3 className="font-extrabold text-slate-800 text-sm">Senarai Acara Kejohanan</h3>
                                    {userRole !== "pelawat" && (
                                        <button onClick={() => { setEventForm({ id: "", nama: "", kategori: "L12", jenis: "Balapan", format: "Individu", tarikh: "", masa: "" }); setIsEditingEvent(false); setIsEventSidebarOpen(true); }} className="bg-indigo-600 text-white font-bold text-xs px-4 py-2.5 rounded-xl">+ Tambah Acara</button>
                                    )}
                                </div>
                                <div className="bg-white rounded-2xl p-6 border shadow-sm space-y-3">
                                    {displayedEvents.map(ev => (
                                        <div key={ev.id} className="flex justify-between items-center p-3 rounded-xl bg-slate-50 border text-xs font-semibold">
                                            <div className="flex items-center gap-3">
                                                <span className="font-mono bg-indigo-600 text-white px-2.5 py-1 rounded-xl text-[10px]">{ev.kodAcara}</span>
                                                <div><h4 className="font-extrabold text-slate-800 uppercase">{ev.nama} {getFriendlyCategory(ev.kategori)}</h4><span className="text-slate-400 text-[10px]">{ev.jenis} | {ev.format}</span></div>
                                            </div>
                                            <div className="flex items-center gap-4">
                                                {userRole !== "pelawat" && (
                                                    <div className="flex gap-2">
                                                        <button onClick={() => { setEventForm(ev); setIsEditingEvent(true); setIsEventSidebarOpen(true); }} className="text-blue-600">✏️ Edit</button>
                                                        <button onClick={() => handleDeleteEvent(ev.id)} className="text-red-500">✕</button>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === "keputusan" && (
                            <div className="space-y-6">
                                <div className="bg-white p-5 rounded-2xl border shadow-sm">
                                    <div className="flex justify-between items-end gap-4 mb-4">
                                        <div className="flex-1">
                                            <label className="block text-xs font-bold text-slate-400 uppercase mb-2">Pilih Acara Kejohanan</label>
                                            <select value={resultForm.eventId || heatForm.eventId} onChange={(e) => { const val = e.target.value; setResultForm(prev => ({ ...prev, eventId: val })); setHeatForm(prev => ({ ...prev, eventId: val })); }} className="w-full p-2.5 border rounded-xl bg-white text-xs font-bold">
                                                <option value="">-- Pilih Acara --</option>
                                                {eventsWithCode.map(ev => (<option key={ev.id} value={ev.id}>[{ev.kodAcara}] {ev.nama} {getFriendlyCategory(ev.kategori)}</option>))}
                                            </select>
                                        </div>
                                        <button onClick={() => executeBypassPrint('semua_keputusan')} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2.5 rounded-xl shadow transition whitespace-nowrap text-xs">
                                            🖨️ Cetak Semua Keputusan
                                        </button>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <div className="lg:col-span-1">
                                        <div className="bg-white rounded-2xl p-5 border shadow-sm space-y-4 text-xs font-semibold">
                                            <h3 className="font-bold text-slate-900 border-b pb-2">🏅 Keputusan Pingat</h3>
                                            <form onSubmit={handleResultSubmit} className="space-y-3">
                                                <select value={resultForm.kedudukan} onChange={(e) => setResultForm({ ...resultForm, kedudukan: e.target.value })} className="w-full p-2 border bg-white rounded-xl"><option value="1">🥇 Johan (Emas)</option><option value="2">🥈 Naib Johan</option><option value="3">🥉 Ketiga</option><option value="4">🏅 Keempat</option></select>
                                                <select required value={resultForm.athleteId} onChange={(e) => setResultForm({ ...resultForm, athleteId: e.target.value })} className="w-full p-2 border bg-white rounded-xl"><option value="">-- Pilih Atlet --</option>{relevantAthletesForEventForm.map(ath => (<option key={ath.id} value={ath.id}>{ath.nama.toUpperCase()} ({ath.rumah})</option>))}</select>
                                                <input type="text" value={resultForm.catatan} onChange={(e) => setResultForm({ ...resultForm, catatan: e.target.value })} placeholder="Catatan Masa/Jarak..." className="w-full p-2 border rounded-xl" />
                                                <button type="submit" className="w-full bg-indigo-600 text-white py-2 rounded-xl font-bold">Kunci Keputusan</button>
                                            </form>
                                        </div>
                                    </div>
                                    <div className="lg:col-span-2 bg-white rounded-2xl p-5 border shadow-sm">
                                        <h3 className="text-sm font-bold text-slate-800 uppercase mb-4">{selectedEventObject ? `${selectedEventObject.nama} ${getFriendlyCategory(selectedEventObject.kategori)}` : "Pilih acara untuk papar keputusan"}</h3>
                                        <div className="space-y-2">
                                            {(results || []).filter(r => r.eventId === (selectedEventObject?.id || "")).map(res => {
                                                const ath = (athletes || []).find(a => a.id === res.athleteId);
                                                const medalMap = { "1": "🥇 Johan", "2": "🥈 Naib Johan", "3": "🥉 Ketiga", "4": "🏅 Keempat" };
                                                return (
                                                    <div key={res.id} className="flex justify-between items-center text-xs p-2 rounded-lg bg-slate-50 border">
                                                        <span className="font-bold">{medalMap[res.kedudukan]} - {ath ? ath.nama : ""}</span>
                                                        <div className="flex gap-3 items-center"><span className="font-mono bg-slate-200 px-2 py-0.5 rounded">{res.catatan || 'N/A'}</span>{userRole !== "pelawat" && <button onClick={() => handleDeleteResult(res.id)} className="text-red-500">✕</button>}</div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === "pasca_sukan" && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-2xl border shadow-sm">
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                        <div><h3 className="text-lg font-black text-slate-900">🏆 Modul Dokumentasi</h3></div>
                                        <div className="flex gap-2">
                                            <button onClick={() => executeBypassPrint('kokum')} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow transition">📊 Jana Laporan</button>
                                            {userRole === "admin" && <button onClick={() => setShowSignatoryModal(true)} className="bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow transition">✍️ Penandatangan Sijil</button>}
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-white p-6 rounded-2xl border shadow-sm">
                                    <h3 className="text-sm font-bold text-slate-900 mb-2 uppercase">📜 Penjana Sijil Penghargaan</h3>
                                    <input type="text" placeholder="Cari nama atlet..." value={certSearchQuery} onChange={(e) => setCertSearchQuery(e.target.value)} className="w-full p-2.5 rounded-xl border text-xs font-bold mb-4" />
                                    <div className="space-y-2.5 max-h-72 overflow-y-auto">
                                        {(athletes || []).filter(ath => ath.nama.toLowerCase().includes(certSearchQuery.toLowerCase())).map(ath => (
                                            <div key={ath.id} className="flex justify-between items-center p-3 rounded-xl bg-slate-50 border text-xs">
                                                <div><p className="font-extrabold text-slate-800 uppercase">{ath.nama}</p></div>
                                                <button onClick={() => executeBypassPrint('sijil', ath)} className="bg-indigo-600 text-white font-bold px-3 py-1.5 rounded-lg">Cetak Sijil</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {}
                    {showMembersModal && (
                        <div className="fixed inset-0 bg-slate-900/60 z-[9999] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-2xl w-full h-[80vh] flex flex-col text-xs font-semibold">
                                <div className="bg-gradient-to-r from-blue-900 to-indigo-900 text-white px-6 py-4 flex justify-between items-center">
                                    <h3 className="text-sm font-black uppercase">👥 Ahli Rumah {selectedMembersHouse}</h3>
                                    <button onClick={() => setShowMembersModal(false)} className="text-slate-400 hover:text-white">✕</button>
                                </div>
                                <div className="p-4 border-b flex justify-between items-center bg-slate-50">
                                    <span className="text-slate-500">Jumlah: {sortedHouseMembers.length}</span>
                                    {userRole !== "pelawat" && (
                                        <button onClick={() => { setAthleteForm({ id: "", nama: "", kelas: "", rumah: selectedMembersHouse, jantina: "Lelaki", kategori: "L12" }); setIsEditingAthlete(false); setIsAddAthleteSidebarOpen(true); }} className="bg-indigo-600 text-white px-3 py-1.5 rounded-lg font-bold">➕ Tambah Ahli Rumah</button>
                                    )}
                                </div>
                                <div className="flex-grow overflow-y-auto p-4">
                                    <table className="w-full text-left">
                                        <thead><tr className="border-b text-slate-400 uppercase text-[10px]"><th className="py-2">No</th><th className="py-2">Nama</th><th className="py-2">Kelas</th><th className="py-2">Kat</th>{userRole !== "pelawat" && <th className="py-2">Tindakan</th>}</tr></thead>
                                        <tbody>
                                            {sortedHouseMembers.map((ath, idx) => (
                                                <tr key={ath.id} className="border-b font-bold">
                                                    <td className="py-2">{idx + 1}</td>
                                                    <td className="py-2 uppercase">{ath.nama}</td>
                                                    <td className="py-2">{ath.kelas}</td>
                                                    <td className="py-2 text-indigo-600">{ath.kategori}</td>
                                                    {userRole !== "pelawat" && (
                                                        <td className="py-2">
                                                            <button onClick={() => { setAthleteForm(ath); setIsEditingAthlete(true); setIsAddAthleteSidebarOpen(true); }} className="text-blue-600 mr-2">✏️</button>
                                                            <button onClick={() => handleDeleteAthlete(ath.id)} className="text-red-500">✕</button>
                                                        </td>
                                                    )}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="bg-slate-50 p-4 border-t flex justify-end"><button onClick={() => setShowMembersModal(false)} className="px-5 py-2 bg-slate-200 rounded-xl">Tutup</button></div>
                            </div>
                        </div>
                    )}

                    {/* Various Sidebars and Modals */}
                    {isHouseSidebarOpen && (
                        <div className="fixed inset-0 z-[100] flex justify-end">
                            <div className="fixed inset-0 bg-slate-900/60" onClick={() => setIsHouseSidebarOpen(false)} />
                            <div className="relative w-full max-w-md bg-white p-6 text-xs font-semibold space-y-4">
                                <h3 className="font-bold text-sm uppercase">{isEditingHouse ? "Sunting Rumah" : "Tambah Rumah"}</h3>
                                <form onSubmit={isEditingHouse ? handleEditHouseSubmit : handleAddHouseSubmitDirect} className="space-y-4">
                                    <input type="text" disabled={isEditingHouse} required value={houseForm.nama} onChange={e => setHouseForm({...houseForm, nama: e.target.value})} placeholder="Nama Rumah" className="w-full p-2 border rounded-xl" />
                                    <input type="text" required value={houseForm.slogan} onChange={e => setHouseForm({...houseForm, slogan: e.target.value})} placeholder="Slogan" className="w-full p-2 border rounded-xl" />
                                    <input type="number" value={houseForm.bonusPoints} onChange={e => setHouseForm({...houseForm, bonusPoints: parseInt(e.target.value)||0})} placeholder="Bonus" className="w-full p-2 border rounded-xl" />
                                    <select value={houseForm.warnaLabel} onChange={e => setHouseForm({...houseForm, warnaLabel: e.target.value})} className="w-full p-2 border rounded-xl">{Object.keys(COLOR_PRESETS).map(k => <option key={k} value={k}>{k}</option>)}</select>
                                    <button type="submit" className="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-bold">Simpan</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {isAddAthleteSidebarOpen && (
                        <div className="fixed inset-0 z-[101] flex justify-end">
                            <div className="fixed inset-0 bg-slate-900/60" onClick={() => setIsAddAthleteSidebarOpen(false)} />
                            <div className="relative w-full max-w-md bg-white p-6 text-xs font-semibold space-y-4">
                                <h3 className="font-bold text-sm uppercase">{isEditingAthlete ? "Sunting Atlet" : "Daftar Atlet"}</h3>
                                <form onSubmit={handleAthleteSubmit} className="space-y-3">
                                    <input type="text" required value={athleteForm.nama} onChange={e => setAthleteForm({...athleteForm, nama: e.target.value.toUpperCase()})} placeholder="Nama Penuh" className="w-full p-2 border rounded-xl uppercase" />
                                    <input type="text" required value={athleteForm.kelas} onChange={e => setAthleteForm({...athleteForm, kelas: e.target.value})} placeholder="Kelas" className="w-full p-2 border rounded-xl uppercase" />
                                    <select value={athleteForm.rumah} onChange={e => setAthleteForm({...athleteForm, rumah: e.target.value})} className="w-full p-2 border rounded-xl">{Object.keys(housesMetadata||INITIAL_HOUSES_METADATA).map(n => <option key={n} value={n}>{n}</option>)}</select>
                                    <select value={athleteForm.jantina} onChange={e => setAthleteForm({...athleteForm, jantina: e.target.value})} className="w-full p-2 border rounded-xl"><option value="Lelaki">Lelaki</option><option value="Perempuan">Perempuan</option></select>
                                    <select value={athleteForm.kategori} onChange={e => setAthleteForm({...athleteForm, kategori: e.target.value})} className="w-full p-2 border rounded-xl">{sortedCategories.map(c => <option key={c} value={c}>{c}</option>)}</select>
                                    <button type="submit" className="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-bold">Simpan</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {isEventSidebarOpen && (
                        <div className="fixed inset-0 z-[100] flex justify-end">
                            <div className="fixed inset-0 bg-slate-900/60" onClick={() => setIsEventSidebarOpen(false)} />
                            <div className="relative w-full max-w-md bg-white p-6 text-xs font-semibold space-y-4">
                                <h3 className="font-bold text-sm uppercase">{isEditingEvent ? "Sunting Acara" : "Daftar Acara"}</h3>
                                <form onSubmit={handleEventSubmit} className="space-y-3">
                                    <input type="text" required value={eventForm.nama} onChange={e => setEventForm({...eventForm, nama: e.target.value.toUpperCase()})} placeholder="Nama Acara" className="w-full p-2 border rounded-xl uppercase" />
                                    <select value={eventForm.kategori} onChange={e => setEventForm({...eventForm, kategori: e.target.value})} className="w-full p-2 border rounded-xl">{sortedCategories.map(c => <option key={c} value={c}>{c}</option>)}</select>
                                    <select value={eventForm.jenis} onChange={e => setEventForm({...eventForm, jenis: e.target.value})} className="w-full p-2 border rounded-xl"><option value="Balapan">Balapan</option><option value="Padang">Padang</option></select>
                                    <select value={eventForm.format} onChange={e => setEventForm({...eventForm, format: e.target.value})} className="w-full p-2 border rounded-xl"><option value="Individu">Individu</option><option value="Berkumpulan">Berkumpulan</option></select>
                                    <button type="submit" className="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-bold">Simpan</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {showPointsModal && (
                        <div className="fixed inset-0 bg-slate-900/60 z-[9999] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full text-xs font-semibold space-y-4">
                                <h3 className="text-sm font-extrabold text-slate-900 uppercase">⚙️ Tetapan Kejohanan & Kategori</h3>
                                <div className="space-y-2">
                                    <label className="block mb-1 font-bold">Tambah Kategori Baharu Pintar</label>
                                    <div className="flex gap-2">
                                        <input type="text" value={newCategoryInput} onChange={e => setNewCategoryInput(e.target.value)} placeholder="Cth: L12TKB" className="flex-1 p-2 border rounded-xl uppercase" />
                                        <button onClick={handleAddCategory} className="bg-indigo-600 text-white px-3 py-2 rounded-xl font-bold">Tambah</button>
                                    </div>
                                    <p className="text-[10px] text-slate-400 leading-relaxed">Kod mestilah mengandungi huruf <strong>L</strong> atau <strong>P</strong> (Lelaki/Perempuan) serta angka umur. Sistem akan menapis kemasukan secara automatik berdasarkan format pintar ini.</p>
                                </div>
                                <div className="flex justify-end gap-3 font-bold mt-4"><button onClick={() => setShowPointsModal(false)} className="px-4 py-2 bg-slate-100 rounded-xl">Tutup</button></div>
                            </div>
                        </div>
                    )}

                    {showSignatoryModal && (
                        <div className="fixed inset-0 bg-slate-900/60 z-[9999] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full text-xs font-semibold space-y-4">
                                <h3 className="text-sm font-extrabold text-slate-900 uppercase">✍️ Penandatangan Sijil</h3>
                                <div className="space-y-3">
                                    <div><label className="block mb-1 text-slate-400">Pegawai 1 (Kiri) - Nama</label><input type="text" value={certSignatory1Name} onChange={e => setCertSignatory1Name(e.target.value)} className="w-full p-2 border rounded-xl" /></div>
                                    <div><label className="block mb-1 text-slate-400">Pegawai 1 - Jawatan</label><input type="text" value={certSignatory1Title} onChange={e => setCertSignatory1Title(e.target.value)} className="w-full p-2 border rounded-xl" /></div>
                                    <hr className="my-2" />
                                    <div><label className="block mb-1 text-slate-400">Pegawai 2 (Kanan) - Nama</label><input type="text" value={certSignatory2Name} onChange={e => setCertSignatory2Name(e.target.value)} className="w-full p-2 border rounded-xl" /></div>
                                    <div><label className="block mb-1 text-slate-400">Pegawai 2 - Jawatan</label><input type="text" value={certSignatory2Title} onChange={e => setCertSignatory2Title(e.target.value)} className="w-full p-2 border rounded-xl" /></div>
                                </div>
                                <div className="flex justify-end gap-3 font-bold"><button onClick={() => setShowSignatoryModal(false)} className="px-4 py-2 bg-slate-100 rounded-xl">Batal</button><button onClick={handleSaveSignatories} className="px-4 py-2 bg-indigo-600 text-white rounded-xl">Simpan</button></div>
                            </div>
                        </div>
                    )}

                    {showSchoolSetupModal && (
                        <div className="fixed inset-0 bg-slate-900/60 z-[9999] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full text-xs font-semibold space-y-4">
                                <h3 className="text-sm font-extrabold text-slate-900 uppercase">🏫 Tetapan Portal</h3>
                                <div className="space-y-3">
                                    <input type="text" value={setupSchoolName} onChange={e => setSetupSchoolName(e.target.value)} placeholder="Nama Sekolah" className="w-full p-2 border rounded-xl" />
                                    <input type="text" value={setupSchoolSubtitle} onChange={e => setSetupSchoolSubtitle(e.target.value)} placeholder="Subtajuk" className="w-full p-2 border rounded-xl" />
                                    <input type="text" value={setupSchoolLogo} onChange={e => setSetupSchoolLogo(e.target.value)} placeholder="URL Logo" className="w-full p-2 border rounded-xl" />
                                </div>
                                <div className="flex justify-end gap-3 font-bold"><button onClick={() => setShowSchoolSetupModal(false)} className="px-4 py-2 bg-slate-100 rounded-xl">Tutup</button><button onClick={() => { localStorage.setItem('sps_school_name', setupSchoolName); localStorage.setItem('sps_school_subtitle', setupSchoolSubtitle); localStorage.setItem('sps_school_logo', setupSchoolLogo); window.location.reload(); }} className="px-4 py-2 bg-indigo-600 text-white rounded-xl">Simpan & Muat Semula</button></div>
                            </div>
                        </div>
                    )}

                    {showDiagModal && (
                        <div className="fixed inset-0 bg-slate-900/60 z-[9999] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full text-xs font-semibold space-y-3">
                                <h3 className="text-sm font-extrabold text-slate-900 uppercase">ℹ️ Info Diagnostik</h3>
                                <div className="space-y-2 font-mono text-[10px] bg-slate-50 p-3 rounded-xl border">
                                    <p>Firebase Active Connection: {isCloudActive ? "CONNECTED" : "OFFLINE"}</p>
                                    <p>Total Registered Athletes: {athletes.length}</p>
                                    <p>Total Configured Events: {events.length}</p>
                                </div>
                                <div className="flex justify-end font-bold"><button onClick={() => setShowDiagModal(false)} className="px-4 py-2 bg-slate-100 rounded-xl">Tutup</button></div>
                            </div>
                        </div>
                    )}

                    {isPreviewModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/80 z-[10000] flex flex-col items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-5xl h-[90vh] flex flex-col overflow-hidden">
                                <div className="bg-slate-950 text-white px-6 py-4 flex justify-between items-center">
                                    <h3 className="text-sm font-black uppercase">📄 Pratinjau Dokumen</h3>
                                    <button onClick={() => setIsPreviewModalOpen(false)} className="text-slate-400">✕</button>
                                </div>
                                <div className="flex-grow bg-slate-100 p-4 overflow-hidden flex justify-center">
                                    <iframe id="preview-iframe" srcDoc={previewContent} className="w-full h-full max-w-[210mm] bg-white shadow-2xl rounded-xl" />
                                </div>
                                <div className="bg-slate-50 border-t px-6 py-4 flex justify-end gap-3 text-xs font-bold">
                                    <button onClick={() => setIsPreviewModalOpen(false)} className="px-5 py-2.5 bg-slate-200 rounded-xl">Tutup</button>
                                    <button onClick={() => { const iframe = document.getElementById('preview-iframe'); if (iframe) { iframe.contentWindow.focus(); iframe.contentWindow.print(); } }} className="px-6 py-2.5 bg-indigo-600 text-white rounded-xl">Cetak Sekarang</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toast.show && (
                        <div className="fixed bottom-5 right-5 z-[10000] max-w-sm p-4 rounded-xl shadow-2xl bg-slate-900 text-white text-xs font-bold transition-all duration-300"><p>{toast.message}</p></div>
                    )}
                    {confirmModal.show && (
                        <div className="fixed inset-0 bg-slate-900/60 z-[9999] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full text-xs font-semibold">
                                <h3 className="text-sm font-extrabold text-slate-900 mb-2">{confirmModal.title}</h3>
                                <p className="text-slate-500 leading-relaxed mb-6">{confirmModal.message}</p>
                                <div className="flex justify-end gap-3 font-bold">
                                    <button onClick={() => setConfirmModal({ show: false })} className="px-4 py-2 bg-slate-100 rounded-xl">Batal</button>
                                    <button onClick={() => { if (confirmModal.onConfirm) confirmModal.onConfirm(); }} className="px-4 py-2 bg-red-600 text-white rounded-xl">Sahkan</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />); 
    </script>
</body>
</html>
