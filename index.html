<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiPS Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-slate-800 antialiased">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const translations = {
            BM: {
                dashboard: "Papan Pemuka", rumah_sukan: "Rumah Sukan", acara: "Pengurusan Acara", atlit: "Pengurusan Atlet", 
                keputusan: "Keputusan Acara", pasca_sukan: "Pasca Sukan", announcement: "Hebahan Semasa Kejohanan"
            },
            EN: {
                dashboard: "Dashboard", rumah_sukan: "Sports Houses", acara: "Events Management", atlit: "Athletes Management", 
                keputusan: "Event Results", pasca_sukan: "Post-Sports", announcement: "Tournament Announcements"
            }
        };

        const DEFAULT_FIREBASE_CONFIG = {
            apiKey: "AIzaSyAJ5LrENOSzRkClehZmu3dy3JKrt6QvtcU", authDomain: "sps-skb-d8256.firebaseapp.com",
            projectId: "sps-skb-d8256", storageBucket: "sps-skb-d8256.firebasestorage.app",
            messagingSenderId: "322634427088", appId: "1:322634427088:web:7f6858760d588e49190cd5"
        };
        const DEFAULT_SCHOOL_NAME = "SK BIKANG";
        const DEFAULT_SCHOOL_SUBTITLE = "Kejohanan Sukan Tahunan Sekolah";
        const DEFAULT_SCHOOL_LOGO = "https://lh3.googleusercontent.com/d/1E8tjAd7j9DJaZgngDn38agUFCvwyUffa";

        let activeFirebaseConfig = DEFAULT_FIREBASE_CONFIG;
        const cachedConfigRaw = localStorage.getItem('sps_custom_firebase_config');
        if (cachedConfigRaw) {
            try { activeFirebaseConfig = JSON.parse(cachedConfigRaw); } catch (e) { console.error(e); }
        }

        let db = null; let auth = null; let isCloudAvailable = false;
        if (typeof firebase !== 'undefined') {
            try {
                if (!firebase.apps.length) firebase.initializeApp(activeFirebaseConfig);
                auth = firebase.auth(); db = firebase.firestore(); isCloudAvailable = true;
            } catch (err) { console.warn("Lokal:", err); }
        }
        const appId = activeFirebaseConfig.projectId || "sps-skb-d8256";

        const COLOR_PRESETS = {
            Merah: { bg: "bg-red-100", text: "text-red-700", warna: "bg-red-500", teks: "text-red-600", glow: "hover:shadow-[0_0_20px_rgba(239,68,68,0.4)] border-red-200" },
            Biru: { bg: "bg-blue-100", text: "text-blue-700", warna: "bg-blue-500", teks: "text-blue-600", glow: "hover:shadow-[0_0_20px_rgba(59,130,246,0.4)] border-blue-200" },
            Hijau: { bg: "bg-emerald-100", text: "text-emerald-700", warna: "bg-emerald-500", teks: "text-emerald-600", glow: "hover:shadow-[0_0_20px_rgba(16,185,129,0.4)] border-emerald-200" },
            Kuning: { bg: "bg-amber-100", text: "text-amber-700", warna: "bg-amber-400", teks: "text-amber-500", glow: "hover:shadow-[0_0_20px_rgba(251,191,36,0.4)] border-amber-200" },
            Ungu: { bg: "bg-purple-100", text: "text-purple-700", warna: "bg-purple-500", teks: "text-purple-600", glow: "hover:shadow-[0_0_20px_rgba(168,85,247,0.4)] border-purple-200" },
            Oren: { bg: "bg-orange-100", text: "text-orange-700", warna: "bg-orange-500", teks: "text-orange-600", glow: "hover:shadow-[0_0_20px_rgba(249,115,22,0.4)] border-orange-200" }
        };

        const INITIAL_HOUSES = {
            Merah: { slogan: "Saga Membara", guruPenasihat: "Cikgu A", bonusPoints: 0, warnaLabel: "Merah" },
            Biru: { slogan: "Biru Gagah", guruPenasihat: "Cikgu B", bonusPoints: 0, warnaLabel: "Biru" }
        };

        const getFriendlyCategory = (cat) => cat ? String(cat).trim().toUpperCase() : "";
        const formatDateToDMY = (dateStr) => {
            if (!dateStr) return "N/A";
            const parts = dateStr.split('-');
            return parts.length === 3 ? (parts[0].length === 4 ? `${parts[2]}-${parts[1]}-${parts[0]}` : dateStr) : dateStr;
        };

        const categoriesMatch = (athCat, evCat) => {
            if (!athCat || !evCat) return false;
            const a = athCat.trim().toUpperCase().replace(/\s+/g, '');
            const e = evCat.trim().toUpperCase().replace(/\s+/g, '');
            if (a === e || e === "TERBUKA") return true;

            const parseCat = (cat) => {
                const jantina = cat.startsWith('L') ? 'L' : (cat.startsWith('P') ? 'P' : null);
                const umurMatch = cat.match(/\d+/);
                const umur = umurMatch ? parseInt(umurMatch[0]) : 99;
                return { jantina, umur };
            };

            const aParsed = parseCat(a); const eParsed = parseCat(e);
            if (aParsed.jantina && eParsed.jantina && aParsed.jantina !== eParsed.jantina) return false;
            if (e.includes("TKB") || e.includes("BAWAH") || e.includes("B") || e.includes("U")) {
                if (aParsed.umur <= eParsed.umur) return true;
            }
            return aParsed.umur === eParsed.umur;
        };

        const App = () => {
            const [lang, setLang] = useState("BM");
            const [userRole, setUserRole] = useState("pelawat");
            const [currentUser, setCurrentUser] = useState(null);
            const [isCloudActive, setIsCloudActive] = useState(false);
            const [activeTab, setActiveTab] = useState("dashboard"); // Tab order: 1, 2, 3(Acara), 4(Atlit), 5, 6
            
            const [athletes, setAthletes] = useState([]);
            const [events, setEvents] = useState([]);
            const [results, setResults] = useState([]);
            const [heats, setHeats] = useState([]);
            const [housesMetadata, setHousesMetadata] = useState(INITIAL_HOUSES);
            const [announcements, setAnnouncements] = useState([]);
            const [logs, setLogs] = useState([]);
            const [adminList, setAdminList] = useState([]);
            const [categories, setCategories] = useState(["L12TKB", "P12TKB", "L10TKB", "P10TKB", "Prasekolah", "Terbuka"]);

            const [activeYear, setActiveYear] = useState(() => localStorage.getItem('sps_active_year') || new Date().getFullYear().toString());
            const [maxIndividu, setMaxIndividu] = useState(() => parseInt(localStorage.getItem('sps_max_individu')) || 3);
            const [maxKumpulan, setMaxKumpulan] = useState(() => parseInt(localStorage.getItem('sps_max_kumpulan')) || 2);
            const [pointsConfig, setPointsConfig] = useState({ emas: 5, perak: 3, gangsa: 2, keempat: 1 });
            const [gasUrl, setGasUrl] = useState(localStorage.getItem('sps_custom_gas_url') || "");

            // UI States
            const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
            const [isAdminMenuOpen, setIsAdminMenuOpen] = useState(false);
            const [passcodeInput, setPasscodeInput] = useState("");
            const [showPointsModal, setShowPointsModal] = useState(false);
            const [showGasModal, setShowGasModal] = useState(false);
            const [showSchoolSetupModal, setShowSchoolSetupModal] = useState(false);
            const [gasModalTab, setGasModalTab] = useState("config");
            const [showSignatoryModal, setShowSignatoryModal] = useState(false);
            const [certSignatory1Name, setCertSignatory1Name] = useState(() => localStorage.getItem('sps_sig1_name') || "Cikgu Adnan Bin Haji Abdul Rahman");
            const [certSignatory1Title, setCertSignatory1Title] = useState(() => localStorage.getItem('sps_sig1_title') || "Guru Besar");

            // Form States
            const [athleteForm, setAthleteForm] = useState({ id: "", nama: "", kelas: "", rumah: "Merah", jantina: "Lelaki", kategori: "L12TKB" });
            const [isAddAthleteSidebarOpen, setIsAddAthleteSidebarOpen] = useState(false);
            const [isEditingAthlete, setIsEditingAthlete] = useState(false);
            const [regMode, setRegMode] = useState("tunggal");
            const [tsvInput, setTsvInput] = useState("");

            const [eventForm, setEventForm] = useState({ id: "", nama: "", kategori: "L12TKB", jenis: "Balapan", format: "Individu", tarikh: "", masa: "" });
            const [isEventSidebarOpen, setIsEventSidebarOpen] = useState(false);
            const [isEditingEvent, setIsEditingEvent] = useState(false);
            const [newCategoryName, setNewCategoryName] = useState("");

            const [houseForm, setHouseForm] = useState({ nama: "", slogan: "", guruPenasihat: "", bonusPoints: 0, warnaLabel: "Ungu" });
            const [isHouseSidebarOpen, setIsHouseSidebarOpen] = useState(false);
            const [isEditingHouse, setIsEditingHouse] = useState(false);
            const [originalHouseKey, setOriginalHouseKey] = useState("");
            const [newAdvisorText, setNewAdvisorText] = useState({});
            const [showMembersModal, setShowMembersModal] = useState(false);
            const [selectedMembersHouse, setSelectedMembersHouse] = useState("");
            const [membersSortType, setMembersSortType] = useState("nama");

            const [isAssignEventSidebarOpen, setIsAssignEventSidebarOpen] = useState(false);
            const [studentSearchQuery, setStudentSearchQuery] = useState("");
            const [selectedStudentId, setSelectedStudentId] = useState("");
            const [selectedEventIds, setSelectedEventIds] = useState([]);
            const [showSearchDropdown, setShowSearchDropdown] = useState(false);

            const [activeStageTab, setActiveStageTab] = useState("saringan");
            const [heatForm, setHeatForm] = useState({ eventId: "", athleteId: "", saringanNo: "1", catatan: "" });
            const [resultForm, setResultForm] = useState({ eventId: "", athleteId: "", kedudukan: "1", catatan: "" });

            const [announceFormText, setAnnounceFormText] = useState("");
            const [showAnnounceForm, setShowAnnounceForm] = useState(false);
            const [filterHouse, setFilterHouse] = useState("Semua");
            const [filterEvent, setFilterEvent] = useState("Semua");
            const [selectedEventDate, setSelectedEventDate] = useState("Semua");
            const [certSearchQuery, setCertSearchQuery] = useState("");
            
            const [previewContent, setPreviewContent] = useState("");
            const [isPreviewModalOpen, setIsPreviewModalOpen] = useState(false);
            const [toast, setToast] = useState({ show: false, message: "", type: "info" });
            const [confirmModal, setConfirmModal] = useState({ show: false, title: "", message: "", onConfirm: null });

            const adminMenuRef = useRef(null);
            const t = useMemo(() => translations[lang] || translations.BM, [lang]);
            
            const activeSchoolName = localStorage.getItem('sps_school_name') || DEFAULT_SCHOOL_NAME;
            const activeSchoolSubtitle = localStorage.getItem('sps_school_subtitle') || DEFAULT_SCHOOL_SUBTITLE;
            const logoUrl = localStorage.getItem('sps_school_logo') || DEFAULT_SCHOOL_LOGO;

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (adminMenuRef.current && !adminMenuRef.current.contains(event.target)) {
                        setIsAdminMenuOpen(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            useEffect(() => {
                if (!isCloudAvailable || !auth) { setIsCloudActive(false); return; }
                const unsubscribe = auth.onAuthStateChanged((user) => {
                    if (user) { setCurrentUser(user); setIsCloudActive(true); } 
                    else {
                        const cRole = localStorage.getItem('sps_local_role');
                        if (cRole) {
                            setCurrentUser({ displayName: localStorage.getItem('sps_local_name'), email: localStorage.getItem('sps_local_email') });
                            setUserRole(cRole); setIsCloudActive(true);
                        } else { setCurrentUser(null); setUserRole("pelawat"); }
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!isCloudActive || !db) return;
                const base = db.collection('artifacts').doc(appId).collection('public').doc('data');
                
                const unsubAth = base.collection('athletes').onSnapshot(snap => setAthletes(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubEv = base.collection('events').onSnapshot(snap => setEvents(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubRes = base.collection('results').onSnapshot(snap => setResults(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubHeat = base.collection('heats').onSnapshot(snap => setHeats(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubAnn = base.collection('announcements').onSnapshot(snap => {
                    const a = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    a.sort((x,y) => y.id.localeCompare(x.id)); setAnnouncements(a);
                });
                const unsubLog = base.collection('logs').onSnapshot(snap => {
                    const l = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    l.sort((x,y) => y.id.localeCompare(x.id)); setLogs(l);
                });
                const unsubMeta = base.collection('metadata').doc('houses').onSnapshot(doc => { if (doc.exists) setHousesMetadata(doc.data()); });
                const unsubConf = base.collection('metadata').doc('config').onSnapshot(doc => {
                    if (doc.exists) {
                        const d = doc.data();
                        if (d.categories) setCategories(d.categories);
                        if (d.maxIndividu) setMaxIndividu(d.maxIndividu);
                        if (d.maxKumpulan) setMaxKumpulan(d.maxKumpulan);
                    }
                });
                const unsubPts = base.collection('metadata').doc('points').onSnapshot(doc => { if(doc.exists) setPointsConfig(doc.data()); });

                return () => { unsubAth(); unsubEv(); unsubRes(); unsubHeat(); unsubAnn(); unsubLog(); unsubMeta(); unsubConf(); unsubPts(); };
            }, [isCloudActive]);

            useEffect(() => {
                if (!currentUser) return;
                const email = (currentUser.email || "").toLowerCase();
                if (email === "sekolah-7608@moe-dl.edu.my" || adminList.some(a => (a.email||"").toLowerCase() === email)) setUserRole("admin");
                else if (email.endsWith("@moe-dl.edu.my") || email.endsWith("@moe.edu.my")) setUserRole("guru");
                else if (!currentUser.isAnonymous) setUserRole("pelawat");
            }, [currentUser, adminList]);

            const showToastMessage = (message, type = "success") => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: "", type: "info" }), 4000);
            };

            const createLog = async (action, details) => {
                const logData = { id: "log_" + Date.now(), timestamp: new Date().toLocaleString('ms-MY'), userEmail: currentUser?.email || "Anonym", userName: currentUser?.displayName || "Pelawat", action, details };
                if (isCloudActive && db) await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('logs').doc(logData.id).set(logData);
                else setLogs(prev => [logData, ...prev]);
            };

            const checkAuth = () => {
                if (userRole === "pelawat") { showToastMessage("Akses Dihalang.", "error"); return false; } return true;
            };

            const houseStandings = useMemo(() => {
                const houses = {};
                Object.keys(housesMetadata).forEach(name => {
                    const meta = housesMetadata[name]; const preset = COLOR_PRESETS[meta.warnaLabel] || COLOR_PRESETS.Merah;
                    houses[name] = { emas: 0, perak: 0, gangsa: 0, keempat: 0, mata: parseInt(meta.bonusPoints)||0, warna: preset.warna, teks: preset.teks, glow: preset.glow, slogan: meta.slogan };
                });
                results.forEach(res => {
                    const ath = athletes.find(a => a.id === res.athleteId);
                    if (ath && houses[ath.rumah]) {
                        const h = houses[ath.rumah];
                        if (res.kedudukan === "1") { h.emas++; h.mata += pointsConfig.emas; }
                        else if (res.kedudukan === "2") { h.perak++; h.mata += pointsConfig.perak; }
                        else if (res.kedudukan === "3") { h.gangsa++; h.mata += pointsConfig.gangsa; }
                        else if (res.kedudukan === "4") { h.keempat++; h.mata += pointsConfig.keempat; }
                    }
                });
                return Object.entries(houses).map(([nama, data]) => ({ nama, ...data })).sort((a, b) => b.mata - a.mata);
            }, [results, athletes, pointsConfig, housesMetadata]);

            const eventsWithCode = useMemo(() => {
                const uniqueDates = Array.from(new Set(events.map(e => e.tarikh).filter(Boolean))).sort();
                return events.map((ev, idx) => {
                    const day = uniqueDates.indexOf(ev.tarikh) + 1 || 1;
                    return { ...ev, kodAcara: `${day}${String(idx+1).padStart(2,'0')}` };
                }).sort((a,b) => (a.tarikh||"").localeCompare(b.tarikh||"") || (a.masa||"").localeCompare(b.masa||""));
            }, [events]);

            const sortedCategories = [...categories].sort();
            const uniqueEventDates = Array.from(new Set(events.map(e => e.tarikh).filter(Boolean))).sort();

            const executeBypassPrint = (mode, targetData = null) => {
                let printContent = "";
                const headerHtml = `
                    <div style="text-align: center; border-bottom: 3px double #0f172a; padding-bottom: 15px; margin-bottom: 20px;">
                        <img src="${logoUrl}" style="height: 70px;" onerror="this.style.display='none'" />
                        <h2 style="margin: 5px 0 0 0; text-transform: uppercase;">${activeSchoolName}</h2>
                        <h3 style="margin: 3px 0 0 0; color: #475569;">${activeSchoolSubtitle} TAHUN ${activeYear}</h3>
                    </div>
                `;

                if (mode === 'semua_keputusan') {
                    const eventTables = eventsWithCode.map(ev => {
                        const evResults = results.filter(r => r.eventId === ev.id).sort((a,b) => parseInt(a.kedudukan) - parseInt(b.kedudukan));
                        if (evResults.length === 0) return '';
                        
                        const rows = evResults.map(res => {
                            const ath = athletes.find(a => a.id === res.athleteId);
                            const medal = res.kedudukan === "1" ? "EMAS" : res.kedudukan === "2" ? "PERAK" : res.kedudukan === "3" ? "GANGSA" : "KE-4";
                            return `
                                <tr>
                                    <td style="border: 1px solid #cbd5e1; padding: 6px; text-align: center; font-weight: bold;">${res.kedudukan}</td>
                                    <td style="border: 1px solid #cbd5e1; padding: 6px; font-weight: bold;">${medal}</td>
                                    <td style="border: 1px solid #cbd5e1; padding: 6px; text-transform: uppercase;">${ath ? ath.nama : "-"}</td>
                                    <td style="border: 1px solid #cbd5e1; padding: 6px; text-align: center;">Rumah ${ath ? ath.rumah : "-"}</td>
                                    <td style="border: 1px solid #cbd5e1; padding: 6px; text-align: center; font-family: monospace;">${res.catatan || "-"}</td>
                                </tr>
                            `;
                        }).join('');

                        return `
                            <div style="margin-bottom: 25px;">
                                <h4 style="margin: 0 0 8px 0; background: #f1f5f9; padding: 6px; border-left: 4px solid #1e40af; color: #1e3a8a; font-size: 13px;">
                                    [${ev.kodAcara}] ${ev.nama} - KATEGORI ${ev.kategori} (${ev.jenis})
                                </h4>
                                <table style="width: 100%; border-collapse: collapse; font-size: 11px;">
                                    <thead style="background: #e2e8f0;">
                                        <tr>
                                            <th style="border: 1px solid #cbd5e1; padding: 6px; width: 40px;">Ked.</th>
                                            <th style="border: 1px solid #cbd5e1; padding: 6px; width: 70px;">Pingat</th>
                                            <th style="border: 1px solid #cbd5e1; padding: 6px;">Nama Pemenang</th>
                                            <th style="border: 1px solid #cbd5e1; padding: 6px; width: 120px;">Rumah</th>
                                            <th style="border: 1px solid #cbd5e1; padding: 6px; width: 100px;">Catatan</th>
                                        </tr>
                                    </thead>
                                    <tbody>${rows}</tbody>
                                </table>
                            </div>
                        `;
                    }).join('');

                    printContent = `
                        <div style="font-family: sans-serif; padding: 20px; color: #1e293b;">
                            ${headerHtml}
                            <h2 style="text-align: center; margin-bottom: 25px; color: #b45309; text-transform: uppercase;">Keputusan Keseluruhan Semua Acara</h2>
                            ${eventTables || '<p style="text-align:center; color:#64748b;">Tiada keputusan direkodkan lagi.</p>'}
                        </div>
                    `;
                } else if (mode === 'kokum') {
                    const rows = houseStandings.map((h, i) => `
                        <tr>
                            <td style="border: 1px solid #cbd5e1; padding: 10px; font-weight: 700;">${i+1}</td>
                            <td style="border: 1px solid #cbd5e1; padding: 10px; font-weight: 700;">Rumah ${h.nama}</td>
                            <td style="border: 1px solid #cbd5e1; padding: 10px; text-align: center;">${h.emas}</td>
                            <td style="border: 1px solid #cbd5e1; padding: 10px; text-align: center;">${h.perak}</td>
                            <td style="border: 1px solid #cbd5e1; padding: 10px; text-align: center;">${h.gangsa}</td>
                            <td style="border: 1px solid #cbd5e1; padding: 10px; text-align: center;">${h.mata}</td>
                        </tr>
                    `).join('');
                    printContent = `
                        <div style="font-family: sans-serif; padding: 20px;">
                            ${headerHtml}
                            <h2 style="text-align: center; margin-bottom: 20px;">LAPORAN PUNGUTAN MATA RASMI</h2>
                            <table style="width: 100%; border-collapse: collapse; font-size: 12px;">
                                <thead style="background: #f1f5f9;">
                                    <tr>
                                        <th style="border: 1px solid #cbd5e1; padding: 10px;">Ked.</th>
                                        <th style="border: 1px solid #cbd5e1; padding: 10px;">Rumah Sukan</th>
                                        <th style="border: 1px solid #cbd5e1; padding: 10px;">Emas</th>
                                        <th style="border: 1px solid #cbd5e1; padding: 10px;">Perak</th>
                                        <th style="border: 1px solid #cbd5e1; padding: 10px;">Gangsa</th>
                                        <th style="border: 1px solid #cbd5e1; padding: 10px;">Jumlah Mata</th>
                                    </tr>
                                </thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>
                    `;
                } else if (mode === 'sijil') {
                    // Cetak Sijil Format
                    printContent = `
                        <div style="border: 12px double #1e3a8a; padding: 40px; text-align: center; font-family: 'Playfair Display', serif; min-height: 250mm; box-sizing: border-box; position: relative;">
                            <img src="${logoUrl}" style="height: 100px; margin-bottom: 20px;" />
                            <h1 style="font-size: 28px; font-weight: 800; color: #1e3a8a; margin: 0;">${activeSchoolName}</h1>
                            <div style="height: 2px; width: 120px; background: #fbbf24; margin: 25px auto;"></div>
                            <h2 style="font-size: 34px; font-weight: 700; color: #b45309;">SIJIL PENGHARGAAN</h2>
                            <p style="font-size: 16px; margin: 30px 0;">Dengan ini diperakui bahawa</p>
                            <h3 style="font-size: 26px; font-weight: bold; text-decoration: underline; margin: 10px 0;">${targetData.nama.toUpperCase()}</h3>
                            <p style="font-size: 14px; color: #334155; margin-bottom: 30px;">
                                Rumah: <strong>Rumah ${targetData.rumah}</strong> | Kelas: <strong>${targetData.kelas}</strong>
                            </p>
                            <p style="font-size: 18px; line-height: 1.6; max-width: 600px; margin: 0 auto 50px auto;">
                                Telah mempamerkan semangat kesukanan yang tinggi dan mengambil bahagian dengan cemerlang semasa ${activeSchoolSubtitle} Tahun ${activeYear}.
                            </p>
                            <div style="margin-top: 60px; font-family: sans-serif; font-size: 12px;">
                                <div style="border-bottom: 1px solid #000; width: 250px; margin: 0 auto;"></div>
                                <p style="margin: 8px 0 0 0; font-weight: bold;">${certSignatory1Name}</p>
                                <p style="margin: 0; color: #64748b;">${certSignatory1Title}</p>
                            </div>
                        </div>
                    `;
                }
                
                setPreviewContent(`
                    <!DOCTYPE html>
                    <html lang="ms">
                    <head><style>body{background:#fff; padding:15mm; font-family:sans-serif;} @media print{body{padding:0; margin:0;}}</style></head>
                    <body>${printContent}</body>
                    </html>
                `);
                setIsPreviewModalOpen(true);
            };

            const handleHouseSubmit = async (e) => {
                e.preventDefault(); if (!checkAuth()) return;
                const updated = { ...housesMetadata };
                const newObj = { slogan: houseForm.slogan, guruPenasihat: houseForm.guruPenasihat, bonusPoints: houseForm.bonusPoints, warnaLabel: houseForm.warnaLabel };
                if (isEditingHouse && originalHouseKey !== houseForm.nama) delete updated[originalHouseKey];
                updated[houseForm.nama] = newObj;
                
                if (isCloudActive && db) await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('metadata').doc('houses').set(updated);
                else setHousesMetadata(updated);
                
                setIsHouseSidebarOpen(false); showToastMessage("Rumah sukan disimpan!");
            };

            const handleEventSubmit = async (e) => {
                e.preventDefault(); if (!checkAuth()) return;
                const id = eventForm.id || "E_" + Date.now();
                const evData = { ...eventForm, id };
                if (isCloudActive && db) await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('events').doc(id).set(evData);
                else setEvents(prev => isEditingEvent ? prev.map(x => x.id === id ? evData : x) : [...prev, evData]);
                setIsEventSidebarOpen(false); showToastMessage("Acara disimpan!");
            };

            const handleAthleteSubmit = async (e) => {
                e.preventDefault(); if (!checkAuth()) return;
                const id = athleteForm.id || "A_" + Date.now();
                const athData = { ...athleteForm, id, nama: athleteForm.nama.toUpperCase() };
                if (isCloudActive && db) await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('athletes').doc(id).set(athData);
                else setAthletes(prev => isEditingAthlete ? prev.map(x => x.id === id ? athData : x) : [...prev, athData]);
                setIsAddAthleteSidebarOpen(false); showToastMessage("Atlet disimpan!");
            };

            const handleResultSubmit = async (e) => {
                e.preventDefault(); if (!checkAuth()) return;
                if (!resultForm.eventId || !resultForm.athleteId) return;
                const id = "R_" + Date.now();
                const resData = { ...resultForm, id };
                if (isCloudActive && db) await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('results').doc(id).set(resData);
                else setResults(prev => [...prev, resData]);
                setResultForm(prev => ({...prev, athleteId: "", catatan: ""})); showToastMessage("Keputusan disimpan!");
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    {/* Header */}
                    <header className="bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 text-white shadow-md relative z-50">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-4">
                                <img src={logoUrl} alt="Logo" className="w-14 h-14 object-contain rounded bg-white p-1" />
                                <div>
                                    <h1 className="text-xl font-extrabold tracking-tight">SiPS Online - {activeSchoolName}</h1>
                                    <p className="text-xs text-indigo-200 font-medium">{activeSchoolSubtitle} {activeYear} | {isCloudActive ? "🟢 Awan" : "🟡 Lokal"}</p>
                                </div>
                            </div>
                            <div className="flex flex-wrap items-center gap-2">
                                {userRole === "admin" && (
                                    <div className="relative inline-block" ref={adminMenuRef}>
                                        <button onClick={() => setIsAdminMenuOpen(!isAdminMenuOpen)} className="bg-yellow-500 hover:bg-yellow-600 text-slate-950 font-black px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5">🛠️ PANEL PENTADBIR</button>
                                        {isAdminMenuOpen && (
                                            <div className="absolute right-0 mt-2 w-64 bg-white rounded-2xl shadow-2xl border py-2 text-slate-800 z-[9999]">
                                                <button onClick={() => { setShowPointsModal(true); setIsAdminMenuOpen(false); }} className="w-full text-left px-4 py-2 hover:bg-slate-50 text-xs font-semibold">⚙️ Tetapan Kategori & Mata</button>
                                                <button onClick={() => { setShowSchoolSetupModal(true); setIsAdminMenuOpen(false); }} className="w-full text-left px-4 py-2 hover:bg-slate-50 text-xs font-semibold">🏫 Tetapan Sekolah Baharu</button>
                                            </div>
                                        )}
                                    </div>
                                )}
                                {currentUser && !currentUser.isAnonymous ? (
                                    <div className="flex items-center gap-2 bg-slate-800 p-1.5 pl-3 pr-2 rounded-xl text-xs">
                                        <div>
                                            <p className="font-bold text-white">{currentUser.displayName || "Pengguna"}</p>
                                            <p className="text-[9px] font-bold text-emerald-400 uppercase">{userRole}</p>
                                        </div>
                                        <button onClick={() => { auth?.signOut(); localStorage.clear(); window.location.reload(); }} className="text-red-400 hover:text-red-300 font-bold ml-2">Keluar</button>
                                    </div>
                                ) : (
                                    <button onClick={() => setIsLoginModalOpen(true)} className="bg-indigo-600 text-white px-3 py-1.5 rounded-xl font-bold text-xs">Log Masuk</button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* Navbar Tabs */}
                    <nav className="bg-white border-b sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-4 py-2 flex overflow-x-auto space-x-2">
                            {[
                                { id: "dashboard", label: t.dashboard },
                                { id: "rumah_sukan", label: t.rumah_sukan },
                                { id: "acara", label: t.acara },
                                { id: "atlit", label: t.atlit },
                                { id: "keputusan", label: t.keputusan },
                                { id: "pasca_sukan", label: t.pasca_sukan }
                            ].map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition ${activeTab === tab.id ? "bg-indigo-600 text-white shadow" : "text-slate-600 hover:bg-slate-100"}`}>
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                    </nav>

                    {/* Main Content Areas */}
                    <main className="max-w-7xl mx-auto p-4 w-full flex-grow">
                        
                        {/* TAB 1: Papan Pemuka */}
                        {activeTab === "dashboard" && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                    {houseStandings.map((h, i) => (
                                        <div key={h.nama} className={`bg-white border p-4 rounded-2xl relative overflow-hidden ${h.glow}`}>
                                            <div className={`absolute top-0 left-0 w-full h-1.5 ${h.warna}`}></div>
                                            <div className="flex justify-between">
                                                <div><span className="text-[10px] font-bold text-slate-400 uppercase">Ked. #{i+1}</span><h3 className="font-black text-lg">Rumah {h.nama}</h3></div>
                                                <span className={`text-2xl font-black ${h.teks}`}>{h.mata}</span>
                                            </div>
                                            <div className="grid grid-cols-4 gap-1 mt-4 text-center text-xs font-bold bg-slate-50 p-2 rounded-xl">
                                                <div>🥇 {h.emas}</div><div>🥈 {h.perak}</div><div>🥉 {h.gangsa}</div><div>🏅 {h.keempat}</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <div className="bg-white p-5 border rounded-2xl">
                                        <div className="flex justify-between items-center border-b pb-2 mb-3">
                                            <h3 className="font-bold">📢 Hebahan Semasa</h3>
                                            {userRole !== "pelawat" && <button onClick={() => setShowAnnounceForm(!showAnnounceForm)} className="text-xs bg-indigo-50 text-indigo-600 px-2 py-1 rounded font-bold">+ Hebahan</button>}
                                        </div>
                                        {showAnnounceForm && (
                                            <form onSubmit={(e) => {
                                                e.preventDefault();
                                                const ann = { id: "ann_"+Date.now(), text: announceFormText, date: new Date().toLocaleDateString('ms-MY'), author: currentUser?.displayName || "Pentadbir" };
                                                if (isCloudActive && db) db.collection('artifacts').doc(appId).collection('public').doc('data').collection('announcements').doc(ann.id).set(ann);
                                                else setAnnouncements([ann, ...announcements]);
                                                setAnnounceFormText(""); setShowAnnounceForm(false); showToastMessage("Hebahan ditambah");
                                            }} className="mb-4">
                                                <textarea required value={announceFormText} onChange={e => setAnnounceFormText(e.target.value)} className="w-full border rounded-xl p-2 text-xs" rows="2" placeholder="Tulis hebahan..."></textarea>
                                                <button type="submit" className="bg-indigo-600 text-white px-3 py-1 rounded-lg text-xs mt-2">Hantar</button>
                                            </form>
                                        )}
                                        <div className="space-y-3">
                                            {announcements.map(a => (
                                                <div key={a.id} className="bg-amber-50 p-3 rounded-xl text-xs border border-amber-100 flex justify-between">
                                                    <div><p className="font-medium">{a.text}</p><p className="text-[10px] text-slate-400 mt-1">Oleh: {a.author} | {a.date}</p></div>
                                                    {userRole !== "pelawat" && <button onClick={() => db.collection('artifacts').doc(appId).collection('public').doc('data').collection('announcements').doc(a.id).delete()} className="text-red-500 font-bold ml-2">✕</button>}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="bg-white p-5 border rounded-2xl h-[400px] flex flex-col">
                                        <h3 className="font-bold border-b pb-2 mb-3">📈 Log Aktiviti</h3>
                                        <div className="overflow-y-auto space-y-2 pr-2 text-xs">
                                            {logs.map(l => (
                                                <div key={l.id} className="p-2 bg-slate-50 rounded-lg border">
                                                    <div className="flex justify-between text-[10px] text-slate-400 font-bold mb-1"><span>{l.userName}</span><span>{l.timestamp}</span></div>
                                                    <p className="font-bold">{l.action}</p><p className="text-slate-500">{l.details}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: Rumah Sukan */}
                        {activeTab === "rumah_sukan" && (
                            <div className="space-y-6">
                                <div className="bg-white p-4 border rounded-2xl flex justify-between items-center shadow-sm">
                                    <div><h3 className="font-bold">Pengurusan Rumah Sukan</h3><p className="text-xs text-slate-400">Kelola slogan, guru penasihat, dan keahlian.</p></div>
                                    {userRole !== "pelawat" && <button onClick={() => { setHouseForm({nama:"", slogan:"", guruPenasihat:"", bonusPoints:0, warnaLabel:"Ungu"}); setIsEditingHouse(false); setIsHouseSidebarOpen(true); }} className="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow">+ Tambah Rumah</button>}
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {Object.entries(housesMetadata).map(([name, meta]) => {
                                        const preset = COLOR_PRESETS[meta.warnaLabel] || COLOR_PRESETS.Merah;
                                        const advisors = meta.guruPenasihat ? meta.guruPenasihat.split(',').filter(Boolean) : [];
                                        const hAthletes = athletes.filter(a => a.rumah === name);
                                        return (
                                            <div key={name} className="bg-white p-5 border rounded-2xl relative overflow-hidden">
                                                <div className={`absolute top-0 left-0 w-full h-2 ${preset.warna}`}></div>
                                                <div className="flex justify-between items-start mb-3">
                                                    <div><h4 className="text-xl font-black">Rumah {name}</h4><p className="text-xs text-indigo-600 font-bold italic">"{meta.slogan}"</p></div>
                                                    {userRole !== "pelawat" && <button onClick={() => { setHouseForm({nama:name, ...meta}); setOriginalHouseKey(name); setIsEditingHouse(true); setIsHouseSidebarOpen(true); }} className="bg-slate-100 px-2 py-1 rounded text-xs font-bold">Edit</button>}
                                                </div>
                                                <div className="bg-slate-50 p-3 rounded-xl border text-xs mb-3 space-y-2">
                                                    <p className="font-bold">Mata Bonus Perbarisan: {meta.bonusPoints}</p>
                                                    <div>
                                                        <p className="font-bold text-slate-400 uppercase text-[10px]">Guru Penasihat</p>
                                                        <div className="flex flex-wrap gap-1 mt-1">
                                                            {advisors.map(adv => (
                                                                <span key={adv} className="bg-white border px-2 py-1 rounded text-[11px] font-bold flex items-center gap-1">
                                                                    {adv} {userRole !== "pelawat" && <button onClick={() => {
                                                                        const updated = {...housesMetadata};
                                                                        updated[name].guruPenasihat = advisors.filter(a => a !== adv).join(',');
                                                                        if(isCloudActive&&db) db.collection('artifacts').doc(appId).collection('public').doc('data').collection('metadata').doc('houses').set(updated);
                                                                        else setHousesMetadata(updated);
                                                                    }} className="text-red-500 hover:text-red-700 ml-1">✕</button>}
                                                                </span>
                                                            ))}
                                                        </div>
                                                        {userRole !== "pelawat" && (
                                                            <div className="flex gap-1 mt-2">
                                                                <input type="text" value={newAdvisorText[name]||""} onChange={e => setNewAdvisorText({...newAdvisorText, [name]:e.target.value})} placeholder="Tambah guru..." className="flex-1 border p-1.5 rounded text-xs" />
                                                                <button onClick={() => {
                                                                    if(!newAdvisorText[name]) return;
                                                                    const updated = {...housesMetadata};
                                                                    const curr = updated[name].guruPenasihat ? updated[name].guruPenasihat.split(',') : [];
                                                                    curr.push(newAdvisorText[name]); updated[name].guruPenasihat = curr.join(',');
                                                                    if(isCloudActive&&db) db.collection('artifacts').doc(appId).collection('public').doc('data').collection('metadata').doc('houses').set(updated);
                                                                    else setHousesMetadata(updated);
                                                                    setNewAdvisorText({...newAdvisorText, [name]:""});
                                                                }} className="bg-slate-200 px-2 py-1 rounded font-bold text-xs">Tambah</button>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                                <button onClick={() => { setSelectedMembersHouse(name); setShowMembersModal(true); }} className="w-full bg-indigo-50 text-indigo-700 py-2 rounded-xl font-bold text-xs border border-indigo-100">👥 Kelola Ahli ({hAthletes.length})</button>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        )}

                        {/* TAB 3: Pengurusan Acara */}
                        {activeTab === "acara" && (
                            <div className="space-y-6">
                                <div className="bg-white p-4 border rounded-2xl flex justify-between items-center shadow-sm">
                                    <div><h3 className="font-bold">Pengurusan Acara Sukan</h3><p className="text-xs text-slate-400">Sistem mengesan kelayakan kategori secara pintar.</p></div>
                                    <div className="flex gap-2">
                                        <select value={selectedEventDate} onChange={e => setSelectedEventDate(e.target.value)} className="border p-2 rounded-xl text-xs font-bold">
                                            <option value="Semua">Semua Hari</option>
                                            {uniqueEventDates.map(d => <option key={d} value={d}>{d}</option>)}
                                        </select>
                                        {userRole !== "pelawat" && <button onClick={() => { setEventForm({ id:"", nama:"", kategori:categories[0], jenis:"Balapan", format:"Individu", tarikh:"", masa:"" }); setIsEditingEvent(false); setIsEventSidebarOpen(true); }} className="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow">+ Daftar Acara</button>}
                                    </div>
                                </div>
                                <div className="bg-white border rounded-2xl p-5 space-y-3">
                                    {eventsWithCode.filter(e => selectedEventDate === "Semua" || e.tarikh === selectedEventDate).map(ev => (
                                        <div key={ev.id} className="bg-slate-50 border p-3 rounded-xl flex justify-between items-center text-xs">
                                            <div className="flex gap-3 items-center">
                                                <span className="bg-indigo-600 text-white px-2 py-1 rounded font-mono font-bold">{ev.kodAcara}</span>
                                                <div><h4 className="font-extrabold uppercase">{ev.nama} {ev.kategori}</h4><span className="text-slate-500">{ev.jenis} • {ev.format}</span></div>
                                            </div>
                                            <div className="flex gap-3 items-center font-bold">
                                                <span className="text-slate-400">📅 {formatDateToDMY(ev.tarikh)} {ev.masa}</span>
                                                {userRole !== "pelawat" && (
                                                    <div className="flex gap-2">
                                                        <button onClick={() => { setEventForm(ev); setIsEditingEvent(true); setIsEventSidebarOpen(true); }} className="text-blue-600 bg-blue-50 px-2 py-1 rounded">Edit</button>
                                                        <button onClick={() => {
                                                            if(isCloudActive&&db) db.collection('artifacts').doc(appId).collection('public').doc('data').collection('events').doc(ev.id).delete();
                                                            else setEvents(events.filter(x => x.id !== ev.id));
                                                        }} className="text-red-600 bg-red-50 px-2 py-1 rounded">Padam</button>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TAB 4: Pengurusan Atlet */}
                        {activeTab === "atlit" && (
                            <div className="space-y-6">
                                <div className="bg-white p-4 border rounded-2xl flex justify-between items-center shadow-sm">
                                    <div><h3 className="font-bold">Pengurusan Atlet / Murid</h3><p className="text-xs text-slate-400">Daftar murid dan tetapkan penyertaan acara.</p></div>
                                    {userRole !== "pelawat" && (
                                        <div className="flex gap-2">
                                            <button onClick={() => { setAthleteForm({ id:"", nama:"", kelas:"", rumah:Object.keys(housesMetadata)[0], jantina:"Lelaki", kategori:categories[0] }); setIsEditingAthlete(false); setIsAddAthleteSidebarOpen(true); }} className="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow">+ Tambah Atlet</button>
                                            <button onClick={() => { setSelectedStudentId(""); setStudentSearchQuery(""); setSelectedEventIds([]); setIsAssignEventSidebarOpen(true); }} className="bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-bold shadow">⏱️ Tetapan Acara Murid</button>
                                        </div>
                                    )}
                                </div>
                                <div className="bg-white p-5 border rounded-2xl overflow-x-auto">
                                    <table className="w-full text-left text-xs">
                                        <thead className="bg-slate-50 border-b"><tr><th className="p-3">No</th><th className="p-3">Nama</th><th className="p-3">Kelas</th><th className="p-3">Kategori</th><th className="p-3">Rumah</th><th className="p-3">Acara Berdaftar</th>{userRole!=="pelawat"&&<th></th>}</tr></thead>
                                        <tbody>
                                            {athletes.map((ath, idx) => (
                                                <tr key={ath.id} className="border-b font-semibold hover:bg-slate-50">
                                                    <td className="p-3">{idx+1}</td>
                                                    <td className="p-3 uppercase">{ath.nama}</td><td className="p-3">{ath.kelas}</td><td className="p-3 text-indigo-600">{ath.kategori}</td><td className="p-3">{ath.rumah}</td>
                                                    <td className="p-3">
                                                        <div className="flex flex-wrap gap-1">
                                                            {ath.acaraIds && ath.acaraIds.length > 0 ? ath.acaraIds.map(id => {
                                                                const ev = events.find(e => e.id === id); return ev ? <span key={id} className="bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded text-[10px] border">{ev.nama}</span> : null;
                                                            }) : <span className="text-slate-400 italic">Tiada Acara</span>}
                                                        </div>
                                                    </td>
                                                    {userRole !== "pelawat" && (
                                                        <td className="p-3 text-right">
                                                            <button onClick={() => { setAthleteForm(ath); setIsEditingAthlete(true); setIsAddAthleteSidebarOpen(true); }} className="text-blue-600 mr-3">✏️</button>
                                                            <button onClick={() => {
                                                                if(isCloudActive&&db) db.collection('artifacts').doc(appId).collection('public').doc('data').collection('athletes').doc(ath.id).delete();
                                                                else setAthletes(athletes.filter(x => x.id !== ath.id));
                                                            }} className="text-red-500">✕</button>
                                                        </td>
                                                    )}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* TAB 5: Keputusan Acara */}
                        {activeTab === "keputusan" && (
                            <div className="space-y-6">
                                <div className="bg-white p-5 border rounded-2xl flex flex-wrap justify-between items-end gap-4 shadow-sm">
                                    <div className="flex-1 min-w-[300px]">
                                        <label className="block text-xs font-bold text-slate-400 uppercase mb-2">Pilih Acara Kejohanan</label>
                                        <select value={resultForm.eventId} onChange={e => { setResultForm({...resultForm, eventId:e.target.value}); setHeatForm({...heatForm, eventId:e.target.value}); }} className="w-full border p-2.5 rounded-xl bg-white font-bold text-sm">
                                            <option value="">-- Sila Pilih Acara --</option>
                                            {eventsWithCode.map(ev => <option key={ev.id} value={ev.id}>[{ev.kodAcara}] {ev.nama} Kategori {ev.kategori}</option>)}
                                        </select>
                                    </div>
                                    <button onClick={() => executeBypassPrint('semua_keputusan')} className="bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-md hover:bg-indigo-700">🖨️ Cetak Semua Keputusan</button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {/* Kunci Keputusan Form */}
                                    <div className="bg-white border rounded-2xl p-5 shadow-sm space-y-4">
                                        <h3 className="font-bold border-b pb-2">🏅 Kunci Keputusan Pingat (Podium)</h3>
                                        {userRole === "pelawat" ? <p className="text-xs text-red-500 italic">Log masuk sebagai urus setia untuk mengunci keputusan.</p> : (
                                            <form onSubmit={handleResultSubmit} className="space-y-3 text-xs font-bold">

                                                    <option value="1">🥇 Johan (Emas)</option><option value="2">🥈 Naib Johan (Perak)</option>
                                                    <option value="3">🥉 Ketiga (Gangsa)</option><option value="4">🏅 Tempat Keempat</option>
                                                </select>
                                                <select required value={resultForm.athleteId} onChange={e => setResultForm({...resultForm, athleteId:e.target.value})} className="w-full border p-2 rounded-xl">
                                                    <option value="">-- Pilih Pemenang --</option>
                                                    {athletes.filter(a => a.acaraIds && a.acaraIds.includes(resultForm.eventId)).map(a => <option key={a.id} value={a.id}>{a.nama.toUpperCase()} (Rumah {a.rumah})</option>)}
                                                </select>
                                                <input type="text" value={resultForm.catatan} onChange={e => setResultForm({...resultForm, catatan:e.target.value})} placeholder="Catatan Rekod (Contoh: 10.5s atau 5.2m)" className="w-full border p-2 rounded-xl" />
                                                <button type="submit" disabled={!resultForm.eventId} className="w-full bg-slate-800 text-white py-2 rounded-xl disabled:bg-slate-300">Simpan Keputusan</button>
                                            </form>
                                        )}
                                    </div>

                                    {/* Senarai Keputusan Acara Terpilih */}
                                    <div className="bg-white border rounded-2xl p-5 shadow-sm">
                                        <h3 className="font-bold border-b pb-2 mb-3">Senarai Pemenang Acara Ini</h3>
                                        <div className="space-y-2 text-xs">
                                            {results.filter(r => r.eventId === resultForm.eventId).length === 0 ? <p className="text-slate-400 italic">Tiada pingat dikunci untuk acara ini.</p> : 
                                                results.filter(r => r.eventId === resultForm.eventId).sort((a,b)=>parseInt(a.kedudukan)-parseInt(b.kedudukan)).map(res => {
                                                    const ath = athletes.find(a => a.id === res.athleteId);
                                                    const med = res.kedudukan === "1" ? "🥇" : res.kedudukan === "2" ? "🥈" : res.kedudukan === "3" ? "🥉" : "🏅";
                                                    return (
                                                        <div key={res.id} className="bg-slate-50 p-2.5 rounded-lg border flex justify-between items-center font-bold">
                                                            <span>{med} Tempat Ke-{res.kedudukan}: {ath?ath.nama:"-"} ({ath?ath.rumah:"-"})</span>
                                                            <div className="flex gap-2">
                                                                <span className="font-mono bg-slate-200 px-2 py-0.5 rounded text-[10px]">{res.catatan||"N/A"}</span>
                                                                {userRole !== "pelawat" && <button onClick={() => {
                                                                    if(isCloudActive&&db) db.collection('artifacts').doc(appId).collection('public').doc('data').collection('results').doc(res.id).delete();
                                                                    else setResults(results.filter(x => x.id !== res.id));
                                                                }} className="text-red-500">✕</button>}
                                                            </div>
                                                        </div>
                                                    )
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 6: Pasca Sukan */}
                        {activeTab === "pasca_sukan" && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 border rounded-2xl shadow-sm flex flex-col sm:flex-row justify-between items-center gap-4">
                                    <div><h3 className="text-lg font-black text-slate-900">Modul Dokumentasi</h3><p className="text-xs text-slate-400">Jana laporan rumah sukan (Kokum) dan Sijil Penyertaan.</p></div>
                                    <div className="flex gap-2">
                                        {userRole === "admin" && <button onClick={() => setShowSignatoryModal(true)} className="bg-slate-800 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow">✍️ Penandatangan Sijil</button>}
                                        <button onClick={() => executeBypassPrint('kokum')} className="bg-indigo-600 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow">📊 Cetak Laporan Kokum</button>
                                    </div>
                                </div>

                                <div className="bg-white p-6 border rounded-2xl shadow-sm">
                                    <h3 className="font-bold mb-3 uppercase text-sm">📜 Penjana Sijil Pintar (Carian Atlet)</h3>
                                    <input type="text" placeholder="Cari nama atlet untuk cetak sijil..." value={certSearchQuery} onChange={e => setCertSearchQuery(e.target.value)} className="w-full border p-2 rounded-xl text-xs font-bold mb-4" />
                                    <div className="max-h-72 overflow-y-auto space-y-2">
                                        {athletes.filter(a => certSearchQuery && a.nama.toLowerCase().includes(certSearchQuery.toLowerCase())).map(ath => (
                                            <div key={ath.id} className="bg-slate-50 border p-3 rounded-xl flex justify-between items-center text-xs">
                                                <div><p className="font-extrabold uppercase">{ath.nama}</p><p className="text-[10px] text-slate-500">Rumah {ath.rumah} | Kelas {ath.kelas}</p></div>
                                                <button onClick={() => executeBypassPrint('sijil', ath)} className="bg-indigo-600 text-white px-3 py-1.5 rounded-lg font-bold">Cetak Sijil</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODALS & SIDEBARS */}
                    {/* Login Modal */}
                    {isLoginModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/75 z-[9999] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-sm p-6 space-y-4">
                                <h3 className="font-black text-center text-lg">Log Masuk Pentadbiran</h3>
                                <button onClick={() => { auth?.signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(()=>setIsLoginModalOpen(false)).catch(e=>showToastMessage(e.message,"error")); }} className="w-full border p-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-slate-50 text-xs">
                                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G" className="w-4 h-4"/> Log Masuk DELIMa
                                </button>
                                <div className="text-center text-[10px] text-slate-400 font-bold border-b pb-2">ATAU KOD LALUAN MANUAL</div>
                                <input type="password" value={passcodeInput} onChange={e => setPasscodeInput(e.target.value)} placeholder="Kod Laluan (ADMIN7608 / GURU7608)" className="w-full border p-3 rounded-xl text-center text-xs font-mono font-bold" />
                                <div className="flex gap-2">
                                    <button onClick={() => setIsLoginModalOpen(false)} className="flex-1 bg-slate-200 py-2 rounded-xl text-xs font-bold">Batal</button>
                                    <button onClick={() => {
                                        if(passcodeInput.trim() === "ADMIN7608") { localStorage.setItem('sps_local_role','admin'); setUserRole('admin'); setIsLoginModalOpen(false); showToastMessage("Berjaya Admin"); }
                                        else if(passcodeInput.trim() === "GURU7608") { localStorage.setItem('sps_local_role','guru'); setUserRole('guru'); setIsLoginModalOpen(false); showToastMessage("Berjaya Guru"); }
                                        else showToastMessage("Salah Kod","error");
                                    }} className="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold">Log Masuk</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* House Sidebar */}
                    {isHouseSidebarOpen && (
                        <div className="fixed inset-0 z-[9999] flex justify-end text-xs">
                            <div className="fixed inset-0 bg-slate-900/50" onClick={()=>setIsHouseSidebarOpen(false)}></div>
                            <div className="relative w-full max-w-md bg-white p-6 h-full flex flex-col space-y-4 shadow-2xl">
                                <h3 className="font-black text-sm uppercase">{isEditingHouse ? "Edit Rumah Sukan" : "Tambah Rumah Sukan"}</h3>
                                <form onSubmit={handleHouseSubmit} className="space-y-4 font-semibold">
                                    <div><label className="block mb-1">Nama Rumah</label><input required disabled={isEditingHouse} type="text" value={houseForm.nama} onChange={e=>setHouseForm({...houseForm, nama:e.target.value})} className="w-full border p-2 rounded-xl disabled:bg-slate-100 uppercase" /></div>
                                    <div><label className="block mb-1">Slogan</label><input required type="text" value={houseForm.slogan} onChange={e=>setHouseForm({...houseForm, slogan:e.target.value})} className="w-full border p-2 rounded-xl" /></div>
                                    <div><label className="block mb-1">Warna Label</label><select value={houseForm.warnaLabel} onChange={e=>setHouseForm({...houseForm, warnaLabel:e.target.value})} className="w-full border p-2 rounded-xl">{Object.keys(COLOR_PRESETS).map(k=><option key={k} value={k}>{k}</option>)}</select></div>
                                    <button type="submit" className="w-full bg-indigo-600 text-white py-2.5 rounded-xl shadow-md">Simpan Rumah Sukan</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Members Modal (Rumah Sukan) */}
                    {showMembersModal && (
                        <div className="fixed inset-0 bg-slate-900/60 z-[9999] flex items-center justify-center p-4 text-xs font-semibold">

                                <div className="bg-indigo-900 text-white p-4 flex justify-between items-center rounded-t-2xl">
                                    <h3 className="font-bold text-sm uppercase">Keahlian Rumah {selectedMembersHouse}</h3>
                                    <button onClick={()=>setShowMembersModal(false)} className="text-slate-300 hover:text-white">✕</button>
                                </div>
                                <div className="p-4 border-b bg-slate-50 flex gap-2 overflow-x-auto">
                                    <span className="py-1.5">Tambah Segera Ahli Baru ke Rumah Ini:</span>

                                        e.preventDefault(); const id = "A_"+Date.now();

                                        const ath = { id, nama: formEle.nama.value.toUpperCase(), kelas: formEle.kelas.value, rumah: selectedMembersHouse, jantina: formEle.jantina.value, kategori: formEle.kategori.value };
                                        if(isCloudActive&&db) db.collection('artifacts').doc(appId).collection('public').doc('data').collection('athletes').doc(id).set(ath);
                                        else setAthletes([...athletes, ath]);
                                        formEle.reset(); showToastMessage("Ahli ditambah ke " + selectedMembersHouse);
                                    }} className="flex flex-wrap gap-2 items-center flex-1">
                                        <input name="nama" required type="text" placeholder="Nama Penuh..." className="border p-1.5 rounded-lg flex-1 min-w-[150px] uppercase" />
                                        <input name="kelas" required type="text" placeholder="Kelas..." className="border p-1.5 rounded-lg w-20" />
                                        <select name="jantina" className="border p-1.5 rounded-lg"><option value="Lelaki">Lelaki</option><option value="Perempuan">Perem.</option></select>
                                        <select name="kategori" className="border p-1.5 rounded-lg">{categories.map(c=><option key={c} value={c}>{c}</option>)}</select>
                                        <button type="submit" className="bg-emerald-600 text-white px-3 py-1.5 rounded-lg">Tambah</button>
                                    </form>
                                </div>

                                    <table className="w-full text-left">

                                                        <button onClick={()=>{setAthleteForm(ath);setIsEditingAthlete(true);setIsAddAthleteSidebarOpen(true);setShowMembersModal(false);}} className="text-blue-600 mr-2">Edit</button>
