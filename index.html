        const parseTimeToSeconds = (str) => {
            if (!str) return Infinity;
            const cleaned = str.trim().toLowerCase();
            if (cleaned.includes(':')) {
                const parts = cleaned.split(':');
                const minutes = parseFloat(parts[0]) || 0;
                const seconds = parseFloat(parts[1]) || 0;
                return (minutes * 60) + seconds;
            }
            const numericStr = cleaned.replace(/[^\d.]/g, '');
            const seconds = parseFloat(numericStr);
            return isNaN(seconds) ? Infinity : seconds;
        };

        const shuffleWithSeed = (array, seedString) => {
            let seed = 0;
            for (let i = 0; i < seedString.length; i++) {
                seed += seedString.charCodeAt(i);
            }
            const random = () => {
                const x = Math.sin(seed++) * 10000;
                return x - Math.floor(x);
            };
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        };

            };
            return normalize(a) === normalize(e);

                    const idx = uniqueDates.indexOf(date);
                    return idx !== -1 ? idx + 1 : 1;
                };

                const groups = {};
                (events || []).forEach(e => {
                    const day = getDayNum(e.tarikh);
                    if (!groups[day]) groups[day] = [];
                    groups[day].push(e);
                });

                const eventCodeMap = {};
                Object.keys(groups).forEach(day => {
                    groups[day].sort((a, b) => {
                        const timeA = a.masa || "00:00";
                        const timeB = b.masa || "00:00";
                        if (timeA !== timeB) return timeA.localeCompare(timeB);
                        return a.nama.localeCompare(b.nama);

                    });
                });

                    kodAcara: eventCodeMap[ev.id] || "101"

                if (lines.length < 2) return [];
                
                const headers = lines[0].split('\t').map(h => h.trim().toLowerCase());
                const namaIdx = headers.indexOf('nama');
                const jantinaIdx = headers.indexOf('jantina');
                const kategoriIdx = headers.indexOf('kategori');
                const kelasIdx = headers.indexOf('kelas');
                const rumahIdx = headers.indexOf('rumah');

                if (namaIdx === -1 || jantinaIdx === -1 || kategoriIdx === -1 || kelasIdx === -1 || rumahIdx === -1) {
                    return { error: "Pengepala TSV tidak sah. Sila pastikan baris pertama mengandungi: Nama, Jantina, Kategori, Kelas, Rumah." };
                }

                const parsed = [];
                for (let i = 1; i < lines.length; i++) {
                    const row = lines[i].split('\t');
                    if (row.length < 5) continue;
                    
                    const rawNama = row[namaIdx]?.trim();
                    if (!rawNama) continue;

                    let jantina = "Lelaki";
                    const rawJantina = row[jantinaIdx]?.trim().toLowerCase();
                    if (rawJantina && (rawJantina.startsWith('p') || rawJantina.includes('perempuan'))) {
                        jantina = "Perempuan";
                    }

                    let kategori = row[kategoriIdx]?.trim().toUpperCase() || "L12";
                    let rumah = "Merah";
                    const rawRumah = row[rumahIdx]?.trim();
                    const matchedHouse = Object.keys(housesMetadata || INITIAL_HOUSES_METADATA).find(
                        h => h.toLowerCase() === rawRumah?.toLowerCase()
                    );
                    if (matchedHouse) rumah = matchedHouse;
                    const kelas = row[kelasIdx]?.trim() || "Tiada Kelas";

                    parsed.push({ nama: rawNama, kelas, rumah, jantina, kategori });
                }
                return parsed;
            };

                                    </div>
                                ) : (
                                    <button 
                                        onClick={() => setIsLoginModalOpen(true)} 
                                        className="px-3 py-1 text-xs bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded shadow transition"
                                    >
                                        Log Masuk Urus Setia
                                    </button>
                                )}
                            </div>
                        </div>

                        {}
                        <nav className="bg-slate-950 px-4 sm:px-6 lg:px-8 border-t border-slate-800/80 overflow-x-auto">
                            <div className="max-w-7xl mx-auto flex space-x-1 sm:space-x-4">
                                {Object.keys(t).filter(k => k !== 'announcement').map(key => (
                                    <button
                                        key={key}
                                        onClick={() => setActiveTab(key)}
                                        className={`px-3 py-2.5 text-xs font-medium whitespace-nowrap border-b-2 transition ${
                                            activeTab === key 
                                                ? "border-amber-400 text-amber-400 bg-slate-900/60" 
                                                : "border-transparent text-slate-400 hover:text-slate-200 hover:border-slate-700"
                                        }`}
                                    >
                                        {t[key]}
                                    </button>
                                ))}
                            </div>
                        </nav>
                    </header>

                    {}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
                        {/* Papan Pemuka */}
                        {activeTab === "dashboard" && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-r from-slate-900 via-slate-800 to-indigo-950 text-white rounded-2xl p-6 shadow-xl relative overflow-hidden">
                                    <div className="relative z-10">
                                        <span className="px-3 py-1 bg-amber-400/20 text-amber-300 border border-amber-400/30 rounded-full text-xs font-semibold uppercase tracking-wider">
                                            Status Terkini Kejohanan
                                        </span>
                                        <h2 className="text-2xl sm:text-3xl font-black mt-3 text-white">Carta Kedudukan Rumah Sukan</h2>
                                        <p className="text-slate-300 text-sm mt-1 max-w-2xl">
                                            Kedudukan rasmi berdasarkan kutipan pingat dan mata terkumpul untuk Kejohanan Sukan Tahunan {activeSchoolName}.
                                        </p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                    {houseStandings.map((house, idx) => (
                                        <div key={house.nama} className={`bg-white rounded-xl p-5 border border-slate-200 shadow-sm transition hover:shadow-md relative ${house.glow}`}>
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Kedudukan #{idx + 1}</span>
                                                    <h3 className={`text-xl font-black ${house.teks} mt-0.5`}>Rumah {house.nama}</h3>
                                                </div>
                                                <span className="text-2xl">{house.emoji}</span>
                                            </div>

                                            <div className="mt-4 pt-4 border-t border-slate-100 flex items-baseline justify-between">
                                                <span className="text-xs font-medium text-slate-500">Jumlah Mata</span>
                                                <span className="text-3xl font-black text-slate-900">{house.mata}</span>
                                            </div>

                                            <div className="grid grid-cols-3 gap-1 mt-3 pt-3 border-t border-slate-100 text-center text-xs">
                                                <div className="bg-amber-50 p-1.5 rounded border border-amber-100">
                                                    <span className="text-amber-700 block font-bold">🥇 {house.emas}</span>
                                                </div>
                                                <div className="bg-slate-100 p-1.5 rounded border border-slate-200">
                                                    <span className="text-slate-700 block font-bold">🥈 {house.perak}</span>
                                                </div>
                                                <div className="bg-orange-50 p-1.5 rounded border border-orange-100">
                                                    <span className="text-orange-700 block font-bold">🥉 {house.gangsa}</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {}
                        {activeTab !== "dashboard" && (
                            <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                                <h2 className="text-xl font-bold text-slate-900 mb-2">{t[activeTab]}</h2>
                                <p className="text-sm text-slate-500">Modul pengurusan sukan aktif.</p>
                            </div>
                        )}
                    </main>

                    {}
                    {toast.show && (
                        <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-2xl text-white font-medium text-sm transition transform translate-y-0 ${
                            toast.type === "error" ? "bg-red-600" : toast.type === "success" ? "bg-emerald-600" : "bg-slate-800"
                        }`}>
                            {toast.message}
                        </div>
                    )}

                    {confirmModal.show && (
                        <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                                <h3 className="text-lg font-bold text-slate-900">{confirmModal.title}</h3>
                                <p className="text-sm text-slate-600">{confirmModal.message}</p>
                                <div className="flex justify-end space-x-3 pt-2">
                                    <button 
                                        onClick={() => setConfirmModal({ show: false })} 
                                        className="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg transition"
                                    >
                                        Batal
                                    </button>
                                    <button 
                                        onClick={confirmModal.onConfirm} 
                                        className="px-4 py-2 text-xs font-semibold bg-red-600 hover:bg-red-500 text-white rounded-lg shadow transition"
                                    >
                                        Teruskan
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
