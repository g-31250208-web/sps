                                                                        {eligibleCat}
                                                                    </span>
                                                                </td>
                                                                <td className="py-3 px-4 text-right space-x-2">
                                                                    <button 
                                                                        onClick={() => {
                                                                            setAthleteForm(ath);
                                                                            setIsEditingAthlete(true);
                                                                            setIsAddAthleteSidebarOpen(true);
                                                                        }}
                                                                        className="text-indigo-600 hover:underline font-bold"
                                                                    >
                                                                        Sunting
                                                                    </button>
                                                                    <button 
                                                                        onClick={() => handleDeleteAthlete(ath.id, ath.nama)}
                                                                        className="text-rose-600 hover:underline font-bold"
                                                                    >
                                                                        Padam
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ========================================================= */}
                        {/* TAB 5: KEPUTUSAN & PINGAT */}
                        {/* ========================================================= */}
                        {activeTab === "keputusan_pingat" && (
                            <div className="space-y-6 animate-in fade-in duration-200">
                                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                                    <h2 className="font-black text-slate-900 text-lg">🏅 Penguncian Keputusan Acara & Pingat</h2>
                                    <p className="text-xs text-slate-500 font-semibold">Pilih acara dan tetapkan pemenang untuk memasukkan mata ke papan pemuka secara automatik.</p>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Pilih Acara Sukan:</label>
                                            <select 
                                                value={selectedEventId}
                                                onChange={(e) => setSelectedEventId(e.target.value)}
                                                className="w-full p-2.5 border rounded-xl text-xs font-bold focus:ring-2 focus:ring-indigo-500 bg-white"
                                            >
                                                {events.map(ev => (
                                                    <option key={ev.id} value={ev.id}>{ev.nama} ({ev.kategori}) - {ev.status}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 pt-4">
                                        <div className="p-4 bg-amber-50 border border-amber-200 rounded-2xl space-y-2">
                                            <label className="block text-xs font-black text-amber-800">🥇 Pingat Emas (7 Mata)</label>
                                            <select 
                                                value={resultForm.emas}
                                                onChange={(e) => setResultForm({ ...resultForm, emas: e.target.value })}
                                                className="w-full p-2 border rounded-xl text-xs font-bold bg-white"
                                            >
                                                <option value="">-- Pilih Rumah Sukan --</option>
                                                {Object.keys(housesMetadata).map(h => (
                                                    <option key={h} value={h}>Rumah {h}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div className="p-4 bg-slate-50 border border-slate-200 rounded-2xl space-y-2">
                                            <label className="block text-xs font-black text-slate-700">🥈 Pingat Perak (5 Mata)</label>
                                            <select 
                                                value={resultForm.perak}
                                                onChange={(e) => setResultForm({ ...resultForm, perak: e.target.value })}
                                                className="w-full p-2 border rounded-xl text-xs font-bold bg-white"
                                            >
                                                <option value="">-- Pilih Rumah Sukan --</option>
                                                {Object.keys(housesMetadata).map(h => (
                                                    <option key={h} value={h}>Rumah {h}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div className="p-4 bg-amber-50/40 border border-amber-300 rounded-2xl space-y-2">
                                            <label className="block text-xs font-black text-amber-900">🥉 Pingat Gangsa (3 Mata)</label>
                                            <select 
                                                value={resultForm.gangsa}
                                                onChange={(e) => setResultForm({ ...resultForm, gangsa: e.target.value })}
                                                className="w-full p-2 border rounded-xl text-xs font-bold bg-white"
                                            >
                                                <option value="">-- Pilih Rumah Sukan --</option>
                                                {Object.keys(housesMetadata).map(h => (
                                                    <option key={h} value={h}>Rumah {h}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div className="p-4 bg-indigo-50 border border-indigo-200 rounded-2xl space-y-2">
                                            <label className="block text-xs font-black text-indigo-800">4️⃣ Tempat Ke-4 (1 Mata)</label>
                                            <select 
                                                value={resultForm.keempat}
                                                onChange={(e) => setResultForm({ ...resultForm, keempat: e.target.value })}
                                                className="w-full p-2 border rounded-xl text-xs font-bold bg-white"
                                            >
                                                <option value="">-- Pilih Rumah Sukan --</option>
                                                {Object.keys(housesMetadata).map(h => (
                                                    <option key={h} value={h}>Rumah {h}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    <div className="pt-4 flex justify-end">
                                        <button 
                                            onClick={() => {
                                                if (!resultForm.emas) {
                                                    alert("Sila pilih sekurang-kurangnya Pemenang Pingat Emas.");
                                                    return;
                                                }
                                                const updated = { ...housesMetadata };
                                                if (resultForm.emas && updated[resultForm.emas]) {
                                                    updated[resultForm.emas].emas += 1;
                                                    updated[resultForm.emas].mata += 7;
                                                }
                                                if (resultForm.perak && updated[resultForm.perak]) {
                                                    updated[resultForm.perak].perak += 1;
                                                    updated[resultForm.perak].mata += 5;
                                                }
                                                if (resultForm.gangsa && updated[resultForm.gangsa]) {
                                                    updated[resultForm.gangsa].gangsa += 1;
                                                    updated[resultForm.gangsa].mata += 3;
                                                }
                                                if (resultForm.keempat && updated[resultForm.keempat]) {
                                                    updated[resultForm.keempat].keempat += 1;
                                                    updated[resultForm.keempat].mata += 1;
                                                }

                                                setHousesMetadata(updated);
                                                setEvents(events.map(e => e.id === selectedEventId ? { ...e, status: "Selesai" } : e));
                                                alert("Keputusan acara berjaya dikunci dan dikemaskini ke Papan Pemuka!");
                                                setResultForm({ emas: "", perak: "", gangsa: "", keempat: "" });
                                            }}
                                            className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xs rounded-xl shadow-md transition"
                                        >
                                            🔒 Kunci & Kemaskini Keputusan
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ========================================================= */}
                        {/* TAB 6: HEBAHAN */}
                        {/* ========================================================= */}
                        {activeTab === "hebahan" && (
                            <div className="space-y-6 animate-in fade-in duration-200">
                                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                                    <h2 className="font-black text-slate-900 text-lg">📢 Urus Hebahan Kejohanan</h2>
                                    <form onSubmit={handleSaveAnnouncement} className="space-y-3">
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                            <div className="sm:col-span-2">
                                                <label className="block text-xs font-bold text-slate-700 mb-1">Tajuk Hebahan</label>
                                                <input 
                                                    type="text" 
                                                    value={annForm.tajuk}
                                                    onChange={(e) => setAnnForm({ ...annForm, tajuk: e.target.value })}
                                                    placeholder="Contoh: Panggilan Acara 4x100m"
                                                    className="w-full p-2 border rounded-xl text-xs font-semibold"

                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-slate-700 mb-1">Jenis Hebahan</label>
                                                <select 
                                                    value={annForm.jenis}
                                                    onChange={(e) => setAnnForm({ ...annForm, jenis: e.target.value })}
                                                    className="w-full p-2 border rounded-xl text-xs font-semibold bg-white"
                                                >
                                                    <option value="Info">Info Biasa</option>
                                                    <option value="Penting">Penting / Segera</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Mesej Hebahan</label>
                                            <textarea 
                                                rows="2"
                                                value={annForm.mesej}
                                                onChange={(e) => setAnnForm({ ...annForm, mesej: e.target.value })}
                                                placeholder="Tulis maklumat hebahan di sini..."
                                                className="w-full p-2 border rounded-xl text-xs font-semibold"
                                            ></textarea>
                                        </div>
                                        <button type="submit" className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xs rounded-xl shadow-sm transition">
                                            + Hantar Hebahan
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODALS & SIDEBARS */}
                    {/* Modal Tambah Acara */}
                    {showEventModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-[9999] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 text-xs font-semibold space-y-4 shadow-xl">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="font-black text-slate-900 text-sm uppercase">
                                        {isEditingEvent ? "✏️ Sunting Acara Sukan" : "⏱️ Tambah Acara Sukan Baru"}
                                    </h3>
                                    <button onClick={() => setShowEventModal(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                                </div>
                                <form onSubmit={handleSaveEvent} className="space-y-3">
                                    <div>
                                        <label className="block text-slate-700 mb-1 font-bold">Nama Acara</label>
                                        <input 
                                            type="text" 
                                            value={eventForm.nama}
                                            onChange={(e) => setEventForm({ ...eventForm, nama: e.target.value })}
                                            placeholder="Contoh: 60m Pecut"
                                            className="w-full p-2 border rounded-xl font-bold text-xs"
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-slate-700 mb-1 font-bold">Kategori Umur</label>
                                            <select 
                                                value={eventForm.kategori}
                                                onChange={(e) => setEventForm({ ...eventForm, kategori: e.target.value })}
                                                className="w-full p-2 border rounded-xl font-bold text-xs bg-white"
                                            >
                                                {activeCategories.map(cat => (
                                                    <option key={cat.id} value={cat.kod}>
                                                        {cat.kod} - {cat.nama}
                                                    </option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-slate-700 mb-1 font-bold">Jenis Acara</label>
                                            <select 
                                                value={eventForm.jenis}
                                                onChange={(e) => setEventForm({ ...eventForm, jenis: e.target.value })}
                                                className="w-full p-2 border rounded-xl font-bold text-xs bg-white"
                                            >
                                                <option value="Balapan">Balapan</option>
                                                <option value="Padang">Padang</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-slate-700 mb-1 font-bold">Masa Dijadualkan</label>
                                            <input 
                                                type="text" 
                                                value={eventForm.masa}
                                                onChange={(e) => setEventForm({ ...eventForm, masa: e.target.value })}
                                                placeholder="08:30 AM"
                                                className="w-full p-2 border rounded-xl font-bold text-xs"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-slate-700 mb-1 font-bold">Status Acara</label>
                                            <select 
                                                value={eventForm.status}
                                                onChange={(e) => setEventForm({ ...eventForm, status: e.target.value })}
                                                className="w-full p-2 border rounded-xl font-bold text-xs bg-white"
                                            >
                                                <option value="Belum Mula">Belum Mula</option>
                                                <option value="Sedang Berlangsung">Sedang Berlangsung</option>
                                                <option value="Selesai">Selesai</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="flex justify-end space-x-2 pt-2 border-t">
                                        <button type="button" onClick={() => setShowEventModal(false)} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl font-bold">Batal</button>
                                        <button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold">Simpan Acara</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal Urus / Tambah / Sunting Kategori */}
                    {showCategoryModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-[9999] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 text-xs font-semibold space-y-4 shadow-xl">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="font-black text-slate-900 text-sm uppercase">
                                        {isEditingCategory ? "✏️ Sunting Kategori Sukan" : "🏷️ Tambah Kategori Sukan Baru"}
                                    </h3>
                                    <button onClick={() => setShowCategoryModal(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                                </div>
                                <form onSubmit={handleSaveCategory} className="space-y-3">
                                    <div>
                                        <label className="block text-slate-700 mb-1 font-bold">Kod Kategori (Contoh: L9, L9TKB, P12)</label>
                                        <input 
                                            type="text" 
                                            value={categoryForm.kod}
                                            onChange={(e) => setCategoryForm({ ...categoryForm, kod: e.target.value })}

                                            className="w-full p-2 border rounded-xl font-extrabold text-xs uppercase"
                                            required
                                        />
                                        <p className="text-[10px] text-indigo-600 mt-1">

                                    </div>
                                    <div>
                                        <label className="block text-slate-700 mb-1 font-bold">Nama Kategori</label>
                                        <input 
                                            type="text" 
                                            value={categoryForm.nama}
                                            onChange={(e) => setCategoryForm({ ...categoryForm, nama: e.target.value })}
                                            placeholder="Contoh: Lelaki 9 Tahun Ke Bawah"
                                            className="w-full p-2 border rounded-xl font-bold text-xs"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-slate-700 mb-1 font-bold">Peringkat Sekolah</label>
                                        <select 
                                            value={categoryForm.jenisSekolah}
                                            onChange={(e) => setCategoryForm({ ...categoryForm, jenisSekolah: e.target.value })}
                                            className="w-full p-2 border rounded-xl font-bold text-xs bg-white"
                                        >
                                            <option value="rendah">Sekolah Rendah</option>
                                            <option value="menengah">Sekolah Menengah</option>
                                            <option value="semua">Semua Peringkat</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-slate-700 mb-1 font-bold">Penerangan / Syarat Kelayakan Umur</label>
                                        <textarea 
                                            rows="2"
                                            value={categoryForm.penerangan}
                                            onChange={(e) => setCategoryForm({ ...categoryForm, penerangan: e.target.value })}
                                            placeholder="Contoh: Lelaki 9 Tahun Ke Bawah (murid 7, 8, dan 9 tahun boleh ikut)."
                                            className="w-full p-2 border rounded-xl font-semibold text-xs"
                                        ></textarea>
                                    </div>
                                    <div className="flex justify-end space-x-2 pt-2 border-t">
                                        <button type="button" onClick={() => setShowCategoryModal(false)} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl font-bold">Batal</button>
                                        <button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold">Simpan Kategori</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Sidebar / Modal Tambah/Sunting Atlet */}
                    {isAddAthleteSidebarOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-[9999] flex justify-end">
                            <div className="bg-white max-w-md w-full h-full p-6 text-xs font-semibold flex flex-col justify-between shadow-2xl animate-in slide-in-from-right duration-200">
                                <div className="space-y-4">
                                    <div className="flex justify-between items-center border-b pb-3">
                                        <h3 className="font-black text-slate-900 text-sm uppercase">
                                            {isEditingAthlete ? "✏️ Sunting Maklumat Atlet" : "🏃 Pendaftaran Atlet Baru"}
                                        </h3>
                                        <button onClick={() => setIsAddAthleteSidebarOpen(false)} className="text-slate-400 hover:text-slate-600 text-base">✕</button>
                                    </div>

                                    <form id="athleteForm" onSubmit={handleSaveAthlete} className="space-y-3">
                                        <div>
                                            <label className="block text-slate-700 mb-1 font-bold">Nombor Atlet / Bib (Boleh Kosong)</label>
                                            <input 
                                                type="text" 
                                                value={athleteForm.noAtlet}
                                                onChange={(e) => setAthleteForm({ ...athleteForm, noAtlet: e.target.value })}
                                                placeholder="Contoh: M01"
                                                className="w-full p-2 border rounded-xl font-mono text-xs uppercase"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-slate-700 mb-1 font-bold">Nama Penuh Murid</label>
                                            <input 
                                                type="text" 
                                                value={athleteForm.nama}
                                                onChange={(e) => setAthleteForm({ ...athleteForm, nama: e.target.value })}
                                                placeholder="MUHAMMAD AMIRUL BIN ROSLI"
                                                className="w-full p-2 border rounded-xl font-bold text-xs uppercase"
                                            />
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-slate-700 mb-1 font-bold">Kelas</label>
                                                <input 
                                                    type="text" 
                                                    value={athleteForm.kelas}
                                                    onChange={(e) => setAthleteForm({ ...athleteForm, kelas: e.target.value })}
                                                    placeholder="6 BESTARI / 3 CERDIK"
                                                    className="w-full p-2 border rounded-xl font-bold text-xs uppercase"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-slate-700 mb-1 font-bold">Rumah Sukan</label>
                                                <select 
                                                    value={athleteForm.rumah}
                                                    onChange={(e) => setAthleteForm({ ...athleteForm, rumah: e.target.value })}
                                                    className="w-full p-2 border rounded-xl font-bold text-xs bg-white"
                                                >
                                                    {Object.keys(housesMetadata).map(h => (
                                                        <option key={h} value={h}>Rumah {h}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-slate-700 mb-1 font-bold">Jantina</label>
                                                <select 
                                                    value={athleteForm.jantina}
                                                    onChange={(e) => setAthleteForm({ ...athleteForm, jantina: e.target.value })}
                                                    className="w-full p-2 border rounded-xl font-bold text-xs bg-white"
                                                >
                                                    <option value="Lelaki">Lelaki</option>
                                                    <option value="Perempuan">Perempuan</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-slate-700 mb-1 font-bold">Kategori Umur Murid</label>
                                                <select 
                                                    value={athleteForm.kategori}
                                                    onChange={(e) => setAthleteForm({ ...athleteForm, kategori: e.target.value })}
                                                    className="w-full p-2 border rounded-xl font-bold text-xs bg-white"
                                                >
                                                    {activeCategories.map(cat => (
                                                        <option key={cat.id} value={cat.kod}>
                                                            {cat.kod} - {cat.nama}
                                                        </option>
                                                    ))}
                                                </select>
                                            </div>
                                        </div>
                                        <div className="p-3 bg-purple-50 border border-purple-200 rounded-xl space-y-1">
                                            <p className="font-extrabold text-purple-900 text-[11px]">💡 Nota Kelayakan Acara:</p>
                                            <p className="text-[10px] text-purple-700">
                                                Murid berkategori <strong>{athleteForm.kategori}</strong> akan secara automatik layak sertai acara kategori <strong>{athleteForm.kategori}</strong> dan acara <strong>{athleteForm.kategori.endsWith("TKB") ? athleteForm.kategori : athleteForm.kategori + "TKB"}</strong>.
                                            </p>
                                        </div>
                                    </form>
                                </div>

                                <div className="pt-4 border-t flex justify-end space-x-2">
                                    <button type="button" onClick={() => setIsAddAthleteSidebarOpen(false)} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl font-bold">Batal</button>
                                    <button form="athleteForm" type="submit" className="px-5 py-2 bg-indigo-600 text-white rounded-xl font-bold shadow-md">Simpan Atlet</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Import Pukal (TSV) */}
                    {showBulkModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-[9999] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-xl w-full p-6 text-xs font-semibold space-y-4 shadow-2xl">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="font-black text-slate-900 text-sm uppercase">📥 Import Pukal Atlet (TSV / Excel)</h3>
                                    <button onClick={() => setShowBulkModal(false)} className="text-slate-400 hover:text-slate-600 text-base">✕</button>
                                </div>

                                <div className="space-y-3">
                                    <div>
                                        <label className="block text-slate-700 mb-1 font-bold">Pilih Rumah Sukan Sasaran:</label>
                                        <select 
                                            value={bulkHouse}
                                            onChange={(e) => setBulkHouse(e.target.value)}
                                            className="w-full p-2 border rounded-xl font-bold text-xs bg-white"
                                        >
                                            {Object.keys(housesMetadata).map(h => (
                                                <option key={h} value={h}>Rumah {h}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-1 text-[11px] font-mono">
                                        <div className="flex justify-between items-center">
                                            <span className="font-extrabold text-slate-700">Susunan Header Lajur Excel / TSV:</span>
                                            <button 
                                                onClick={() => {
                                                    const sample = "Bil.\tNo Atlet\tNama\tJantina\tKelas\tKategori\n1\tM01\tMUHAMMAD AMIRUL\tLelaki\t6 BESTARI\tL12\n2\tM09\tMUHAMMAD HARITH\tLelaki\t3 CERDIK\tL9";
                                                    setBulkTsvText(sample);
                                                }}
                                                className="text-[10px] text-indigo-600 hover:underline font-bold"
                                            >
                                                📋 Tampal Contoh Templat
                                            </button>
                                        </div>
                                        <p className="text-slate-500 font-bold">Bil. [Tab] No Atlet [Tab] Nama [Tab] Jantina [Tab] Kelas [Tab] Kategori</p>
                                    </div>

                                    <div>
                                        <label className="block text-slate-700 mb-1 font-bold">Tampal Data Dari Excel / Google Sheets Di Sini:</label>
                                        <textarea 
                                            rows="6"
                                            value={bulkTsvText}
                                            onChange={(e) => setBulkTsvText(e.target.value)}
                                            placeholder={"Bil.\tNo Atlet\tNama\tJantina\tKelas\tKategori\n1\tM01\tMUHAMMAD AMIRUL\tLelaki\t6 BESTARI\tL12"}
                                            className="w-full p-2.5 border rounded-xl font-mono text-xs"
                                        ></textarea>
                                    </div>
                                </div>

                                <div className="flex justify-end space-x-2 pt-2 border-t">
                                    <button onClick={() => setShowBulkModal(false)} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl font-bold">Batal</button>
                                    <button onClick={handleProcessBulkTsv} className="px-5 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-extrabold shadow-md">Proses & Import Pukal</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Tambah Rumah Sukan */}
                    {showAddHouseModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-[9999] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 text-xs font-semibold space-y-4 shadow-xl">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="font-black text-slate-900 text-sm uppercase">🚩 Tambah Rumah Sukan Baru</h3>
                                    <button onClick={() => setShowAddHouseModal(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                                </div>
                                <form onSubmit={handleSaveHouse} className="space-y-3">
                                    <div>
                                        <label className="block text-slate-700 mb-1 font-bold">Nama Rumah Sukan</label>
                                        <input 
                                            type="text" 
                                            value={houseForm.nama}
                                            onChange={(e) => setHouseForm({ ...houseForm, nama: e.target.value })}
                                            placeholder="Contoh: Rumah Merah (Marikh)"
                                            className="w-full p-2 border rounded-xl font-bold text-xs"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-slate-700 mb-1 font-bold">Tema Warna</label>
                                        <select 
                                            value={houseForm.warnaKey}
                                            onChange={(e) => setHouseForm({ ...houseForm, warnaKey: e.target.value })}
                                            className="w-full p-2 border rounded-xl font-bold text-xs bg-white"
                                        >
                                            <option value="Merah">🔴 Merah</option>
                                            <option value="Biru">🔵 Biru</option>
                                            <option value="Hijau">🟢 Hijau</option>
                                            <option value="Kuning">🟡 Kuning</option>
                                            <option value="Ungu">🟣 Ungu</option>
                                            <option value="Jingga">🟠 Jingga</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-slate-700 mb-1 font-bold">Slogan Rumah Sukan</label>
                                        <input 
                                            type="text" 
                                            value={houseForm.slogan}
                                            onChange={(e) => setHouseForm({ ...houseForm, slogan: e.target.value })}
                                            placeholder="Contoh: Pantang Menyerah!"
                                            className="w-full p-2 border rounded-xl font-bold text-xs"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-slate-700 mb-1 font-bold">Guru Penasihat Utama</label>
                                        <input 
                                            type="text" 
                                            value={houseForm.penasihat}
                                            onChange={(e) => setHouseForm({ ...houseForm, penasihat: e.target.value })}
                                            placeholder="Contoh: Cikgu Ahmad"
                                            className="w-full p-2 border rounded-xl font-bold text-xs"
                                        />
                                    </div>
                                    <div className="flex justify-end space-x-2 pt-2 border-t">
                                        <button type="button" onClick={() => setShowAddHouseModal(false)} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl font-bold">Batal</button>
                                        <button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded-xl font-bold">Simpan Rumah Sukan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal Edit Slogan */}
                    {showSloganModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-[9999] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-sm w-full p-5 text-xs font-semibold space-y-4 shadow-xl">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h3 className="font-black text-slate-900 text-sm uppercase">✏️ Edit Slogan Rumah Sukan</h3>
                                    <button onClick={() => setShowSloganModal(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                                </div>
                                <form onSubmit={handleSaveSlogan} className="space-y-3">
                                    <div>
                                        <label className="block text-slate-700 mb-1 font-bold">Slogan Baru:</label>
                                        <input 
                                            type="text" 
                                            value={sloganInput}
                                            onChange={(e) => setSloganInput(e.target.value)}
                                            placeholder="Contoh: Maju Jaya!"
                                            className="w-full p-2 border rounded-xl font-bold text-xs"
                                            required
                                        />
                                    </div>
                                    <div className="flex justify-end space-x-2 pt-2 border-t">
                                        <button type="button" onClick={() => setShowSloganModal(false)} className="px-3.5 py-1.5 bg-slate-100 text-slate-600 rounded-xl font-bold">Batal</button>
                                        <button type="submit" className="px-4 py-1.5 bg-indigo-600 text-white rounded-xl font-bold">Simpan Slogan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal Tambah / Edit Guru Pembimbing */}
                    {showTeacherModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-[9999] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-sm w-full p-5 text-xs font-semibold space-y-4 shadow-xl">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h3 className="font-black text-slate-900 text-sm uppercase">
                                        {teacherIndex !== null ? "✏️ Edit Guru Pembimbing" : "👨‍🏫 Tambah Guru Pembimbing"}
                                    </h3>
                                    <button onClick={() => setShowTeacherModal(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                                </div>
                                <form onSubmit={handleSaveTeacher} className="space-y-3">
                                    <div>
                                        <label className="block text-slate-700 mb-1 font-bold">Nama Guru Pembimbing:</label>
                                        <input 
                                            type="text" 
                                            value={teacherInput}
                                            onChange={(e) => setTeacherInput(e.target.value)}
                                            placeholder="Contoh: Cikgu Ahmad"
                                            className="w-full p-2 border rounded-xl font-bold text-xs"
                                            required
                                        />
                                    </div>
                                    <div className="flex justify-end space-x-2 pt-2 border-t">
                                        <button type="button" onClick={() => setShowTeacherModal(false)} className="px-3.5 py-1.5 bg-slate-100 text-slate-600 rounded-xl font-bold">Batal</button>
                                        <button type="submit" className="px-4 py-1.5 bg-indigo-600 text-white rounded-xl font-bold">Simpan Guru</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal Diagnostik Info */}
                    {showDiagModal && (
                        <div className="fixed inset-0 bg-slate-900/60 z-[9999] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full text-xs font-semibold space-y-3">
                                <h3 className="text-sm font-extrabold text-slate-900 uppercase">ℹ️ Maklumat Diagnostik Sistem</h3>
                                <div className="space-y-2 font-mono text-[10px] bg-slate-50 p-3 rounded-xl border">
                                    <p>SPS-SK App ID: {appId}</p>
                                    <p>Firebase Active Connection: {isCloudActive ? "CONNECTED" : "OFFLINE/LOCAL"}</p>
                                    <p>Active Firebase Project ID: {activeFirebaseConfig.projectId}</p>
                                    <p>Total Registered Athletes: {athletes.length}</p>
                                    <p>Total Configured Events: {events.length}</p>
                                    <p>Total Results Locked: {results.length}</p>
                                    <p>Integrasi Google GAS API: {gasUrl ? "AKTIF" : "TIADA"}</p>
                                </div>
                                <div className="flex justify-end font-bold">
                                    <button onClick={() => setShowDiagModal(false)} className="px-4 py-2 bg-slate-100 rounded-xl">Tutup</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Senarai Ahli Rumah Sukan */}
                    {showMembersModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-[9999] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-2xl w-full h-[80vh] flex flex-col overflow-hidden text-xs font-semibold">
                                <div className="bg-gradient-to-r from-blue-900 to-indigo-900 text-white px-6 py-4 flex justify-between items-center">
                                    <h3 className="text-sm font-black uppercase">👥 Senarai Ahli Rumah {selectedMembersHouse}</h3>
                                    <button onClick={() => setShowMembersModal(false)} className="text-slate-400 hover:text-white text-base">✕</button>
                                </div>
                                
                                <div className="p-4 border-b bg-slate-50 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                    <span className="text-slate-500">Jumlah Ahli: <strong>{sortedHouseMembers.length} Orang</strong></span>
                                    <div className="flex flex-wrap items-center gap-1.5">
                                        <span className="text-slate-400">Isih Mengikut:</span>
                                        <button 
                                            onClick={() => setMembersSortType("nama")} 
                                            className={`px-3 py-1.5 rounded-lg border font-bold transition ${membersSortType === "nama" ? "bg-indigo-600 text-white border-indigo-600" : "bg-white hover:bg-slate-100 text-slate-700"}`}
                                        >
                                            🔠 Nama (A-Z)
                                        </button>
                                        <button 
                                            onClick={() => setMembersSortType("kelas")} 
                                            className={`px-3 py-1.5 rounded-lg border font-bold transition ${membersSortType === "kelas" ? "bg-indigo-600 text-white border-indigo-600" : "bg-white hover:bg-slate-100 text-slate-700"}`}
                                        >
                                            🏫 Kelas (Pra-T6)
                                        </button>
                                        <button 
                                            onClick={() => setMembersSortType("jantina")} 
                                            className={`px-3 py-1.5 rounded-lg border font-bold transition ${membersSortType === "jantina" ? "bg-indigo-600 text-white border-indigo-600" : "bg-white hover:bg-slate-100 text-slate-700"}`}
                                        >
                                            🚻 Jantina (L ➔ P)
                                        </button>
                                    </div>
                                </div>

                                <div className="flex-grow overflow-y-auto p-4">
                                    {sortedHouseMembers.length === 0 ? (
                                        <p className="text-center text-slate-400 italic py-12">Tiada ahli berdaftar untuk rumah sukan ini.</p>
                                    ) : (
                                        <table className="w-full text-left">
                                            <thead>
                                                <tr className="border-b text-slate-400 uppercase text-[10px] tracking-wider">
                                                    <th className="py-2 w-10">Bil</th>
                                                    <th className="py-2 w-16">Bib</th>
                                                    <th className="py-2">Nama Penuh</th>
                                                    <th className="py-2">Kelas</th>
                                                    <th className="py-2">Jantina</th>
                                                    <th className="py-2">Kategori</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {sortedHouseMembers.map((ath, idx) => (
                                                    <tr key={ath.id} className="border-b last:border-0 hover:bg-slate-50 font-bold">
                                                        <td className="py-2 text-slate-500 font-mono">{idx + 1}</td>
                                                        <td className="py-2">
                                                            <span className="bg-slate-100 text-slate-700 px-1.5 py-0.5 rounded font-mono text-[10px]">
                                                                {ath.noAtlet || "-"}
                                                            </span>
                                                        </td>
                                                        <td className="py-2 text-slate-900 uppercase">{ath.nama}</td>
                                                        <td className="py-2 text-slate-600">{ath.kelas}</td>
                                                        <td className="py-2">
                                                            <span className={`px-2 py-0.5 rounded text-[10px] ${ath.jantina === "Lelaki" ? "bg-blue-100 text-blue-700" : "bg-pink-100 text-pink-700"}`}>
                                                                {ath.jantina}
                                                            </span>
                                                        </td>
                                                        <td className="py-2 text-indigo-600">{ath.kategori}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    )}
                                </div>

                                <div className="bg-slate-50 border-t px-6 py-3.5 flex justify-end">
                                    <button onClick={() => setShowMembersModal(false)} className="px-5 py-2 bg-slate-200 text-slate-700 font-bold rounded-xl hover:bg-slate-300 transition">Tutup</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />); 
    </script>
</body>
</html>
