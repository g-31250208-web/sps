        const App = () => {

            const [isAddAthleteSidebarOpen, setIsAddAthleteSidebarOpen] = useState(false);

            const [athleteForm, setAthleteForm] = useState({ id: "", noAtlet: "", nama: "", kelas: "", rumah: "Merah", jantina: "Lelaki", kategori: "L12TKB", acaraIds: [] });

            const [eventForm, setEventForm] = useState({ id: "", nama: "", kategori: "L12TKB", jenis: "Balapan", format: "Individu", tarikh: "", masa: "" });

            const [resultForm, setResultForm] = useState({ eventId: "", athleteId: "", kedudukan: "1", catatan: "" });

            const [isHouseModalOpen, setIsHouseModalOpen] = useState(false);

            const [houseForm, setHouseForm] = useState({

            });
            const [isAddTeacherModalOpen, setIsAddTeacherModalOpen] = useState(false);
            const [selectedTeacherHouse, setSelectedTeacherHouse] = useState("");
            const [newTeacherInput, setNewTeacherInput] = useState("");

            const [eventSchoolLevel, setEventSchoolLevel] = useState("rendah");

            const [showMembersModal, setShowMembersModal] = useState(false);
            const [selectedMembersHouse, setSelectedMembersHouse] = useState("");

            const [isBulkModalOpen, setIsBulkModalOpen] = useState(false);
            const [bulkTargetHouse, setBulkTargetHouse] = useState("");
            const [bulkTsvText, setBulkTsvText] = useState("");
            const [bulkParsedAthletes, setBulkParsedAthletes] = useState([]);

            const [toast, setToast] = useState({ show: false, message: "", type: "info" });
            const [confirmModal, setConfirmModal] = useState({ show: false, title: "", message: "", onConfirm: null });

            const t = useMemo(() => translations[lang] || translations.BM, [lang]);

            const showToastMessage = (message, type = "success") => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: "", type: "info" }), 4000);
            };

            const checkAuthority = () => {
                if (userRole === "admin" || userRole === "guru") return true;
                showToastMessage("Akses Terhad! Sila Log Masuk Pentadbir/Guru terlebih dahulu.", "error");
                setIsLoginModalOpen(true);
                return false;
            };

            const createLog = (action, details) => {
                const logData = {
                    id: "log_" + Date.now(),
                    timestamp: new Date().toLocaleString('ms-MY'),
                    userEmail: currentUser ? (currentUser.email || "sekolah-7608@moe-dl.edu.my") : "Pelawat",
                    action,
                    details
                };
                setLogs(prev => [logData, ...prev]);
            };

            const houseScores = useMemo(() => {
                const totals = {};
                Object.keys(housesMetadata).forEach(houseName => {
                    totals[houseName] = {
                        nama: houseName,
                        emas: 0,
                        perak: 0,
                        gangsa: 0,
                        keempat: 0,
                        mataAcara: 0,
                        bonusPoints: housesMetadata[houseName].bonusPoints || 0,
                        jumlahMata: housesMetadata[houseName].bonusPoints || 0
                    };
                });

                results.forEach(res => {
                    const athlete = athletes.find(a => a.id === res.athleteId);
                    if (athlete && totals[athlete.rumah]) {
                        if (res.kedudukan === "1") {
                            totals[athlete.rumah].emas += 1;
                            totals[athlete.rumah].mataAcara += pointsConfig.emas;
                        } else if (res.kedudukan === "2") {
                            totals[athlete.rumah].perak += 1;
                            totals[athlete.rumah].mataAcara += pointsConfig.perak;
                        } else if (res.kedudukan === "3") {
                            totals[athlete.rumah].gangsa += 1;
                            totals[athlete.rumah].mataAcara += pointsConfig.gangsa;
                        } else if (res.kedudukan === "4") {
                            totals[athlete.rumah].keempat += 1;
                            totals[athlete.rumah].mataAcara += pointsConfig.keempat;
                        }
                    }
                });

                Object.keys(totals).forEach(h => {
                    totals[h].jumlahMata = totals[h].mataAcara + totals[h].bonusPoints;
                });

                return Object.values(totals).sort((a, b) => b.jumlahMata - a.jumlahMata);
            }, [results, athletes, housesMetadata, pointsConfig]);

            const filteredResultsList = useMemo(() => {
                if (resultFilterEvent === "all") return results;
                return results.filter(r => r.eventId === resultFilterEvent);
            }, [results, resultFilterEvent]);

            const handleOpenAddHouse = () => {
                setHouseForm({
                    originalNama: "",
                    nama: "",
                    slogan: "",
                    guruPenasihat: "",
                    bonusPoints: 0,
                    warnaLabel: "Merah"
                });
                setIsEditingHouse(false);
                setIsHouseModalOpen(true);
            };

            const handleOpenEditHouse = (nama, meta) => {
                setHouseForm({
                    originalNama: nama,
                    nama: nama,
                    slogan: meta.slogan || "",
                    guruPenasihat: meta.guruPenasihat || "",
                    bonusPoints: meta.bonusPoints || 0,
                    warnaLabel: meta.warnaLabel || "Merah"
                });
                setIsEditingHouse(true);
                setIsHouseModalOpen(true);
            };

            const handleSaveHouse = (e) => {
                e.preventDefault();
                if (!checkAuthority()) return;
                const namaTrimmed = houseForm.nama.trim();
                if (!namaTrimmed) {
                    showToastMessage("Sila masukkan nama rumah sukan!", "error");
                    return;
                }

                const updatedHouses = { ...housesMetadata };

                if (isEditingHouse && houseForm.originalNama && houseForm.originalNama !== namaTrimmed) {
                    delete updatedHouses[houseForm.originalNama];
                    setAthletes(prev => prev.map(a => a.rumah === houseForm.originalNama ? { ...a, rumah: namaTrimmed } : a));
                }

                updatedHouses[namaTrimmed] = {
                    slogan: houseForm.slogan,
                    guruPenasihat: houseForm.guruPenasihat,
                    bonusPoints: parseInt(houseForm.bonusPoints) || 0,
                    warnaLabel: houseForm.warnaLabel
                };

                setHousesMetadata(updatedHouses);
                setIsHouseModalOpen(false);
                showToastMessage(isEditingHouse ? `Rumah ${namaTrimmed} dikemaskini!` : `Rumah ${namaTrimmed} berjaya ditambah!`);
                createLog(isEditingHouse ? "Kemaskini Rumah Sukan" : "Tambah Rumah Sukan", `Rumah ${namaTrimmed}`);
            };

            const handleDeleteHouse = (houseNama) => {
                if (!checkAuthority()) return;
                setConfirmModal({
                    show: true,
                    title: `Padam Rumah ${houseNama}`,
                    message: `Adakah anda pasti untuk memadam Rumah ${houseNama}?`,
                    onConfirm: () => {
                        const updatedHouses = { ...housesMetadata };
                        delete updatedHouses[houseNama];
                        setHousesMetadata(updatedHouses);
                        setConfirmModal({ show: false });
                        showToastMessage(`Rumah ${houseNama} telah dipadam.`);
                        createLog("Padam Rumah Sukan", `Rumah ${houseNama}`);
                    }
                });
            };

            const handleAddAthleteToHouse = (houseNama) => {
                setAthleteForm({
                    id: "",
                    noAtlet: "",
                    nama: "",
                    kelas: "",
                    rumah: houseNama,
                    jantina: "Lelaki",
                    kategori: "L12TKB",
                    acaraIds: []
                });
                setIsEditingAthlete(false);
                setIsAddAthleteSidebarOpen(true);
            };

            const handleOpenAddTeacher = (houseNama) => {
                setSelectedTeacherHouse(houseNama);
                setNewTeacherInput("");
                setIsAddTeacherModalOpen(true);
            };

            const handleSaveNewTeacher = (e) => {
                e.preventDefault();
                if (!checkAuthority()) return;
                if (!newTeacherInput.trim()) return;

                const currentMeta = housesMetadata[selectedTeacherHouse] || {};
                const currentTeachers = currentMeta.guruPenasihat ? currentMeta.guruPenasihat.split(',').map(s => s.trim()) : [];
                currentTeachers.push(newTeacherInput.trim());

                setHousesMetadata({
                    ...housesMetadata,
                    [selectedTeacherHouse]: {
                        ...currentMeta,
                        guruPenasihat: currentTeachers.join(', ')
                    }
                });

                setIsAddTeacherModalOpen(false);
                showToastMessage(`Guru Penasihat ditambah ke Rumah ${selectedTeacherHouse}!`);
                createLog("Tambah Guru Penasihat", `Guru ${newTeacherInput} -> Rumah ${selectedTeacherHouse}`);
            };

            const handleParseTsv = (text, houseName) => {
                setBulkTsvText(text);
                if (!text || !text.trim()) {
                    setBulkParsedAthletes([]);
                    return;
                }

                const lines = text.trim().split(/\r?\n/);
                if (lines.length === 0) {
                    setBulkParsedAthletes([]);
                    return;
                }

                const firstLine = lines[0].toLowerCase();
                const hasHeader = firstLine.includes('nama') || firstLine.includes('bib') || firstLine.includes('kelas') || firstLine.includes('kategori');

                let startIndex = 0;
                let colIndices = { bil: -1, nama: -1, noAtlet: -1, kelas: -1, jantina: -1, kategori: -1 };

                if (hasHeader) {
                    startIndex = 1;
                    const headers = lines[0].split('\t').map(h => h.trim().toLowerCase());
                    headers.forEach((h, idx) => {
                        if (h.includes('bil')) colIndices.bil = idx;
                        else if (h.includes('nama')) colIndices.nama = idx;
                        else if (h.includes('bib') || h.includes('no atlet') || h.includes('no.')) colIndices.noAtlet = idx;
                        else if (h.includes('kelas')) colIndices.kelas = idx;
                        else if (h.includes('jantina')) colIndices.jantina = idx;
                        else if (h.includes('kategori')) colIndices.kategori = idx;
                    });
                }

                if (colIndices.nama === -1) colIndices.nama = 1;
                if (colIndices.noAtlet === -1) colIndices.noAtlet = 2;
                if (colIndices.kelas === -1) colIndices.kelas = 3;
                if (colIndices.jantina === -1) colIndices.jantina = 4;
                if (colIndices.kategori === -1) colIndices.kategori = 5;

                const parsed = [];
                for (let i = startIndex; i < lines.length; i++) {
                    const row = lines[i].split('\t').map(c => c.trim());
                    if (row.length === 0 || (row.length === 1 && row[0] === '')) continue;

                    const nama = row[colIndices.nama] || row[1] || row[0] || "";
                    if (!nama || nama.toLowerCase().startsWith('bil') || nama.toLowerCase() === 'nama') continue;

                    const noAtlet = row[colIndices.noAtlet] !== undefined ? row[colIndices.noAtlet] : (row[2] || "");
                    const kelas = row[colIndices.kelas] !== undefined ? row[colIndices.kelas] : (row[3] || "");
                    const jantinaRaw = row[colIndices.jantina] !== undefined ? row[colIndices.jantina] : (row[4] || "");
                    
                    let jantina = "Lelaki";
                    if (jantinaRaw.toLowerCase().startsWith('p') || jantinaRaw.toLowerCase().includes('perempuan')) {
                        jantina = "Perempuan";
                    }

                    const kategori = row[colIndices.kategori] !== undefined && row[colIndices.kategori] !== "" 
                        ? row[colIndices.kategori] 
                        : (jantina === "Perempuan" ? "P12TKB" : "L12TKB");

                    parsed.push({
                        id: "A_TSV_" + Date.now() + "_" + i,
                        noAtlet: noAtlet || `B${i}`,
                        nama: nama.toUpperCase(),
                        kelas: kelas || "6 Cemerlang",
                        rumah: houseName,
                        jantina,
                        kategori,
                        acaraIds: []
                    });
                }

                setBulkParsedAthletes(parsed);
            };

            const handleSaveBulkAthletes = (e) => {
                e.preventDefault();
                if (!checkAuthority()) return;

                if (bulkParsedAthletes.length === 0) {
                    showToastMessage("Tiada data atlet yang sah ditemui!", "error");
                    return;
                }

                setAthletes(prev => [...bulkParsedAthletes, ...prev]);
                showToastMessage(`Berjaya menambah ${bulkParsedAthletes.length} atlet ke Rumah ${bulkTargetHouse}!`);
                createLog("Tambah Atlet Pukal (TSV)", `${bulkParsedAthletes.length} atlet ke Rumah ${bulkTargetHouse}`);
                setIsBulkModalOpen(false);
                setBulkTsvText("");
                setBulkParsedAthletes([]);
            };

            const handleCopyTsvSample = () => {
                const sampleText = "bil.\tNama\tno bib\tkelas\tjantina\tkategori\n1\tMUHAMMAD AIMAN BIN ZULKIFLI\tM10\t6 CERDIK\tLelaki\tL12TKB\n2\tNUR AMIRA BINTI ROZALI\tM11\t3 TEKUN\tPerempuan\tP9TKB\n3\tCHONG TZE MING\tM12\t5 SAINS\tLelaki\tL15TKB";
                
                const textArea = document.createElement("textarea");
                textArea.value = sampleText;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToastMessage("Format contoh TSV telah disalin ke papan klip!");
                } catch (err) {
                    showToastMessage("Gagal menyalin contoh TSV.", "error");
                }
                document.body.removeChild(textArea);
            };

            const handleSaveAthlete = (e) => {
                e.preventDefault();
                if (!checkAuthority()) return;
                if (!athleteForm.nama.trim()) return;

                if (isEditingAthlete) {
                    setAthletes(prev => prev.map(a => a.id === athleteForm.id ? athleteForm : a));
                    showToastMessage(`Atlet ${athleteForm.nama} dikemaskini!`);
                } else {
                    const newAth = { ...athleteForm, id: "A" + Date.now() };
                    setAthletes(prev => [newAth, ...prev]);
                    showToastMessage(`Atlet ${athleteForm.nama} dimasukkan!`);
                }
                setIsAddAthleteSidebarOpen(false);
            };

            const handleDeleteAthlete = (id) => {
                if (!checkAuthority()) return;
                setConfirmModal({
                    show: true,
                    title: "Padam Atlet",
                    message: "Adakah anda pasti mahu memadam atlet ini?",
                    onConfirm: () => {
                        setAthletes(prev => prev.filter(a => a.id !== id));
                        setResults(prev => prev.filter(r => r.athleteId !== id));
                        setConfirmModal({ show: false });
                        showToastMessage("Atlet berjaya dipadam.");
                    }
                });
            };

            const handleSaveEvent = (e) => {
                e.preventDefault();
                if (!checkAuthority()) return;
                if (!eventForm.nama.trim()) return;

                if (isEditingEvent) {
                    setEvents(prev => prev.map(ev => ev.id === eventForm.id ? eventForm : ev));
                    showToastMessage(`Acara ${eventForm.nama} dikemaskini!`);
                } else {
                    const newEv = { ...eventForm, id: "E" + Date.now() };
                    setEvents(prev => [...prev, newEv]);
                    showToastMessage(`Acara ${eventForm.nama} ditambah!`);
                }
                setIsEventSidebarOpen(false);
            };

            const handleSaveResult = (e) => {
                e.preventDefault();
                if (!checkAuthority()) return;
                if (!resultForm.eventId || !resultForm.athleteId) {
                    showToastMessage("Sila pilih Acara dan Atlet!", "error");
                    return;
                }

                const existingIdx = results.findIndex(r => r.eventId === resultForm.eventId && r.kedudukan === resultForm.kedudukan);
                let updated = [...results];
                if (existingIdx >= 0) {
                    updated[existingIdx] = { ...resultForm, id: updated[existingIdx].id };
                } else {
                    updated.push({ ...resultForm, id: "R" + Date.now() });
                }
                setResults(updated);
                showToastMessage("Keputusan Acara Berjaya Direkodkan!");
            };

            const handleDeleteResult = (id) => {
                if (!checkAuthority()) return;
                setConfirmModal({
                    show: true,
                    title: "Padam Rekod Keputusan",
                    message: "Adakah anda pasti mahu memadam rekod keputusan acara ini?",
                    onConfirm: () => {
                        setResults(prev => prev.filter(r => r.id !== id));
                        setConfirmModal({ show: false });
                        showToastMessage("Keputusan berjaya dipadam.");
                    }
                });
            };

            const handleLoginSubmit = (e) => {
                e.preventDefault();
                if (loginEmail === "sekolah-7608@moe-dl.edu.my" || passcodeInput === "ADMIN7608" || passcodeInput === "admin") {
                    setUserRole("admin");
                    setCurrentUser({ email: "sekolah-7608@moe-dl.edu.my", displayName: "Pentadbir Utama SK Bikang" });
                    setIsLoginModalOpen(false);
                    showToastMessage("Log Masuk Sebagai Pentadbir Utama Berjaya!");
                } else if (passcodeInput === "guru") {
                    setUserRole("guru");
                    setCurrentUser({ email: "guru@skbikang.edu.my", displayName: "Guru Sukan" });
                    setIsLoginModalOpen(false);
                    showToastMessage("Log Masuk Sebagai Guru Berjaya!");
                } else {
                    showToastMessage("Kunci / Emel Akses Tidak Sah!", "error");
                }
            };

            const handleSyncGoogleSheets = async () => {
                if (!gasUrl) {
                    setShowGasGuideModal(true);
                    return;
                }
                setIsSyncingGas(true);
                try {
                    await fetch(gasUrl, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ athletes, events, results, housesMetadata })
                    });
                    showToastMessage("Penyegerakan Google Sheets Berjaya Dihantar!");
                } catch (err) {
                    showToastMessage("Gagal menyegerak ke Google Sheets", "error");
                } finally {
                    setIsSyncingGas(false);
                }
            };

            const isSecondaryCategory = (kat) => {
                return ["15", "18", "L15", "P15", "L18", "P18"].some(k => kat.includes(k));
            };

            const isPrimaryCategory = (kat) => {
                return ["9", "12", "L9", "P9", "L12", "P12"].some(k => kat.includes(k));
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header Bar */}
                    <header className="bg-slate-900 text-white shadow-lg sticky top-0 z-40 no-print">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <img src={DEFAULT_SCHOOL_LOGO} alt="School Logo" className="w-10 h-10 object-contain rounded-lg bg-white/10 p-1" />
                                <div>
                                    <h1 className="text-lg font-black tracking-wider font-serif-title text-amber-400">{DEFAULT_SCHOOL_NAME}</h1>
                                    <p className="text-[11px] text-slate-300 font-medium">{DEFAULT_SCHOOL_SUBTITLE}</p>
                                </div>
                            </div>

                            <div className="flex items-center space-x-2 sm:space-x-4">
                                <button 
                                    onClick={handleSyncGoogleSheets}
                                    disabled={isSyncingGas}
                                    className="hidden sm:flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow transition"
                                >
                                    <i className={`fa-solid fa-file-excel ${isSyncingGas ? 'fa-spin' : ''}`}></i>
                                    <span>{isSyncingGas ? 'Menyegerak...' : 'Segerak Google Sheet'}</span>
                                </button>

                                {userRole === "pelawat" ? (
                                    <button 
                                        onClick={() => setIsLoginModalOpen(true)}
                                        className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-1.5 rounded-xl transition shadow"
                                    >
                                        <i className="fa-solid fa-lock mr-1.5"></i> Log Masuk Admin
                                    </button>
                                ) : (
                                    <div className="flex items-center space-x-2">
                                        <span className="text-xs bg-indigo-500/20 text-indigo-300 border border-indigo-400/30 px-3 py-1 rounded-xl font-bold">
                                            {userRole === "admin" ? "🔑 Admin Utama" : "👨‍🏫 Guru"}
                                        </span>
                                        <button 
                                            onClick={() => { setUserRole("pelawat"); setCurrentUser(null); showToastMessage("Log keluar berjaya."); }}
                                            className="text-slate-400 hover:text-white p-1 text-sm"
                                            title="Log Keluar"
                                        >
                                            <i className="fa-solid fa-right-from-bracket"></i>
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Navigation Tabs */}
                        <nav className="bg-slate-800 border-t border-slate-700/50">
                            <div className="max-w-7xl mx-auto px-2 sm:px-6 flex overflow-x-auto space-x-1 sm:space-x-2 py-2 no-scrollbar">
                                {[
                                    { id: "dashboard", icon: "fa-chart-pie", label: t.dashboard },
                                    { id: "rumah_sukan", icon: "fa-flag", label: t.rumah_sukan },
                                    { id: "acara", icon: "fa-calendar-check", label: t.acara },
                                    { id: "atlit", icon: "fa-users", label: t.atlit },
                                    { id: "keputusan", icon: "fa-trophy", label: t.keputusan },
                                    { id: "pasca_sukan", icon: "fa-file-invoice", label: t.pasca_sukan }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition flex items-center gap-2 ${
                                            activeTab === tab.id 
                                                ? "bg-indigo-600 text-white shadow-md shadow-indigo-600/30" 
                                                : "text-slate-300 hover:bg-slate-700 hover:text-white"
                                        }`}
                                    >
                                        <i className={`fa-solid ${tab.icon}`}></i>
                                        <span>{tab.label}</span>
                                    </button>
                                ))}
                            </div>
                        </nav>
                    </header>

                    {/* Toast Notification */}
                    {toast.show && (
                        <div className={`fixed bottom-5 right-5 z-50 px-5 py-3 rounded-2xl shadow-2xl text-white font-bold text-xs flex items-center gap-2 transition-all transform animate-bounce no-print ${
                            toast.type === "error" ? "bg-red-600" : "bg-emerald-600"
                        }`}>
                            <i className={`fa-solid ${toast.type === "error" ? "fa-circle-exclamation" : "fa-circle-check"}`}></i>
                            <span>{toast.message}</span>
                        </div>
                    )}

                    {/* Main Container */}
                    <main className="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">

                        {/* TAB DASHBOARD */}
                        {activeTab === "dashboard" && (
                            <div className="space-y-6">
                                <div className="bg-white rounded-3xl p-6 shadow-xl border border-slate-200">
                                    <h2 className="text-xl font-black text-slate-900 tracking-tight mb-4 flex items-center gap-2">
                                        <i className="fa-solid fa-ranking-star text-amber-500"></i> Kedudukan Semasa Rumah Sukan
                                    </h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
                                        {houseScores.map((house, idx) => {
                                            const meta = housesMetadata[house.nama] || {};
                                            const preset = COLOR_PRESETS[meta.warnaLabel] || COLOR_PRESETS.Merah;
                                            return (
                                                <div key={house.nama} className={`rounded-3xl p-5 border-2 shadow-lg transition transform hover:-translate-y-1 ${preset.bg} ${preset.border}`}>
                                                    <div className="flex items-start justify-between">
                                                        <div className="flex items-center space-x-2">
                                                            <span className="text-3xl">{preset.emoji}</span>
                                                            <div>
                                                                <h3 className="font-extrabold text-slate-900 text-lg uppercase tracking-wider">{house.nama}</h3>
                                                                <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-white/80 text-slate-700 border">
                                                                    Kedudukan #{idx + 1}
                                                                </span>
                                                            </div>
                                                        </div>
                                                        <div className="text-right">
                                                            <div className="text-3xl font-black text-slate-900">{house.jumlahMata}</div>
                                                            <div className="text-[10px] font-bold text-slate-500 uppercase">Mata</div>
                                                        </div>
                                                    </div>
                                                    <div className="mt-4 pt-3 border-t border-slate-200/60 text-xs font-bold flex justify-between text-slate-600">
                                                        <span>🥇 {house.emas} | 🥈 {house.perak} | 🥉 {house.gangsa}</span>
                                                        <span className="text-amber-700">+{house.bonusPoints} Bonus</span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* Quick Stats & Announcements */}
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <div className="bg-gradient-to-br from-indigo-900 to-slate-900 text-white rounded-3xl p-6 shadow-xl space-y-4 lg:col-span-2 flex flex-col justify-between">
                                        <div>
                                            <span className="bg-indigo-500/30 text-indigo-300 border border-indigo-400/30 text-[10px] font-extrabold px-3 py-1 rounded-full uppercase tracking-wider">
                                                📢 Hebahan Kejohanan
                                            </span>
                                            <h3 className="text-2xl font-black font-serif-title text-amber-400 mt-2">
                                                Selamat Datang ke Portal Sukan SPS-SK
                                            </h3>
                                            <p className="text-slate-300 text-xs mt-2 leading-relaxed font-medium">
                                                Sistem Pengurusan Sukan Sekolah untuk memantau kedudukan rumah sukan, pendaftaran atlet, jadual acara, dan pendaftaran markah kejohanan secara 'real-time'.
                                            </p>
                                        </div>
                                        <div className="grid grid-cols-3 gap-3 text-center pt-4 border-t border-slate-800">
                                            <div className="bg-white/5 p-3 rounded-2xl">
                                                <div className="text-xl font-black text-amber-400">{athletes.length}</div>
                                                <div className="text-[10px] text-slate-400 font-bold uppercase">Jumlah Atlet</div>
                                            </div>
                                            <div className="bg-white/5 p-3 rounded-2xl">
                                                <div className="text-xl font-black text-emerald-400">{events.length}</div>
                                                <div className="text-[10px] text-slate-400 font-bold uppercase">Jumlah Acara</div>
                                            </div>
                                            <div className="bg-white/5 p-3 rounded-2xl">
                                                <div className="text-xl font-black text-cyan-400">{results.length}</div>
                                                <div className="text-[10px] text-slate-400 font-bold uppercase">Keputusan</div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Action Shortcuts */}
                                    <div className="bg-white rounded-3xl p-6 shadow-xl border border-slate-200 space-y-3 flex flex-col justify-between">
                                        <h3 className="text-sm font-black text-slate-900 uppercase tracking-wider flex items-center gap-2">
                                            <i className="fa-solid fa-bolt text-indigo-600"></i> Pautan Pantas
                                        </h3>
                                        <div className="space-y-2">
                                            <button 
                                                onClick={() => setActiveTab("keputusan")}
                                                className="w-full text-left p-3 rounded-2xl bg-slate-50 hover:bg-indigo-50 hover:text-indigo-700 transition font-bold text-xs flex items-center justify-between border border-slate-200/60"
                                            >
                                                <span className="flex items-center gap-2">
                                                    <i className="fa-solid fa-trophy text-amber-500"></i> Rekod Keputusan Acara
                                                </span>
                                                <i className="fa-solid fa-chevron-right text-slate-400 text-[10px]"></i>
                                            </button>
                                            <button 
                                                onClick={() => setActiveTab("atlit")}
                                                className="w-full text-left p-3 rounded-2xl bg-slate-50 hover:bg-indigo-50 hover:text-indigo-700 transition font-bold text-xs flex items-center justify-between border border-slate-200/60"
                                            >
                                                <span className="flex items-center gap-2">
                                                    <i className="fa-solid fa-user-plus text-indigo-500"></i> Pendaftaran Atlet
                                                </span>
                                                <i className="fa-solid fa-chevron-right text-slate-400 text-[10px]"></i>
                                            </button>
                                            <button 
                                                onClick={() => setActiveTab("pasca_sukan")}
                                                className="w-full text-left p-3 rounded-2xl bg-slate-50 hover:bg-indigo-50 hover:text-indigo-700 transition font-bold text-xs flex items-center justify-between border border-slate-200/60"
                                            >
                                                <span className="flex items-center gap-2">
                                                    <i className="fa-solid fa-file-invoice text-emerald-500"></i> Cetak Laporan Kejohanan
                                                </span>
                                                <i className="fa-solid fa-chevron-right text-slate-400 text-[10px]"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB RUMAH SUKAN */}
                        {activeTab === "rumah_sukan" && (
                            <div className="space-y-6">
                                <div className="bg-white rounded-3xl p-6 shadow-xl border border-slate-200 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                                    <div>
                                        <h2 className="text-xl font-black text-slate-900 tracking-tight flex items-center gap-2">
                                            <i className="fa-solid fa-flag text-indigo-600"></i> Pengurusan Rumah Sukan
                                        </h2>
                                        <p className="text-xs text-slate-500 font-medium mt-1">Urus Rumah Sukan, Guru Penasihat, Ahli Atlet, dan Mata Bonus</p>
                                    </div>
                                    
                                    <div className="flex flex-wrap items-center gap-2">
                                        <button 
                                            onClick={() => {
                                                const target = Object.keys(housesMetadata)[0] || "Merah";
                                                setBulkTargetHouse(target);
                                                setBulkTsvText("");
                                                setBulkParsedAthletes([]);
                                                setIsBulkModalOpen(true);
                                            }}
                                            className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow transition flex items-center gap-2"
                                        >
                                            <i className="fa-solid fa-file-import text-sm"></i> Tambah Ahli Pukal (TSV)
                                        </button>
                                        <button 
                                            onClick={handleOpenAddHouse}
                                            className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow transition flex items-center gap-2"
                                        >
                                            <i className="fa-solid fa-plus-circle text-sm"></i> Tambah Rumah Sukan
                                        </button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {Object.entries(housesMetadata).map(([nama, meta]) => {
                                        const preset = COLOR_PRESETS[meta.warnaLabel] || COLOR_PRESETS.Merah;
                                        const members = athletes.filter(a => a.rumah === nama);
                                        return (
                                            <div key={nama} className="bg-white rounded-3xl p-6 shadow-xl border border-slate-200 flex flex-col justify-between relative overflow-hidden transition hover:shadow-2xl">
                                                <div className="space-y-4">
                                                    <div className="flex items-start justify-between border-b pb-4">
                                                        <div className="flex items-center space-x-3">
                                                            <span className="text-4xl">{preset.emoji}</span>
                                                            <div>
                                                                <h3 className="text-xl font-black text-slate-900 uppercase tracking-wide">Rumah {nama}</h3>
                                                                <p className="text-xs text-slate-500 italic">"{meta.slogan || "Tiada Slogan"}"</p>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center space-x-1.5 bg-slate-100 p-1 rounded-xl">
                                                            <button 
                                                                onClick={() => handleOpenEditHouse(nama, meta)}
                                                                className="text-slate-600 hover:text-indigo-600 p-2 rounded-lg hover:bg-white transition text-xs font-bold"
                                                                title="Sunting Rumah Sukan"
                                                            >
                                                                <i className="fa-solid fa-pen-to-square"></i>
                                                            </button>
                                                            <button 
                                                                onClick={() => handleDeleteHouse(nama)}
                                                                className="text-slate-600 hover:text-red-600 p-2 rounded-lg hover:bg-white transition text-xs font-bold"
                                                                title="Padam Rumah Sukan"
                                                            >
                                                                <i className="fa-solid fa-trash"></i>
                                                            </button>
                                                        </div>
                                                    </div>

                                                    <div className="text-xs space-y-3 text-slate-600 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                                        <div className="flex items-start justify-between gap-2">
                                                            <div>
                                                                <p className="font-bold text-slate-800 mb-1 flex items-center gap-1.5">
                                                                    <i className="fa-solid fa-chalkboard-user text-indigo-600"></i> Guru Penasihat:
                                                                </p>
                                                                <p className="text-slate-600 font-medium pl-5">{meta.guruPenasihat || "Belum ditetapkan"}</p>
                                                            </div>
                                                            <button 
                                                                onClick={() => handleOpenAddTeacher(nama)}
                                                                className="text-[11px] bg-white border border-slate-200 hover:bg-indigo-50 hover:text-indigo-700 font-bold px-2.5 py-1 rounded-lg text-slate-700 shadow-sm transition whitespace-nowrap"
                                                            >
                                                                <i className="fa-solid fa-user-plus mr-1"></i> Tambah Guru
                                                            </button>
                                                        </div>

                                                        <div className="flex items-center justify-between pt-2 border-t border-slate-200/60">
                                                            <span className="font-bold text-slate-800">Mata Bonus Tambahan:</span>
                                                            <span className="font-extrabold text-amber-700 bg-amber-50 px-2.5 py-0.5 rounded-lg border border-amber-200">
                                                                +{meta.bonusPoints || 0} Mata
                                                            </span>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="pt-4 mt-4 border-t border-slate-100 grid grid-cols-1 sm:grid-cols-3 gap-2">
                                                    <button 
                                                        onClick={() => handleAddAthleteToHouse(nama)}
                                                        className="py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] font-bold rounded-xl transition flex items-center justify-center gap-1 shadow-sm"
                                                        title="Tambah Seorang Atlet"
                                                    >
                                                        <i className="fa-solid fa-user-plus"></i>
                                                        <span>Tambah</span>
                                                    </button>
                                                    <button 
                                                        onClick={() => {
                                                            setBulkTargetHouse(nama);
                                                            setBulkTsvText("");
                                                            setBulkParsedAthletes([]);
                                                            setIsBulkModalOpen(true);
                                                        }}
                                                        className="py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-bold rounded-xl transition flex items-center justify-center gap-1 shadow-sm"
                                                        title="Tambah Ahli Secara Pukal via TSV / Excel"
                                                    >
                                                        <i className="fa-solid fa-file-import"></i>
                                                        <span>Pukal (TSV)</span>
                                                    </button>
                                                    <button 
                                                        onClick={() => {
                                                            setSelectedMembersHouse(nama);
                                                            setShowMembersModal(true);
                                                        }}
                                                        className="py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-[11px] font-bold rounded-xl transition flex items-center justify-center gap-1"
                                                    >
                                                        <i className="fa-solid fa-users"></i>
                                                        <span>Ahli ({members.length})</span>
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                        <div>

                                                value={eventForm.jenis}
                                                onChange={e => setEventForm({...eventForm, jenis: e.target.value})}
                                                className="w-full p-2.5 border border-slate-300 rounded-xl text-xs"

                                    <div>
                                        <label className="text-xs font-bold text-slate-700 block mb-1">Tarikh</label>
                                        <input 
                                            type="date" 
                                            value={eventForm.tarikh}

                                            className="w-full p-2.5 border border-slate-300 rounded-xl text-xs"

                                        />

                                        <label className="text-xs font-bold text-slate-700 block mb-1">No. Bib / Peserta</label>

                                            <select 
                                                value={athleteForm.rumah}

                                            >
                                                {Object.keys(housesMetadata).map(h => (
                                                    <option key={h} value={h}>{h}</option>
                                                ))}
                                            </select>
                                        </div>

                                            <label className="text-xs font-bold text-slate-700 block mb-1">Jantina</label>

                                                value={athleteForm.jantina}
                                                onChange={e => {
                                                    const newJantina = e.target.value;

                                                        defaultKat = "L" + athleteForm.kategori.slice(1);

                                                        defaultKat = "P" + athleteForm.kategori.slice(1);
                                                    }
                                                    setAthleteForm({...athleteForm, jantina: newJantina, kategori: defaultKat});

                                                className="w-full p-2.5 border border-slate-300 rounded-xl text-xs"
                                            >
                                                <option value="Lelaki">Lelaki</option>
                                                <option value="Perempuan">Perempuan</option>

                                                    <option value="P12TKB">P12TKB</option>

                                    <button 
                                        type="submit"
                                        className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow mt-4"
                                    >
                                        Simpan Atlet
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL LIHAT AHLI RUMAH */}
                    {showMembersModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-6 space-y-4 max-h-[80vh] flex flex-col">
                                <div className="flex items-center justify-between border-b pb-3">
                                    <h3 className="font-black text-slate-900 text-base">Senarai Ahli Atlet - Rumah {selectedMembersHouse}</h3>
                                    <button onClick={() => setShowMembersModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>
                                <div className="overflow-y-auto flex-grow divide-y text-xs">
                                    {athletes.filter(a => a.rumah === selectedMembersHouse).length === 0 ? (
                                        <p className="text-center text-slate-400 py-6">Tiada ahli didaftarkan lagi.</p>
                                    ) : (
                                        athletes.filter(a => a.rumah === selectedMembersHouse).map(m => (
                                            <div key={m.id} className="py-2.5 flex items-center justify-between">
                                                <div>
                                                    <p className="font-extrabold text-slate-800">{m.nama}</p>
                                                    <p className="text-[10px] text-slate-500">Bib: {m.noAtlet || "N/A"} | Kelas: {m.kelas} ({m.kategori})</p>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL CONFIRMATION */}
                    {confirmModal.show && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-5 text-center">
                                <h3 className="font-black text-slate-900 text-base mb-2">{confirmModal.title}</h3>
                                <p className="text-xs text-slate-500 mb-6">{confirmModal.message}</p>
                                <div className="flex justify-center space-x-3">
                                    <button onClick={() => setConfirmModal({ show: false })} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl">
                                        Batal
                                    </button>
                                    <button onClick={confirmModal.onConfirm} className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-xl">
                                        Teruskan
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
