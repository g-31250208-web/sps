<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pengurusan Sukan SPS-SK</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">
    <div id="root"></div>

    <script type="text/babel">
        const DEFAULT_HOUSES = {
            "Merah": { id: "h1", nama: "Rumah Merah (Marikh)", warna: "bg-red-600", textWarna: "text-red-600", borderWarna: "border-red-500", bgLight: "bg-red-50", slogan: "Pantang Menyerah!", penasihat: ["Cikgu Ahmad", "Cikgu Mariam"], emas: 3, perak: 2, gangsa: 1, keempat: 1, mata: 45 },
            "Biru": { id: "h2", nama: "Rumah Biru (Utarid)", warna: "bg-blue-600", textWarna: "text-blue-600", borderWarna: "border-blue-500", bgLight: "bg-blue-50", slogan: "Biru Juara!", penasihat: ["Cikgu Siti", "Cikgu Osman"], emas: 2, perak: 4, gangsa: 2, keempat: 0, mata: 42 },
            "Hijau": { id: "h3", nama: "Rumah Hijau (Zuhal)", warna: "bg-emerald-600", textWarna: "text-emerald-600", borderWarna: "border-emerald-500", bgLight: "bg-emerald-50", slogan: "Hijau Sentiasa Ke Hadapan!", penasihat: ["Cikgu Razak", "Cikgu Faridah"], emas: 2, perak: 1, gangsa: 3, keempat: 2, mata: 35 },
            "Kuning": { id: "h4", nama: "Rumah Kuning (Suria)", warna: "bg-amber-500", textWarna: "text-amber-500", borderWarna: "border-amber-500", bgLight: "bg-amber-50", slogan: "Sinar Kejayaan!", penasihat: ["Cikgu Halimah", "Cikgu Kamal"], emas: 1, perak: 2, gangsa: 2, keempat: 3, mata: 28 }
        };

        const INITIAL_EVENTS = [
            { id: "e1", nama: "100m Akhir", kategori: "L12", jenis: "Balapan", masa: "08:30 AM", status: "Selesai" },
            { id: "e2", nama: "100m Akhir", kategori: "P12", jenis: "Balapan", masa: "08:45 AM", status: "Selesai" },
            { id: "e3", nama: "Lompat Jauh", kategori: "L12TKB", jenis: "Padang", masa: "09:15 AM", status: "Sedang Berlangsung" },
            { id: "e4", nama: "80m Lari Berpagar", kategori: "L9TKB", jenis: "Balapan", masa: "09:45 AM", status: "Belum Mula" },
            { id: "e5", nama: "60m Pecut", kategori: "L9", jenis: "Balapan", masa: "10:15 AM", status: "Belum Mula" },
            { id: "e6", nama: "Lontar Peluru", kategori: "P12", jenis: "Padang", masa: "10:30 AM", status: "Belum Mula" }
        ];

        const INITIAL_ATHLETES = [
            { id: "a1", noAtlet: "M01", nama: "MUHAMMAD AMIRUL BIN ROSLI", kelas: "6 BESTARI", rumah: "Merah", jantina: "Lelaki", kategori: "L12" },
            { id: "a2", noAtlet: "M02", nama: "NUR AIMAN ARIFFIN", kelas: "5 CERDIK", rumah: "Merah", jantina: "Lelaki", kategori: "L12" },
            { id: "a3", noAtlet: "B01", nama: "DANISH HAIKAL BIN SYAMSUL", kelas: "6 BESTARI", rumah: "Biru", jantina: "Lelaki", kategori: "L12" },
            { id: "a4", noAtlet: "H01", nama: "NUR BALQIS QISTINA", kelas: "6 BIJAK", rumah: "Hijau", jantina: "Perempuan", kategori: "P12" },
            { id: "a5", noAtlet: "K01", nama: "SITI NURHALIZA BINTI ALIAS", kelas: "5 BIJAK", rumah: "Kuning", jantina: "Perempuan", kategori: "P12" },
            { id: "a6", noAtlet: "M09", nama: "MUHAMMAD HARITH (9 TAHUN)", kelas: "3 CERDIK", rumah: "Merah", jantina: "Lelaki", kategori: "L9" }
        ];

        const INITIAL_ANNOUNCEMENTS = [
            { id: "ann1", masa: "08:00 AM", tajuk: "Pendaftaran Kehadiran Atlet", mesej: "Semua ketua rumah sukan diminta menyemak pendaftaran atlet di khemah utama.", jenis: "Info" },
            { id: "ann2", masa: "08:30 AM", tajuk: "Acara 100m Bermula", mesej: "Panggilan pertama untuk peserta Acara 100m Akhir L12 dan P12.", jenis: "Penting" }
        ];

        // Helper Function for TKB Eligibility / Category Matching
        function isCategoryCompatible(selectedCat, eventCat) {
            if (!selectedCat || selectedCat === "Semua") return true;
            if (eventCat === selectedCat) return true;
            
            // If user selected L9, show events under L9 or L9TKB
            if (eventCat === selectedCat + "TKB") return true;

            // If user selected L9TKB, show events under L9 and L9TKB
            if (selectedCat.endsWith("TKB") && eventCat === selectedCat.replace("TKB", "")) return true;

            return false;
        }

        function App() {
            // Navigation State
            const [activeTab, setActiveTab] = React.useState("papan_pemuka");

            // School Type Toggle State ("rendah" or "menengah")
            const [schoolType, setSchoolType] = React.useState("rendah");

            // Dynamic Categories State
            const [categories, setCategories] = React.useState([
                { id: "c1", kod: "L12", nama: "Lelaki 12 Tahun", jenisSekolah: "rendah", penerangan: "Murid Lelaki 12 tahun sahaja" },
                { id: "c2", kod: "P12", nama: "Perempuan 12 Tahun", jenisSekolah: "rendah", penerangan: "Murid Perempuan 12 tahun sahaja" },
                { id: "c3", kod: "L12TKB", nama: "Lelaki 12 TKB", jenisSekolah: "rendah", penerangan: "Lelaki 12 Tahun Ke Bawah (Contoh: 10, 11, & 12 tahun boleh sertai)" },
                { id: "c4", kod: "P12TKB", nama: "Perempuan 12 TKB", jenisSekolah: "rendah", penerangan: "Perempuan 12 Tahun Ke Bawah (Contoh: 10, 11, & 12 tahun boleh sertai)" },
                { id: "c5", kod: "L10TKB", nama: "Lelaki 10 TKB", jenisSekolah: "rendah", penerangan: "Lelaki 10 Tahun Ke Bawah" },
                { id: "c6", kod: "P10TKB", nama: "Perempuan 10 TKB", jenisSekolah: "rendah", penerangan: "Perempuan 10 Tahun Ke Bawah" },
                { id: "c7", kod: "L9", nama: "Lelaki 9 Tahun", jenisSekolah: "rendah", penerangan: "Murid Lelaki berumur 9 tahun sahaja" },
                { id: "c8", kod: "P9", nama: "Perempuan 9 Tahun", jenisSekolah: "rendah", penerangan: "Murid Perempuan berumur 9 tahun sahaja" },
                { id: "c9", kod: "L9TKB", nama: "Lelaki 9 TKB", jenisSekolah: "rendah", penerangan: "Lelaki 9 Tahun Ke Bawah (Murid 7, 8, dan 9 tahun boleh ikut)" },
                { id: "c10", kod: "P9TKB", nama: "Perempuan 9 TKB", jenisSekolah: "rendah", penerangan: "Perempuan 9 Tahun Ke Bawah (Murid 7, 8, dan 9 tahun boleh ikut)" },
                { id: "c11", kod: "L18", nama: "Lelaki 18 Tahun", jenisSekolah: "menengah", penerangan: "Murid Lelaki 18 tahun sahaja" },
                { id: "c12", kod: "P18", nama: "Perempuan 18 Tahun", jenisSekolah: "menengah", penerangan: "Murid Perempuan 18 tahun sahaja" },
                { id: "c13", kod: "L15TKB", nama: "Lelaki 15 TKB", jenisSekolah: "menengah", penerangan: "Lelaki 15 Tahun Ke Bawah (Contoh: 13, 14, & 15 tahun boleh sertai)" },
                { id: "c14", kod: "P15TKB", nama: "Perempuan 15 TKB", jenisSekolah: "menengah", penerangan: "Perempuan 15 Tahun Ke Bawah (Contoh: 13, 14, & 15 tahun boleh sertai)" },
                { id: "c15", kod: "L18TKB", nama: "Lelaki 18 TKB", jenisSekolah: "menengah", penerangan: "Lelaki 18 Tahun Ke Bawah (Contoh: 16, 17, & 18 tahun boleh sertai)" },
                { id: "c16", kod: "P18TKB", nama: "Perempuan 18 TKB", jenisSekolah: "menengah", penerangan: "Perempuan 18 Tahun Ke Bawah (Contoh: 16, 17, & 18 tahun boleh sertai)" }
            ]);

            const [showCategoryModal, setShowCategoryModal] = React.useState(false);
            const [isEditingCategory, setIsEditingCategory] = React.useState(false);
            const [categoryForm, setCategoryForm] = React.useState({ id: "", kod: "", nama: "", jenisSekolah: "rendah", penerangan: "" });

            // Diagnostic & Config State
            const [appId] = React.useState("SPS-SK-2026-V2");
            const [isCloudActive] = React.useState(false);
            const [activeFirebaseConfig] = React.useState({ projectId: "sps-sk-demo-db" });
            const [gasUrl] = React.useState("");
            const [showDiagModal, setShowDiagModal] = React.useState(false);

            // House State
            const [housesMetadata, setHousesMetadata] = React.useState(DEFAULT_HOUSES);
            const [showAddHouseModal, setShowAddHouseModal] = React.useState(false);
            const [editingHouseKey, setEditingHouseKey] = React.useState(null);
            const [houseForm, setHouseForm] = React.useState({ nama: "", slogan: "", penasihat: "", warnaKey: "Merah" });

            // Slogan Edit Modal State
            const [showSloganModal, setShowSloganModal] = React.useState(false);
            const [sloganHouseKey, setSloganHouseKey] = React.useState("");
            const [sloganInput, setSloganInput] = React.useState("");

            // Teacher Modal State
            const [showTeacherModal, setShowTeacherModal] = React.useState(false);
            const [teacherHouseKey, setTeacherHouseKey] = React.useState("");
            const [teacherIndex, setTeacherIndex] = React.useState(null);
            const [teacherInput, setTeacherInput] = React.useState("");

            // Members Modal State
            const [showMembersModal, setShowMembersModal] = React.useState(false);
            const [selectedMembersHouse, setSelectedMembersHouse] = React.useState("Merah");
            const [membersSortType, setMembersSortType] = React.useState("nama");

            // Events State (Tab 3)
            const [events, setEvents] = React.useState(INITIAL_EVENTS);
            const [eventSearchTerm, setEventSearchTerm] = React.useState("");
            const [eventCategoryFilter, setEventCategoryFilter] = React.useState("Semua");
            const [includeTkbFilter, setIncludeTkbFilter] = React.useState(true); // Include TKB automatically
            const [showEventModal, setShowEventModal] = React.useState(false);
            const [isEditingEvent, setIsEditingEvent] = React.useState(false);
            const [eventForm, setEventForm] = React.useState({ id: "", nama: "", kategori: "L12", jenis: "Balapan", masa: "09:00 AM", status: "Belum Mula" });

            // Athletes State (Tab 4)
            const [athletes, setAthletes] = React.useState(INITIAL_ATHLETES);
            const [athleteSearchTerm, setAthleteSearchTerm] = React.useState("");
            const [isAddAthleteSidebarOpen, setIsAddAthleteSidebarOpen] = React.useState(false);
            const [isEditingAthlete, setIsEditingAthlete] = React.useState(false);
            const [athleteForm, setAthleteForm] = React.useState({ id: "", noAtlet: "", nama: "", kelas: "", rumah: "Merah", jantina: "Lelaki", kategori: "L12" });

            // Bulk Import TSV State
            const [showBulkModal, setShowBulkModal] = React.useState(false);
            const [bulkHouse, setBulkHouse] = React.useState("Merah");
            const [bulkTsvText, setBulkTsvText] = React.useState("");

            // Results State (Tab 5)
            const [results, setResults] = React.useState([]);
            const [selectedEventId, setSelectedEventId] = React.useState("e1");
            const [resultForm, setResultForm] = React.useState({ emas: "", perak: "", gangsa: "", keempat: "" });

            // Announcements State (Tab 6 & Dashboard)
            const [announcements, setAnnouncements] = React.useState(INITIAL_ANNOUNCEMENTS);
            const [annForm, setAnnForm] = React.useState({ tajuk: "", mesej: "", jenis: "Info" });

            const activeCategories = React.useMemo(() => {
                return categories.filter(c => c.jenisSekolah === schoolType || c.jenisSekolah === "semua");
            }, [categories, schoolType]);

            const handleSaveCategory = (e) => {
                e.preventDefault();
                if (!categoryForm.kod.trim()) {
                    alert("Sila masukkan kod kategori (e.g. L9, P9TKB).");
                    return;
                }
                const cleanKod = categoryForm.kod.trim().toUpperCase();
                let desc = categoryForm.penerangan.trim();
                if (!desc) {
                    if (cleanKod.includes("TKB")) {
                        const ageMatch = cleanKod.match(/\d+/);
                        const age = ageMatch ? ageMatch[0] : "";
                        const gender = cleanKod.startsWith("P") ? "Perempuan" : "Lelaki";
                        desc = `${gender} ${age} Tahun Ke Bawah (murid berumur sehinnga ${age} tahun Boleh ikut)`;
                    } else {
                        desc = `Kategori umur ${cleanKod}`;
                    }
                }

                if (isEditingCategory) {
                    setCategories(categories.map(c => c.id === categoryForm.id ? { ...categoryForm, kod: cleanKod, penerangan: desc } : c));
                } else {
                    const newCat = { ...categoryForm, id: "c_" + Date.now(), kod: cleanKod, penerangan: desc };
                    setCategories([...categories, newCat]);
                }
                setShowCategoryModal(false);
                setCategoryForm({ id: "", kod: "", nama: "", jenisSekolah: schoolType, penerangan: "" });
            };

            const handleDeleteCategory = (id, kod) => {
                if (window.confirm(`Adakah anda pasti mahu memadam kategori ${kod}?`)) {
                    setCategories(categories.filter(c => c.id !== id));
                }
            };

            const handleSaveEvent = (e) => {
                e.preventDefault();
                if (!eventForm.nama.trim()) {
                    alert("Sila masukkan nama acara.");
                    return;
                }
                if (isEditingEvent) {
                    setEvents(events.map(ev => ev.id === eventForm.id ? { ...eventForm } : ev));
                } else {
                    const newEv = { ...eventForm, id: "e_" + Date.now() };
                    setEvents([...events, newEv]);
                }
                setShowEventModal(false);
                setEventForm({ id: "", nama: "", kategori: "L12", jenis: "Balapan", masa: "09:00 AM", status: "Belum Mula" });
            };

            const handleDeleteEvent = (id, nama) => {
                if (window.confirm(`Padam acara ${nama}?`)) {
                    setEvents(events.filter(ev => ev.id !== id));
                }
            };

            const handleToggleEventStatus = (id) => {
                setEvents(events.map(ev => {
                    if (ev.id === id) {
                        const nextStatus = ev.status === "Belum Mula" ? "Sedang Berlangsung" : ev.status === "Sedang Berlangsung" ? "Selesai" : "Belum Mula";
                        return { ...ev, status: nextStatus };
                    }
                    return ev;
                }));
            };

            const handleSaveAthlete = (e) => {
                e.preventDefault();
                if (!athleteForm.nama.trim()) {
                    alert("Sila masukkan nama atlet.");
                    return;
                }
                if (isEditingAthlete) {
                    setAthletes(athletes.map(a => a.id === athleteForm.id ? { ...athleteForm } : a));
                } else {
                    const newAth = { ...athleteForm, id: "a_" + Date.now() };
                    setAthletes([...athletes, newAth]);
                }
                setIsAddAthleteSidebarOpen(false);
            };

            const handleDeleteAthlete = (id, nama) => {
                if (window.confirm(`Adakah anda pasti untuk memadam atlet ${nama}?`)) {
                    setAthletes(athletes.filter(a => a.id !== id));
                }
            };

            const handleProcessBulkTsv = () => {
                if (!bulkTsvText.trim()) {
                    alert("Sila tampal data TSV / Excel terlebih dahulu.");
                    return;
                }

                const lines = bulkTsvText.trim().split("\n");
                const parsed = [];

                lines.forEach((line, index) => {
                    if (!line.trim()) return;
                    const cols = line.split("\t").map(c => c.trim());
                    
                    const firstCol = cols[0] ? cols[0].toLowerCase() : "";
                    if (firstCol.includes("bil") || firstCol.includes("nama") || firstCol.includes("no")) {
                        return;
                    }

                    let noAtlet = "";
                    let nama = "";
                    let jantina = "Lelaki";
                    let kelas = "";
                    let kategori = "L12";

                    if (cols.length >= 6) {
                        noAtlet = cols[1] || "";
                        nama = cols[2] || "";
                        jantina = (cols[3] && cols[3].toLowerCase().startsWith("p")) ? "Perempuan" : "Lelaki";
                        kelas = cols[4] || "";
                        kategori = cols[5] || "L12";
                    } else if (cols.length >= 3) {
                        noAtlet = cols[1] || "";
                        nama = cols[2] || cols[1] || "";
                        if (cols[3]) kelas = cols[3];
                        if (cols[4]) kategori = cols[4];
                    }

                    if (nama) {
                        parsed.push({
                            id: "a_bulk_" + Date.now() + "_" + index,
                            noAtlet: noAtlet,
                            nama: nama.toUpperCase(),
                            kelas: kelas.toUpperCase() || "6 BESTARI",
                            rumah: bulkHouse,
                            jantina: jantina,
                            kategori: kategori || "L12"
                        });
                    }
                });

                if (parsed.length === 0) {
                    alert("Tiada data sah dijumpai. Pastikan format ditaip / ditampal dengan betul.");
                    return;
                }

                setAthletes([...athletes, ...parsed]);
                setBulkTsvText("");
                setShowBulkModal(false);
                alert(`Berjaya menambah ${parsed.length} atlet baru ke Rumah ${bulkHouse}!`);
            };

            const handleSaveHouse = (e) => {
                e.preventDefault();
                const key = houseForm.nama.split(" ")[0] || "Rumah";
                const colorMap = {
                    "Merah": { warna: "bg-red-600", textWarna: "text-red-600", borderWarna: "border-red-500", bgLight: "bg-red-50" },
                    "Biru": { warna: "bg-blue-600", textWarna: "text-blue-600", borderWarna: "border-blue-500", bgLight: "bg-blue-50" },
                    "Hijau": { warna: "bg-emerald-600", textWarna: "text-emerald-600", borderWarna: "border-emerald-500", bgLight: "bg-emerald-50" },
                    "Kuning": { warna: "bg-amber-500", textWarna: "text-amber-500", borderWarna: "border-amber-500", bgLight: "bg-amber-50" },
                    "Ungu": { warna: "bg-purple-600", textWarna: "text-purple-600", borderWarna: "border-purple-500", bgLight: "bg-purple-50" },
                    "Jingga": { warna: "bg-orange-600", textWarna: "text-orange-600", borderWarna: "border-orange-500", bgLight: "bg-orange-50" }
                };

                const styleObj = colorMap[houseForm.warnaKey] || colorMap["Merah"];

                const newHouse = {
                    id: editingHouseKey ? housesMetadata[editingHouseKey].id : "h_" + Date.now(),
                    nama: houseForm.nama,
                    slogan: houseForm.slogan || "Maju Jaya!",
                    penasihat: houseForm.penasihat ? [houseForm.penasihat] : ["Cikgu Penasihat"],
                    emas: editingHouseKey ? housesMetadata[editingHouseKey].emas : 0,
                    perak: editingHouseKey ? housesMetadata[editingHouseKey].perak : 0,
                    gangsa: editingHouseKey ? housesMetadata[editingHouseKey].gangsa : 0,
                    keempat: editingHouseKey ? housesMetadata[editingHouseKey].keempat : 0,
                    mata: editingHouseKey ? housesMetadata[editingHouseKey].mata : 0,
                    ...styleObj
                };

                setHousesMetadata({
                    ...housesMetadata,
                    [key]: newHouse
                });

                setShowAddHouseModal(false);
                setEditingHouseKey(null);
                setHouseForm({ nama: "", slogan: "", penasihat: "", warnaKey: "Merah" });
            };

            const handleSaveSlogan = (e) => {
                e.preventDefault();
                if (!sloganHouseKey || !housesMetadata[sloganHouseKey]) return;
                setHousesMetadata({
                    ...housesMetadata,
                    [sloganHouseKey]: {
                        ...housesMetadata[sloganHouseKey],
                        slogan: sloganInput
                    }
                });
                setShowSloganModal(false);
            };

            const handleSaveTeacher = (e) => {
                e.preventDefault();
                if (!teacherHouseKey || !housesMetadata[teacherHouseKey] || !teacherInput.trim()) return;
                
                const house = housesMetadata[teacherHouseKey];
                let currentTeachers = Array.isArray(house.penasihat) 
                    ? [...house.penasihat] 
                    : (house.penasihat ? [house.penasihat] : []);

                if (teacherIndex !== null && teacherIndex >= 0) {
                    currentTeachers[teacherIndex] = teacherInput.trim();
                } else {
                    currentTeachers.push(teacherInput.trim());
                }

                setHousesMetadata({
                    ...housesMetadata,
                    [teacherHouseKey]: {
                        ...house,
                        penasihat: currentTeachers
                    }
                });
                setShowTeacherModal(false);
                setTeacherInput("");
            };

            const handleDeleteTeacher = (houseKey, idxToDelete) => {
                if (!window.confirm("Padam guru pembimbing ini?")) return;
                const house = housesMetadata[houseKey];
                let currentTeachers = Array.isArray(house.penasihat) 
                    ? [...house.penasihat] 
                    : (house.penasihat ? [house.penasihat] : []);
                
                currentTeachers.splice(idxToDelete, 1);

                setHousesMetadata({
                    ...housesMetadata,
                    [houseKey]: {
                        ...house,
                        penasihat: currentTeachers
                    }
                });
            };

            const handleSaveAnnouncement = (e) => {
                e.preventDefault();
                if (!annForm.tajuk || !annForm.mesej) return;
                const newAnn = {
                    id: "ann_" + Date.now(),
                    masa: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    tajuk: annForm.tajuk,
                    mesej: annForm.mesej,
                    jenis: annForm.jenis
                };
                setAnnouncements([newAnn, ...announcements]);
                setAnnForm({ tajuk: "", mesej: "", jenis: "Info" });
            };

            const sortedHousesList = React.useMemo(() => {
                return Object.entries(housesMetadata)
                    .map(([key, data]) => ({ key, ...data }))
                    .sort((a, b) => {
                        if (b.emas !== a.emas) return b.emas - a.emas;
                        if (b.perak !== a.perak) return b.perak - a.perak;
                        if (b.gangsa !== a.gangsa) return b.gangsa - a.gangsa;
                        if (b.keempat !== a.keempat) return b.keempat - a.keempat;
                        return b.mata - a.mata;
                    });
            }, [housesMetadata]);

            const sortedHouseMembers = React.useMemo(() => {
                const members = athletes.filter(a => a.rumah.toLowerCase().includes(selectedMembersHouse.toLowerCase()) || selectedMembersHouse.toLowerCase().includes(a.rumah.toLowerCase()));
                return members.sort((a, b) => {
                    if (membersSortType === "kelas") return a.kelas.localeCompare(b.kelas);
                    if (membersSortType === "jantina") return a.jantina.localeCompare(b.jantina);
                    return a.nama.localeCompare(b.nama);
                });
            }, [athletes, selectedMembersHouse, membersSortType]);

            return (
                <div className="flex-grow flex flex-col min-h-screen">
                    {/* TOP HEADER */}
                    <header className="bg-slate-900 text-white shadow-md sticky top-0 z-40 border-b border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <div className="p-2 bg-indigo-600 rounded-xl font-black text-xl shadow-inner">🏆</div>
                                <div>
                                    <h1 className="font-black text-base sm:text-lg tracking-tight bg-gradient-to-r from-white via-slate-100 to-indigo-200 bg-clip-text text-transparent">SPS-SK Kejohanan Sukan Sekolah</h1>
                                    <p className="text-[10px] text-slate-400 font-medium">Sistem Pengurusan Kejohanan Balapan & Padang</p>
                                </div>
                            </div>
                            <div className="flex items-center space-x-2">
                                <button 
                                    onClick={() => setShowDiagModal(true)}
                                    className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs font-bold text-slate-300 transition flex items-center space-x-1"
                                >
                                    <span>⚙️ Diagnostik</span>
                                </button>
                            </div>
                        </div>

                        {/* NAVIGATION TABS */}
                        <nav className="bg-slate-800 border-t border-slate-700/60 overflow-x-auto scrollbar-none">
                            <div className="max-w-7xl mx-auto px-4 flex space-x-1 py-1">
                                {[
                                    { id: "papan_pemuka", label: "📊 Papan Pemuka" },
                                    { id: "rumah_sukan", label: "🚩 Rumah Sukan" },
                                    { id: "acara_sukan", label: "⏱️ Acara Sukan" },
                                    { id: "pengurusan_atlet", label: "🏃 Pengurusan Atlet" },
                                    { id: "keputusan_pingat", label: "🏅 Keputusan & Pingat" },
                                    { id: "hebahan", label: "📢 Hebahan" }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`px-4 py-2.5 rounded-xl font-extrabold text-xs whitespace-nowrap transition-all duration-150 ${
                                            activeTab === tab.id 
                                                ? "bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 scale-[1.02]" 
                                                : "text-slate-400 hover:bg-slate-700/50 hover:text-slate-200"
                                        }`}
                                    >
                                        {tab.label}
                                    </button>
                                ))}
                            </div>
                        </nav>
                    </header>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-grow max-w-7xl w-full mx-auto px-4 py-6">
                        {/* ========================================================= */}
                        {/* TAB 1: PAPAN PEMUKA */}
                        {/* ========================================================= */}
                        {activeTab === "papan_pemuka" && (
                            <div className="space-y-6 animate-in fade-in duration-200">
                                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 pb-4">
                                        <div>
                                            <h2 className="font-black text-slate-900 text-xl tracking-tight">🏆 Kedudukan Keseluruhan Kejohanan</h2>
                                            <p className="text-xs text-slate-500 font-semibold">Kedudukan disusun mengikut hirarki: Emas ➔ Perak ➔ Gangsa ➔ Ke-4 ➔ Jumlah Mata</p>
                                        </div>
                                        <div className="text-right">
                                            <span className="inline-block px-3 py-1 bg-indigo-50 text-indigo-700 border border-indigo-200 text-xs font-bold rounded-full">
                                                Kemaskini Langsung
                                            </span>
                                        </div>
                                    </div>

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="bg-slate-50 border-b border-slate-200 text-[11px] font-black uppercase text-slate-400 tracking-wider">
                                                    <th className="py-3 px-4">Ked.</th>
                                                    <th className="py-3 px-4">Rumah Sukan</th>
                                                    <th className="py-3 px-4 text-center">🥇 Emas</th>
                                                    <th className="py-3 px-4 text-center">🥈 Perak</th>
                                                    <th className="py-3 px-4 text-center">🥉 Gangsa</th>
                                                    <th className="py-3 px-4 text-center">4️⃣ Ke-4</th>
                                                    <th className="py-3 px-4 text-right">Jumlah Mata</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 text-xs font-bold">
                                                {sortedHousesList.map((house, idx) => (
                                                    <tr key={house.key} className="hover:bg-slate-50/80 transition">
                                                        <td className="py-3.5 px-4 font-black">
                                                            <span className={`w-7 h-7 flex items-center justify-center rounded-xl text-white font-black ${
                                                                idx === 0 ? "bg-amber-500 shadow-md shadow-amber-500/20" :
                                                                idx === 1 ? "bg-slate-400" :
                                                                idx === 2 ? "bg-amber-700" : "bg-slate-200 text-slate-600"
                                                            }`}>
                                                                {idx + 1}
                                                            </span>
                                                        </td>
                                                        <td className="py-3.5 px-4">
                                                            <div className="flex items-center space-x-3">
                                                                <span className={`w-3.5 h-3.5 rounded-full ${house.warna}`}></span>
                                                                <div>
                                                                    <p className="font-extrabold text-slate-900">{house.nama}</p>
                                                                    <p className="text-[10px] text-slate-400 italic">"{house.slogan}"</p>
                                                                </div>
                                                            </div>
                                                        </td>
                                                        <td className="py-3.5 px-4 text-center font-extrabold text-amber-600 text-sm">{house.emas}</td>
                                                        <td className="py-3.5 px-4 text-center font-extrabold text-slate-500 text-sm">{house.perak}</td>
                                                        <td className="py-3.5 px-4 text-center font-extrabold text-amber-800 text-sm">{house.gangsa}</td>
                                                        <td className="py-3.5 px-4 text-center font-extrabold text-indigo-600 text-sm">{house.keempat}</td>
                                                        <td className="py-3.5 px-4 text-right font-black text-slate-900 text-base">{house.mata} pt</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                <div className="bg-slate-900 text-white p-6 rounded-2xl shadow-lg space-y-4">
                                    <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                        <h3 className="font-black text-base uppercase tracking-wider flex items-center space-x-2">
                                            <span>📢 Papan Hebahan Semasa Kejohanan</span>
                                        </h3>
                                        <button onClick={() => setActiveTab("hebahan")} className="text-xs text-indigo-400 hover:underline font-bold">
                                            Urus Hebahan ➔
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        {announcements.map(ann => (
                                            <div key={ann.id} className="bg-slate-800/90 border border-slate-700/80 p-4 rounded-xl space-y-1.5">
                                                <div className="flex justify-between items-center text-[10px]">
                                                    <span className={`px-2 py-0.5 rounded font-bold uppercase ${ann.jenis === "Penting" ? "bg-rose-500/20 text-rose-400 border border-rose-500/30" : "bg-blue-500/20 text-blue-400 border border-blue-500/30"}`}>
                                                        {ann.jenis}
                                                    </span>
                                                    <span className="text-slate-400 font-mono">{ann.masa}</span>
                                                </div>
                                                <h4 className="font-extrabold text-slate-100 text-xs">{ann.tajuk}</h4>
                                                <p className="text-slate-300 text-[11px] leading-relaxed">{ann.mesej}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ========================================================= */}
                        {/* TAB 2: RUMAH SUKAN */}
                        {/* ========================================================= */}
                        {activeTab === "rumah_sukan" && (
                            <div className="space-y-6 animate-in fade-in duration-200">
                                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                    <div>
                                        <h2 className="font-black text-slate-900 text-lg">🚩 Pengurusan Rumah Sukan</h2>
                                        <p className="text-xs text-slate-500 font-semibold">Senarai Rumah Sukan, Guru-guru Pembimbing, dan Ahli Kontinjen.</p>
                                    </div>
                                    <div>
                                        <button 
                                            onClick={() => {
                                                setEditingHouseKey(null);
                                                setHouseForm({ nama: "", slogan: "", penasihat: "", warnaKey: "Merah" });
                                                setShowAddHouseModal(true);
                                            }}
                                            className="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xs rounded-xl shadow-md transition flex items-center space-x-1"
                                        >
                                            <span>+ Tambah Rumah Sukan</span>
                                        </button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    {Object.entries(housesMetadata).map(([key, house]) => {
                                        const houseMembers = athletes.filter(a => a.rumah.toLowerCase().includes(key.toLowerCase()) || key.toLowerCase().includes(a.rumah.toLowerCase()));
                                        const teacherList = Array.isArray(house.penasihat) ? house.penasihat : (house.penasihat ? [house.penasihat] : []);

                                        return (
                                            <div key={key} className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col justify-between">
                                                <div className={`p-4 ${house.warna} text-white space-y-2`}>
                                                    <div className="flex justify-between items-start">
                                                        <div>
                                                            <h3 className="font-black text-xl leading-tight">{house.nama}</h3>
                                                            <p className="text-xs opacity-90 italic">"{house.slogan}"</p>
                                                        </div>
                                                        <button 
                                                            onClick={() => {
                                                                setSloganHouseKey(key);
                                                                setSloganInput(house.slogan);
                                                                setShowSloganModal(true);
                                                            }}
                                                            className="px-2.5 py-1 bg-black/20 hover:bg-black/30 rounded-lg text-[10px] font-extrabold backdrop-blur-xs transition"
                                                        >
                                                            ✏️ Edit Slogan
                                                        </button>
                                                    </div>
                                                </div>

                                                <div className="p-4 space-y-5 flex-grow">
                                                    <div className="space-y-2">
                                                        <div className="flex justify-between items-center border-b border-slate-100 pb-2">
                                                            <h4 className="font-extrabold text-slate-800 text-xs flex items-center space-x-1">
                                                                <span>👨‍🏫 Guru-Guru Pembimbing</span>
                                                                <span className="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full text-[10px]">{teacherList.length}</span>
                                                            </h4>
                                                            <button 
                                                                onClick={() => {
                                                                    setTeacherHouseKey(key);
                                                                    setTeacherIndex(null);
                                                                    setTeacherInput("");
                                                                    setShowTeacherModal(true);
                                                                }}
                                                                className="px-2.5 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-extrabold text-[11px] rounded-lg transition"
                                                            >
                                                                + Tambah Guru
                                                            </button>
                                                        </div>

                                                        {teacherList.length === 0 ? (
                                                            <p className="text-[11px] text-slate-400 italic">Tiada guru pembimbing didaftarkan.</p>
                                                        ) : (
                                                            <div className="flex flex-wrap gap-1.5">
                                                                {teacherList.map((tName, tIdx) => (
                                                                    <div key={tIdx} className="flex items-center space-x-1.5 bg-slate-50 border border-slate-200 px-2.5 py-1 rounded-xl text-xs font-bold text-slate-700">
                                                                        <span>{tName}</span>
                                                                        <button 
                                                                            onClick={() => {
                                                                                setTeacherHouseKey(key);
                                                                                setTeacherIndex(tIdx);
                                                                                setTeacherInput(tName);
                                                                                setShowTeacherModal(true);
                                                                            }}
                                                                            className="text-indigo-600 hover:text-indigo-800 text-[10px]"
                                                                            title="Edit Guru"
                                                                        >
                                                                            ✏️
                                                                        </button>
                                                                        <button 
                                                                            onClick={() => handleDeleteTeacher(key, tIdx)}
                                                                            className="text-rose-500 hover:text-rose-700 text-[10px]"
                                                                            title="Padam Guru"
                                                                        >
                                                                            ✕
                                                                        </button>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>

                                                    <div className="space-y-2">
                                                        <div className="flex justify-between items-center border-b border-slate-100 pb-2">
                                                            <h4 className="font-extrabold text-slate-800 text-xs flex items-center space-x-1">
                                                                <span>🏃 Senarai Ahli (Atlet)</span>
                                                                <span className="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full text-[10px]">{houseMembers.length} Orang</span>
                                                            </h4>
                                                            <button 
                                                                onClick={() => {
                                                                    setAthleteForm({ id: "", noAtlet: "", nama: "", kelas: "", rumah: key, jantina: "Lelaki", kategori: "L12" });
                                                                    setIsEditingAthlete(false);
                                                                    setIsAddAthleteSidebarOpen(true);
                                                                }}
                                                                className="px-2.5 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-extrabold text-[11px] rounded-lg transition"
                                                            >
                                                                + Tambah Ahli
                                                            </button>
                                                        </div>

                                                        {houseMembers.length === 0 ? (
                                                            <p className="text-[11px] text-slate-400 italic py-2">Tiada ahli didaftarkan di bawah rumah sukan ini.</p>
                                                        ) : (
                                                            <div className="max-h-60 overflow-y-auto divide-y divide-slate-100 border rounded-xl">
                                                                {houseMembers.map((ath, idx) => (
                                                                    <div key={ath.id} className="p-2.5 flex items-center justify-between hover:bg-slate-50 transition text-xs">
                                                                        <div className="space-y-0.5">
                                                                            <div className="flex items-center space-x-2">
                                                                                <span className="font-extrabold text-slate-900 uppercase">{idx + 1}. {ath.nama}</span>
                                                                                {ath.noAtlet && <span className="bg-slate-100 font-mono text-[10px] px-1.5 py-0.2 rounded font-bold">{ath.noAtlet}</span>}
                                                                            </div>
                                                                            <p className="text-[10px] text-slate-500 font-semibold">
                                                                                Kelas: {ath.kelas} | Jantina: {ath.jantina} | Kategori: <strong className="text-indigo-600">{ath.kategori}</strong>
                                                                            </p>
                                                                        </div>
                                                                        <div className="flex items-center space-x-1 font-bold">
                                                                            <button 
                                                                                onClick={() => {
                                                                                    setAthleteForm(ath);
                                                                                    setIsEditingAthlete(true);
                                                                                    setIsAddAthleteSidebarOpen(true);
                                                                                }}
                                                                                className="px-2 py-1 bg-indigo-50 text-indigo-600 rounded hover:bg-indigo-100 text-[10px]"
                                                                            >
                                                                                Edit
                                                                            </button>
                                                                            <button 
                                                                                onClick={() => handleDeleteAthlete(ath.id, ath.nama)}
                                                                                className="px-2 py-1 bg-rose-50 text-rose-600 rounded hover:bg-rose-100 text-[10px]"
                                                                            >
                                                                                Padam
                                                                            </button>
                                                                        </div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* ========================================================= */}
                        {/* TAB 3: ACARA SUKAN */}
                        {/* ========================================================= */}
                        {activeTab === "acara_sukan" && (
                            <div className="space-y-6 animate-in fade-in duration-200">
                                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                                    <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 border-b border-slate-100 pb-4">
                                        <div>
                                            <h2 className="font-black text-slate-900 text-lg">⏱️ Jadual & Pengurusan Acara Sukan</h2>
                                            <p className="text-xs text-slate-500 font-semibold">
                                                Urus acara mengikut kategori. 💡 <em>Nota: Murid berkategori spesifik (Contoh: L9) layak sertai acara L9 dan acara L9TKB secara automatik.</em>
                                            </p>
                                        </div>

                                        <div className="flex items-center bg-slate-100 p-1 rounded-xl self-start lg:self-center border border-slate-200">
                                            <button
                                                onClick={() => setSchoolType("rendah")}
                                                className={`px-4 py-2 rounded-lg text-xs font-black transition-all flex items-center space-x-1.5 ${
                                                    schoolType === "rendah" 
                                                        ? "bg-indigo-600 text-white shadow-md scale-[1.02]" 
                                                        : "text-slate-600 hover:text-slate-900"
                                                }`}
                                            >
                                                <span>🏫 Sekolah Rendah</span>
                                            </button>
                                            <button
                                                onClick={() => setSchoolType("menengah")}
                                                className={`px-4 py-2 rounded-lg text-xs font-black transition-all flex items-center space-x-1.5 ${
                                                    schoolType === "menengah" 
                                                        ? "bg-indigo-600 text-white shadow-md scale-[1.02]" 
                                                        : "text-slate-600 hover:text-slate-900"
                                                }`}
                                            >
                                                <span>🏛️ Sekolah Menengah</span>
                                            </button>
                                        </div>
                                    </div>

                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                        <div className="flex flex-wrap items-center gap-2">
                                            <input 
                                                type="text" 
                                                placeholder="Cari acara / masa..."
                                                value={eventSearchTerm}
                                                onChange={(e) => setEventSearchTerm(e.target.value)}
                                                className="px-3 py-2 border rounded-xl text-xs font-semibold focus:ring-2 focus:ring-indigo-500 w-36 sm:w-48"
                                            />
                                            <select
                                                value={eventCategoryFilter}
                                                onChange={(e) => setEventCategoryFilter(e.target.value)}
                                                className="px-3 py-2 border rounded-xl text-xs font-bold focus:ring-2 focus:ring-indigo-500 bg-white"
                                            >
                                                <option value="Semua">Semua Kategori ({schoolType === "rendah" ? "SR" : "SM"})</option>
                                                {activeCategories.map(cat => (
                                                    <option key={cat.id} value={cat.kod}>
                                                        {cat.kod} - {cat.nama}
                                                    </option>
                                                ))}
                                            </select>

                                            {/* TKB Filter Checkbox */}
                                            {eventCategoryFilter !== "Semua" && (
                                                <label className="flex items-center space-x-1.5 bg-purple-50 border border-purple-200 px-2.5 py-1.5 rounded-xl text-xs font-bold text-purple-900 cursor-pointer">
                                                    <input 
                                                        type="checkbox" 
                                                        checked={includeTkbFilter}
                                                        onChange={(e) => setIncludeTkbFilter(e.target.checked)}
                                                        className="rounded text-purple-600 focus:ring-purple-500"
                                                    />
                                                    <span>Paparkan Acara TKB Berkaitan ({eventCategoryFilter}TKB)</span>
                                                </label>
                                            )}
                                        </div>

                                        <div className="flex items-center space-x-2">
                                            <button 
                                                onClick={() => {
                                                    setCategoryForm({ id: "", kod: "", nama: "", jenisSekolah: schoolType, penerangan: "" });
                                                    setIsEditingCategory(false);
                                                    setShowCategoryModal(true);
                                                }}
                                                className="px-3.5 py-2 bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-xs rounded-xl shadow-sm transition flex items-center space-x-1"
                                            >
                                                <span>🏷️ Urus Kategori</span>
                                            </button>

                                            <button 
                                                onClick={() => {
                                                    const defaultCategory = activeCategories[0] ? activeCategories[0].kod : "L12";
                                                    setEventForm({ id: "", nama: "", kategori: defaultCategory, jenis: "Balapan", masa: "09:00 AM", status: "Belum Mula" });
                                                    setIsEditingEvent(false);
                                                    setShowEventModal(true);
                                                }}
                                                className="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xs rounded-xl shadow-sm transition flex items-center space-x-1"
                                            >
                                                <span>+ Tambah Acara</span>
                                            </button>
                                        </div>
                                    </div>

                                    {/* Active Categories Badges */}
                                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-200/80 space-y-2">
                                        <div className="flex justify-between items-center text-[11px] font-extrabold text-slate-700">
                                            <span>Senarai Kategori {schoolType === "rendah" ? "Sekolah Rendah" : "Sekolah Menengah"} Aktif & Nota TKB:</span>
                                        </div>
                                        <div className="flex flex-wrap gap-2">
                                            {activeCategories.map(cat => (
                                                <div key={cat.id} className="group relative bg-white border border-slate-200 px-2.5 py-1 rounded-lg text-xs font-bold text-slate-800 shadow-2xs flex items-center space-x-1.5">
                                                    <span className={`px-1.5 py-0.2 rounded text-[10px] uppercase font-black ${cat.kod.includes("TKB") ? "bg-purple-100 text-purple-700 border border-purple-200" : "bg-indigo-100 text-indigo-700"}`}>
                                                        {cat.kod}
                                                    </span>
                                                    <span className="text-[11px]">{cat.nama}</span>
                                                    <button 
                                                        onClick={() => {
                                                            setCategoryForm(cat);
                                                            setIsEditingCategory(true);
                                                            setShowCategoryModal(true);
                                                        }}
                                                        className="text-indigo-600 hover:text-indigo-800 ml-1 text-[10px]"
                                                        title="Sunting Kategori"
                                                    >
                                                        ✏️
                                                    </button>
                                                    <button 
                                                        onClick={() => handleDeleteCategory(cat.id, cat.kod)}
                                                        className="text-rose-500 hover:text-rose-700 text-[10px]"
                                                        title="Padam Kategori"
                                                    >
                                                        ✕
                                                    </button>

                                                    <div className="hidden group-hover:block absolute bottom-full left-0 mb-1 w-56 p-2.5 bg-slate-900 text-white text-[10px] rounded-lg shadow-xl z-30 font-normal leading-tight">
                                                        <p className="font-bold text-amber-300">{cat.kod} - {cat.nama}</p>
                                                        <p className="mt-1">{cat.penerangan}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* Events List */}
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {events
                                        .filter(ev => {
                                            const matchesSearch = ev.nama.toLowerCase().includes(eventSearchTerm.toLowerCase()) || ev.masa.toLowerCase().includes(eventSearchTerm.toLowerCase());
                                            
                                            let matchesCat = true;
                                            if (eventCategoryFilter !== "Semua") {
                                                if (includeTkbFilter) {
                                                    matchesCat = isCategoryCompatible(eventCategoryFilter, ev.kategori);
                                                } else {
                                                    matchesCat = ev.kategori === eventCategoryFilter;
                                                }
                                            }

                                            return matchesSearch && matchesCat;
                                        })
                                        .map(ev => {
                                            const catInfo = categories.find(c => c.kod === ev.kategori);
                                            const isTkb = ev.kategori.includes("TKB");

                                            return (
                                                <div key={ev.id} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3 flex flex-col justify-between hover:border-indigo-200 transition">
                                                    <div className="space-y-2">
                                                        <div className="flex justify-between items-center">
                                                            <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase ${ev.jenis === "Balapan" ? "bg-indigo-100 text-indigo-700" : "bg-emerald-100 text-emerald-700"}`}>
                                                                {ev.jenis}
                                                            </span>
                                                            <span className="text-xs text-slate-400 font-mono font-bold">🕒 {ev.masa}</span>
                                                        </div>
                                                        <h3 className="font-black text-slate-900 text-base">{ev.nama}</h3>
                                                        <div className="space-y-1">
                                                            <div className="flex items-center space-x-2 text-xs font-semibold text-slate-500">
                                                                <span>Kategori: </span>
                                                                <span className={`px-2 py-0.5 rounded text-xs font-black ${isTkb ? "bg-purple-100 text-purple-800 border border-purple-300" : "bg-indigo-50 text-indigo-800"}`}>
                                                                    {ev.kategori}
                                                                </span>
                                                                {isTkb && (
                                                                    <span className="text-[10px] text-purple-600 font-bold bg-purple-50 px-1.5 py-0.2 rounded border border-purple-100">
                                                                        Termasuk murid {ev.kategori.replace("TKB", "")}
                                                                    </span>
                                                                )}
                                                            </div>
                                                            {catInfo && (
                                                                <p className="text-[10px] text-slate-500 italic bg-slate-50 p-1.5 rounded-lg border border-slate-100">
                                                                    💡 {catInfo.penerangan}
                                                                </p>
                                                            )}
                                                        </div>
                                                    </div>

                                                    <div className="pt-3 border-t border-slate-100 flex items-center justify-between">
                                                        <button 
                                                            onClick={() => handleToggleEventStatus(ev.id)}
                                                            className={`text-xs font-extrabold px-2.5 py-1 rounded-lg transition ${
                                                                ev.status === "Selesai" ? "bg-emerald-100 text-emerald-700 hover:bg-emerald-200" : 
                                                                ev.status === "Sedang Berlangsung" ? "bg-amber-100 text-amber-700 hover:bg-amber-200" : 
                                                                "bg-slate-100 text-slate-600 hover:bg-slate-200"
                                                            }`}
                                                        >
                                                            ● {ev.status}
                                                        </button>
                                                        <div className="space-x-2 text-xs font-bold">
                                                            <button 
                                                                onClick={() => {
                                                                    setEventForm(ev);
                                                                    setIsEditingEvent(true);
                                                                    setShowEventModal(true);
                                                                }}
                                                                className="text-indigo-600 hover:underline"
                                                            >
                                                                Sunting
                                                            </button>
                                                            <button 
                                                                onClick={() => handleDeleteEvent(ev.id, ev.nama)}
                                                                className="text-rose-600 hover:underline"
                                                            >
                                                                Padam
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                </div>
                            </div>
                        )}

                        {/* ========================================================= */}
                        {/* TAB 4: PENGURUSAN ATLET */}
                        {/* ========================================================= */}
                        {activeTab === "pengurusan_atlet" && (
                            <div className="space-y-6 animate-in fade-in duration-200">
                                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
                                    <div>
                                        <h2 className="font-black text-slate-900 text-lg">🏃 Senarai Pendaftaran Atlet</h2>
                                        <p className="text-xs text-slate-500 font-semibold">Urus maklumat murid, nombor atlet (Bib), rumah sukan dan kategori umur (termasuk L9/P9 & TKB).</p>
                                    </div>
                                    <div className="flex flex-wrap items-center gap-2">
                                        <input 
                                            type="text" 
                                            placeholder="Cari nama / bib / kelas..."
                                            value={athleteSearchTerm}
                                            onChange={(e) => setAthleteSearchTerm(e.target.value)}
                                            className="px-3 py-2 border rounded-xl text-xs font-semibold focus:ring-2 focus:ring-indigo-500 w-44 sm:w-60"
                                        />
                                        <button 
                                            onClick={() => {
                                                const defaultHouse = Object.keys(housesMetadata)[0] || "Merah";
                                                setBulkHouse(defaultHouse);
                                                setShowBulkModal(true);
                                            }}
                                            className="px-3 py-2 bg-amber-600 hover:bg-amber-700 text-white font-extrabold text-xs rounded-xl shadow-sm transition flex items-center space-x-1"
                                        >
                                            <span>📥 Import Pukal (TSV)</span>
                                        </button>
                                        <button 
                                            onClick={() => {
                                                const defaultHouse = Object.keys(housesMetadata)[0] || "Merah";
                                                setAthleteForm({ id: "", noAtlet: "", nama: "", kelas: "", rumah: defaultHouse, jantina: "Lelaki", kategori: "L12" });
                                                setIsEditingAthlete(false);
                                                setIsAddAthleteSidebarOpen(true);
                                            }}
                                            className="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xs rounded-xl shadow-sm transition"
                                        >
                                            + Tambah Atlet
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-xs font-semibold">
                                            <thead>
                                                <tr className="bg-slate-50 border-b border-slate-200 text-slate-400 uppercase text-[10px] tracking-wider">
                                                    <th className="py-3 px-4">Bil</th>
                                                    <th className="py-3 px-4">Bib</th>
                                                    <th className="py-3 px-4">Nama Penuh</th>
                                                    <th className="py-3 px-4">Kelas</th>
                                                    <th className="py-3 px-4">Rumah Sukan</th>
                                                    <th className="py-3 px-4">Jantina</th>
                                                    <th className="py-3 px-4">Kategori Murid</th>
                                                    <th className="py-3 px-4">Layak Acara</th>
                                                    <th className="py-3 px-4 text-right">Tindakan</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {athletes
                                                    .filter(a => 
                                                        a.nama.toLowerCase().includes(athleteSearchTerm.toLowerCase()) || 
                                                        a.kelas.toLowerCase().includes(athleteSearchTerm.toLowerCase()) ||
                                                        a.rumah.toLowerCase().includes(athleteSearchTerm.toLowerCase()) ||
                                                        (a.noAtlet && a.noAtlet.toLowerCase().includes(athleteSearchTerm.toLowerCase()))
                                                    )
                                                    .map((ath, idx) => {
                                                        const isTkbCat = ath.kategori.includes("TKB");
                                                        const eligibleCat = isTkbCat ? ath.kategori : `${ath.kategori} & ${ath.kategori}TKB`;

                                                        return (
                                                            <tr key={ath.id} className="hover:bg-slate-50 transition">
                                                                <td className="py-3 px-4 text-slate-400 font-mono">{idx + 1}</td>
                                                                <td className="py-3 px-4">
                                                                    <span className="bg-slate-100 text-slate-700 font-mono px-2 py-0.5 rounded text-[11px] font-extrabold">
                                                                        {ath.noAtlet || "-"}
                                                                    </span>
                                                                </td>
                                                                <td className="py-3 px-4 font-extrabold text-slate-900 uppercase">{ath.nama}</td>
                                                                <td className="py-3 px-4 text-slate-600">{ath.kelas}</td>
                                                                <td className="py-3 px-4">
                                                                    <span className="font-extrabold text-indigo-700">{ath.rumah}</span>
                                                                </td>
                                                                <td className="py-3 px-4">
                                                                    <span className={`px-2 py-0.5 rounded text-[10px] font-extrabold ${ath.jantina === "Lelaki" ? "bg-blue-100 text-blue-700" : "bg-pink-100 text-pink-700"}`}>
                                                                        {ath.jantina}
                                                                    </span>
                                                                </td>
                                                                <td className="py-3 px-4 text-slate-700 font-black">{ath.kategori}</td>
                                                                <td className="py-3 px-4">
                                                                    <span className="bg-purple-50 text-purple-700 border border-purple-200 px-2 py-0.5 rounded text-[10px] font-bold">
